[package]
name = "lightbridge-authz"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
clap.workspace = true
dotenvy.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
chrono.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
lightbridge-authz-api.workspace = true
lightbridge-authz-api-key.workspace = true
lightbridge-authz-bearer.workspace = true
lightbridge-authz-core = { workspace = true, features = ["axum"] }
lightbridge-authz-rest.workspace = true
mimalloc.workspace = true
sqlx.workspace = true
# MCP CRUD tools call the generated cratestack client directly (ADR-0003): they build a
# `schema::Cratestack` over cratestack's own sqlx pool and project the caller into a `CoolContext`,
# so the app needs the `cratestack` (package `cratestack-pg`) runtime types the same way the rest
# crate does.
cratestack.workspace = true

[dev-dependencies]
anyhow.workspace = true
tower.workspace = true
