[package]
name = "lightbridge-authz"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
clap.workspace = true
dotenvy.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
chrono.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
lightbridge-authz-api.workspace = true
lightbridge-authz-api-key.workspace = true
lightbridge-authz-bearer.workspace = true
# `budget grant` books through `BudgetRepo::grant` -- the domain layer, never a direct
# `budget_balances` update (ADR-0009). Production dependency since #694's follow-up, not just dev.
lightbridge-authz-budget.workspace = true
lightbridge-authz-core = { workspace = true, features = ["axum"] }
lightbridge-authz-rest.workspace = true
mimalloc.workspace = true
sqlx.workspace = true
# MCP CRUD tools call the generated cratestack client directly (ADR-0003): they build a
# `schema::Cratestack` over cratestack's own sqlx pool and project the caller into a `CratestackContext`,
# so the app needs the `cratestack` (package `cratestack-pg`) runtime types the same way the rest
# crate does.
cratestack.workspace = true

[dev-dependencies]
anyhow.workspace = true
tower.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[features]
it-tests = []
