---
services:
  authz-tls:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /tls /host_tls
        apk add --no-cache openssl
        for host_file in ca.key ca.crt api.key api.crt opa.key opa.crt usage.key usage.crt mcp.key mcp.crt idp.key idp.crt budget.key budget.crt; do
          if [ -f /host_tls/$$host_file ]; then
            cp /host_tls/$$host_file /tls/$$host_file
          fi
        done
        # A single shared local CA, mirroring prod's ClusterIssuer/self-signed-ca: every service
        # leaf below is signed by this CA (not self-signed independently, like before #347) so
        # authz-usage's client_ca_bundle_path has something real to verify a presented client
        # certificate against. ca.crt lives in the same /tls directory every app container
        # mounts, exactly like the deployed authz-tls Secret carries ca.crt alongside
        # tls.crt/tls.key in a single mount (see AGENTS.md's "Identity context resolution").
        if [ ! -f /tls/ca.key ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout /tls/ca.key -out /tls/ca.crt \
            -subj "/CN=lightbridge-local-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
        fi
        # Every leaf below carries both serverAuth and clientAuth EKU, matching the deployed
        # authz-tls cert's actual shape (confirmed against the live cluster: `kubectl -n converse
        # get certificate authz-tls -o yaml` shows `usages: [server auth, client auth]`) -- so any
        # of these certs can serve as either a server identity (existing TLS) or a client identity
        # for mTLS (#347) without needing a second cert-issuance mechanism.
        issue_leaf() {
          name="$$1"
          cn="$$2"
          if [ ! -f "/tls/$${name}.key" ]; then
            openssl req -newkey rsa:2048 -nodes \
              -keyout "/tls/$${name}.key" -out "/tls/$${name}.csr" \
              -subj "/CN=$${cn}"
            printf 'subjectAltName=DNS:%s\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth,clientAuth\n' "$${cn}" > "/tls/$${name}.ext"
            openssl x509 -req -in "/tls/$${name}.csr" \
              -CA /tls/ca.crt -CAkey /tls/ca.key -CAcreateserial \
              -days 3650 -out "/tls/$${name}.crt" \
              -extfile "/tls/$${name}.ext"
            rm -f "/tls/$${name}.csr" "/tls/$${name}.ext"
          fi
        }
        issue_leaf api authz-api
        issue_leaf opa authz-opa
        issue_leaf usage authz-usage
        issue_leaf mcp authz-mcp
        issue_leaf idp authz-idp
        issue_leaf budget authz-budget
        for tls_file in ca.crt ca.key api.crt api.key opa.crt opa.key usage.crt usage.key mcp.crt mcp.key idp.crt idp.key budget.crt budget.key; do
          chmod 644 /tls/$$tls_file
          chown 65532:65532 /tls/$$tls_file
          if [ -f /tls/$$tls_file ]; then
            cp /tls/$$tls_file /host_tls/$$tls_file
            chmod 644 /host_tls/$$tls_file
          fi
        done
        chown -R 65532:65532 /tls
        chmod 755 /tls
        chown -R 65532:65532 /host_tls
        chmod 755 /host_tls
    volumes:
      - "authz_tls:/tls"
      - "./config/tls:/host_tls"

  postgresql:
    image: docker.io/bitnamilegacy/postgresql:17
    ports:
      - '5432:5432'
    volumes:
      - "postgresql_data:/bitnami/postgresql"
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      POSTGRESQL_DATABASE: "lightbridge_authz"
      # `just it-tests` runs each rpc_it_tests.rs test with its own connection pools under
      # `cargo test`'s default full parallelism (~16 tests x 3 pools), which can approach/exceed
      # the driver default (100) and intermittently fails with "pool timed out while waiting for
      # an open connection" -- headroom only, no effect on prod (which configures its own Postgres).
      POSTGRESQL_MAX_CONNECTIONS: "300"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lightbridge_authz -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg17
    ports:
      - "5433:5432"
    volumes:
      - "timescaledb_data:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "lightbridge_authz_usage"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lightbridge_authz_usage -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12

  adminer:
    image: adminer
    ports:
      - "18080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USERNAME: ${POSTGRES_USER:-postgres}
      ADMINER_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-postgres-password}
      ADMINER_DESIGN: ${ADMINER_DESIGN:-dracula}
      ADMINER_PLUGINS: ${ADMINER_PLUGINS:-tables-filter tinymce}

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    ports:
      - "9100:9100"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
      KC_LOG_CONSOLE_COLOR: "true"
      KC_HTTP_PORT: 9100
      KC_HOSTNAME: "http://localhost:9100"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -ex

        /opt/keycloak/bin/kc.sh start-dev --import-realm # Start Keycloak in dev mode and import the realm
    volumes:
      - ./.docker/keycloak_config/:/opt/keycloak/data/import/:ro

  authz-migrate:
    image: lightbridge-authz-migrate
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    build:
      context: .
      target: runtime
    command:
      - migrate
    volumes:
      - "./.docker/authz/container.yaml:/tmp/config.yaml:ro"
      - "authz_tls:/tls"
    environment:
      RUST_LOG: "debug"
      CONFIG_PATH: "/tmp/config.yaml"
    depends_on:
      postgresql:
        condition: service_healthy

  authz-api:
    image: lightbridge-authz
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      authz-migrate:
        condition: service_completed_successfully
      authz-tls:
        condition: service_started
      # Budget refill spend facts call authz-usage's /usage/v1/spend/query over HTTP (see
      # .docker/authz/container.yaml's usage_service block) -- wait for it to be healthy so
      # authz-api doesn't start racing a usage service that isn't listening yet. Not a hard
      # requirement for authz-api to start at all (usage_service degrades to Spend::Unavailable
      # when unreachable), just for avoiding a spurious warm-up failure window.
      authz-usage:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    build:
      context: .
      target: runtime
    volumes:
      - ./.docker/authz/container.yaml:/tmp/config.yaml:ro
      - "authz_tls:/tls:ro"
    environment:
      RUST_LOG: "debug,opentelemetry_sdk=warn,opentelemetry_otlp=warn,h2=warn,hyper_util=warn,tower=warn"
      CONFIG_PATH: "/tmp/config.yaml"
      # Read directly by cratestack's own sqlx pool (the RPC surface's `datasource ...
      # env("DATABASE_URL")` declaration, see docs/adr/0003-cratestack-crud-migration.md) — separate
      # from the core `DbPool`, which reads `database.url` out of CONFIG_PATH's YAML instead.
      DATABASE_URL: "postgres://postgres:postgres@postgresql:5432/lightbridge_authz"
    ports:
      - "13000:3000"
    command:
      - api
    healthcheck:
      test: ["CMD", "/usr/local/bin/lightbridge-authz-healthcheck", "-r", "3000"]
      interval: 30s
      timeout: 3s
      start_period: 1s
      retries: 3

  authz-opa:
    image: lightbridge-authz
    depends_on:
      postgresql:
        condition: service_healthy
      authz-migrate:
        condition: service_completed_successfully
      authz-tls:
        condition: service_started
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    volumes:
      - ./.docker/authz/container.yaml:/tmp/config.yaml:ro
      - "authz_tls:/tls:ro"
    environment:
      RUST_LOG: "debug,opentelemetry_sdk=warn,opentelemetry_otlp=warn,h2=warn,hyper_util=warn,tower=warn"
      CONFIG_PATH: "/tmp/config.yaml"
    ports:
      - "13001:3001"
    command:
      - opa
    healthcheck:
      test: ["CMD", "/usr/local/bin/lightbridge-authz-healthcheck", "-r", "3001"]
      interval: 30s
      timeout: 3s
      start_period: 1s
      retries: 3

  authz-idp:
    image: lightbridge-authz
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      authz-migrate:
        condition: service_completed_successfully
      authz-tls:
        condition: service_started
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    volumes:
      - ./.docker/authz/container.yaml:/tmp/config.yaml:ro
      - "authz_tls:/tls:ro"
    environment:
      RUST_LOG: "debug,opentelemetry_sdk=warn,opentelemetry_otlp=warn,h2=warn,hyper_util=warn,tower=warn"
      CONFIG_PATH: "/tmp/config.yaml"
      IDP_TLS_CERT_PATH: "/tls/idp.crt"
      IDP_TLS_KEY_PATH: "/tls/idp.key"
    ports:
      - "13004:3004"
    command:
      - idp
    healthcheck:
      test: ["CMD", "/usr/local/bin/lightbridge-authz-healthcheck", "-r", "3004"]
      interval: 30s
      timeout: 3s
      start_period: 1s
      retries: 3

  # authz-budget: the budget-domain microservice carrying every budget:*-gated RPC procedure off
  # authz-api (hard cutover -- see docs/architecture/budget.md). Unlike authz-idp above, authz-api
  # no longer serves this surface at all once this lands, so there is no transitional overlap.
  authz-budget:
    image: lightbridge-authz
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      authz-migrate:
        condition: service_completed_successfully
      authz-tls:
        condition: service_started
      # Budget refill spend facts call authz-usage's /usage/v1/spend/query over HTTP, same as
      # authz-api's identical dependency above -- not a hard requirement to start (usage_service
      # degrades to Spend::Unavailable when unreachable), just avoiding a spurious warm-up race.
      authz-usage:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    volumes:
      - ./.docker/authz/container.yaml:/tmp/config.yaml:ro
      - "authz_tls:/tls:ro"
    environment:
      RUST_LOG: "debug,opentelemetry_sdk=warn,opentelemetry_otlp=warn,h2=warn,hyper_util=warn,tower=warn"
      CONFIG_PATH: "/tmp/config.yaml"
      BUDGET_TLS_CERT_PATH: "/tls/budget.crt"
      BUDGET_TLS_KEY_PATH: "/tls/budget.key"
      # Read directly by cratestack's own sqlx pool, same as authz-api's identical variable above
      # -- required to construct the `Procedures` registry even though this server only ever
      # dispatches budget:*-gated op-ids (see build_budget_router's doc comment).
      DATABASE_URL: "postgres://postgres:postgres@postgresql:5432/lightbridge_authz"
    ports:
      - "13005:3005"
    command:
      - budget
    healthcheck:
      test: ["CMD", "/usr/local/bin/lightbridge-authz-healthcheck", "-r", "3005"]
      interval: 30s
      timeout: 3s
      start_period: 1s
      retries: 3

  authz-mcp:
    image: lightbridge-mcp
    depends_on:
      postgresql:
        condition: service_healthy
      authz-migrate:
        condition: service_completed_successfully
      authz-tls:
        condition: service_started
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    build:
      context: .
      target: mcp-runtime
    volumes:
      - ./.docker/authz/container.yaml:/tmp/config.yaml:ro
      - "authz_tls:/tls:ro"
    environment:
      RUST_LOG: "debug,opentelemetry_sdk=warn,opentelemetry_otlp=warn,h2=warn,hyper_util=warn,tower=warn"
      CONFIG_PATH: "/tmp/config.yaml"
      TLS_CERT_PATH: "/tls/mcp.crt"
      TLS_KEY_PATH: "/tls/mcp.key"
      # cratestack builds its own sqlx pool directly from this env var (see
      # crates/lightbridge-authz-api/schema/authz.cstack's `env("DATABASE_URL")` datasource);
      # it does not read database.url out of the mounted config.yaml.
      DATABASE_URL: "postgres://postgres:postgres@postgresql:5432/lightbridge_authz"
    ports:
      - "13003:3000"
    command:
      - serve
    healthcheck:
      test: ["CMD", "/usr/local/bin/lightbridge-authz-healthcheck", "-r", "3000"]
      interval: 30s
      timeout: 3s
      start_period: 1s
      retries: 3

  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    depends_on:
      authz-mcp:
        condition: service_started
    environment:
      HOST: "0.0.0.0"
      MCP_AUTO_OPEN_ENABLED: "false"
      NODE_EXTRA_CA_CERTS: "/tls/mcp.crt"
    volumes:
      - "authz_tls:/tls:ro"
    ports:
      - "127.0.0.1:6274:6274"
      - "127.0.0.1:6277:6277"

  authz-usage-migrate:
    image: lightbridge-authz-usage
    build:
      context: .
      target: usage-runtime
    command:
      - migrate
    volumes:
      - "./.docker/usage/container.yaml:/tmp/config.yaml:ro"
    environment:
      RUST_LOG: "debug"
      CONFIG_PATH: "/tmp/config.yaml"
    depends_on:
      timescaledb:
        condition: service_healthy

  authz-usage:
    image: lightbridge-authz-usage
    build:
      context: .
      target: usage-runtime
    command:
      - serve
    volumes:
      - "./.docker/usage/container.yaml:/tmp/config.yaml:ro"
      - "authz_tls:/tls:ro"
    environment:
      RUST_LOG: "debug,opentelemetry_sdk=warn,opentelemetry_otlp=warn,h2=warn,hyper_util=warn,tower=warn"
      CONFIG_PATH: "/tmp/config.yaml"
    ports:
      - "13002:3002" # ingest listener (unauthenticated, /v1/otel/*)
      - "13006:3006" # query listener (mTLS-required, #347 -- /usage/v1/usage/query, /usage/v1/spend/query)
    depends_on:
      timescaledb:
        condition: service_healthy
      authz-usage-migrate:
        condition: service_completed_successfully
      authz-tls:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/lightbridge-authz-healthcheck", "-r", "3002"]
      interval: 30s
      timeout: 3s
      start_period: 1s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  postgresql_data:
    driver: local
  authz_tls:
    driver: local
  timescaledb_data:
    driver: local
