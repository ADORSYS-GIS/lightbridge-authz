[licenses]
unused-allowed-license = "warn"
confidence-threshold = 0.95
allow = [
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0"
]

[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0214",
    # crypto-bigint 0.5.5 (RUSTSEC-2026-0387, secret-dependent branches in "constant-time" ops;
    # fixed only in 0.7.6, a major away). It arrives through elliptic-curve 0.13 -> p256/p384 ->
    # jsonwebtoken 11, which is how authkestra VERIFIES ES256/ES384 tokens from upstream issuers.
    # Verification works on public keys and public signatures, so there is no secret to leak.
    # Every key this repo signs with is RSA (`signing.rs` ALGORITHM, `refresh_token.rs`), which
    # does not use crypto-bigint 0.5. Re-check if an EC signing key is ever introduced; remove
    # when jsonwebtoken moves to elliptic-curve 0.14.
    "RUSTSEC-2026-0387",
    # chrono is UNMAINTAINED (RUSTSEC-2026-0543; not a vulnerability, no successor release). It is
    # the time type of sqlx, utoipa, authkestra and every crate here, so replacing it is its own
    # migration, tracked separately. Remove this with it.
    "RUSTSEC-2026-0543",
    # unsafe-libyaml is UNMAINTAINED (not a vulnerability; no patched release exists), pulled in by
    # the deprecated serde_yaml that parses operator-supplied config files. Replacing serde_yaml is
    # its own change, tracked separately. Remove this with it.
    "RUSTSEC-2024-0449",
]

# The temporary marcjazz/authkestra git-pin exemption this section used to carry is gone: root
# Cargo.toml moved authkestra-engine/authkestra-op/authkestra-resource to a crates.io `0.5.0`
# version pin once upstream cut that release (see the comment there). No git dependency is
# exempted here any more — any git dependency now fails `cargo deny check sources` outright.
[sources]
unknown-git = "deny"
