server:
  # Ingest-only listener: /v1/otel/{traces,metrics,logs} + health probes + Swagger docs.
  # Unauthenticated, unchanged by #347 -- see UsageServerGroup::usage's doc comment for why this
  # listener cannot require a client certificate (its caller is an AI Envoy/OpenTelemetry exporter
  # outside this repo's deploy surface).
  usage:
    address: "0.0.0.0"
    port: 3002
    tls:
      cert_path: "/tls/usage.crt"
      key_path: "/tls/usage.key"
  # mTLS-required listener (#347): /usage/v1/usage/query + /usage/v1/spend/query. Requires and
  # verifies a client certificate signed by the same local CA the authz-tls compose service signs
  # every service leaf with. This is live (not commented out, unlike ca_bundle_path elsewhere in
  # this repo) because #347's acceptance criteria calls for Local Compose to actually exercise
  # mTLS end-to-end, not just document the shape -- see UsageServerGroup::query's doc comment.
  query:
    address: "0.0.0.0"
    port: 3006
    tls:
      cert_path: "/tls/usage.crt"
      key_path: "/tls/usage.key"
      client_ca_bundle_path: "/tls/ca.crt"
logging:
  level: "info"
database:
  # Same silent-misconfiguration bug class as config/default.yaml's database.url (lightbridge-
  # authz#PR447), extended here for consistency. USAGE_DATABASE_URL (not DATABASE_URL) -- see the
  # identical note in config/usage.yaml for why reusing DATABASE_URL would risk silently repointing
  # this service at the main authz database instead. Behavior-preserving today: no compose service
  # sets USAGE_DATABASE_URL, so this always resolves to the fallback below, unchanged from before.
  url: "${USAGE_DATABASE_URL:-postgres://postgres:postgres@timescaledb:5432/lightbridge_authz_usage}"
  pool_size: 10
otel:
  enabled: true
  otlp_endpoint: "http://jaeger:4317"
  service_name: "lightbridge-authz-usage"
# #570: validates the end-user bearer token `/usage/v1/usage/query` now requires. Same JWKS URL
# (inside the compose network) as .docker/authz/container.yaml's oauth2.jwks_url -- this service
# only ever reads jwks_url off this block; `type` is required by the shared Oauth2 struct but has
# no effect here since this service never mints anything.
oauth2:
  type: external
  jwks_url: "http://keycloak:9100/realms/dev/protocol/openid-connect/certs"
# #570: the ownership authority `/usage/v1/usage/query` calls for `account`/`project` scopes --
# authz-opa's POST /idp/v1/authorize-usage-scope, reached over the compose network at its internal
# port 3001. username/password MUST match .docker/authz/container.yaml's server.opa.basic_auth.
# insecure_skip_verify: true matches every other in-compose TLS client here (self-signed certs,
# no shared CA bundle mounted) -- see usage_service's identical posture above.
scope_authority:
  base_url: "https://authz-opa:3001"
  username: "authorino"
  password: "change-me"
  insecure_skip_verify: true
