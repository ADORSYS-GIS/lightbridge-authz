server:
  usage:
    address: "0.0.0.0"
    port: 3002
    tls:
      cert_path: "/tls/usage.crt"
      key_path: "/tls/usage.key"
    # Basic-auth credentials gating /usage/v1/spend/query only -- must match authz-api's
    # usage_service.basic_auth in .docker/authz/container.yaml.
    basic_auth:
      username: "usage-internal"
      password: "change-me"
logging:
  level: "info"
database:
  url: "postgres://postgres:postgres@timescaledb:5432/lightbridge_authz_usage"
  pool_size: 10
otel:
  enabled: true
  otlp_endpoint: "http://jaeger:4317"
  service_name: "lightbridge-authz-usage"
