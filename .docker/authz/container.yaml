server:
  api:
    address: "0.0.0.0"
    port: 3000
    tls:
      cert_path: "${TLS_CERT_PATH:-/tls/api.crt}"
      key_path: "${TLS_KEY_PATH:-/tls/api.key}"
    allowed_hosts:
      - "authz-mcp"
      - "authz-mcp:3000"
      - "localhost"
      - "127.0.0.1"
    # Base path the generated RPC CRUD surface is mounted under (authz-api only). Unset serves
    # /rpc/<op_id>; set e.g. /api to serve /api/rpc/<op_id> and match a client whose basePath is /api.
    # rpc_base_path: "${RPC_BASE_PATH:-}"
  opa:
    address: "0.0.0.0"
    port: 3001
    tls:
      cert_path: "${OPA_TLS_CERT_PATH:-/tls/opa.crt}"
      key_path: "${OPA_TLS_KEY_PATH:-/tls/opa.key}"
    basic_auth:
      username: "authorino"
      password: "change-me"
  # authz-idp (ADR-0012 Phase 1): the OIDC broker service carrying discovery/JWKS/token-exchange
  # off authz-api. Transitional -- authz-api keeps serving the same surface too until the
  # auth.ai.camer.digital ingress is repointed at authz-idp (a separate, later cutover PR).
  idp:
    address: "0.0.0.0"
    port: 3004
    tls:
      cert_path: "${IDP_TLS_CERT_PATH:-/tls/idp.crt}"
      key_path: "${IDP_TLS_KEY_PATH:-/tls/idp.key}"
    # ADR-0021 Decisions 1 + 10, amended by ADR-0029: the hosted login page's Vite production
    # build, baked into the image at /app/static by Dockerfile/Dockerfile.dist from the
    # digest-pinned converse-frontends `authz-ui` artifact (this repo builds no JavaScript).
    static_dir: "${IDP_STATIC_DIR:-/app/static}"
  # authz-budget: the budget-domain microservice carrying every budget:*-gated RPC procedure off
  # authz-api (hard cutover, not a transitional duplication like idp above -- see
  # docs/architecture/budget.md). Its RPC surface is mounted under a fixed /budget prefix
  # (/budget/rpc/<op_id>), not the configurable rpc_base_path authz-api uses.
  budget:
    address: "0.0.0.0"
    port: 3005
    tls:
      cert_path: "${BUDGET_TLS_CERT_PATH:-/tls/budget.crt}"
      key_path: "${BUDGET_TLS_KEY_PATH:-/tls/budget.key}"
logging:
  level: "info"
database:
  # Same silent-misconfiguration bug class as config/default.yaml's database.url (lightbridge-
  # authz#PR447), extended here for consistency. Behavior-preserving today: authz-api/authz-
  # budget/authz-mcp already export DATABASE_URL in compose.yaml at this exact connection string
  # (for cratestack's own `env("DATABASE_URL")` datasource, a separate connection from this
  # core DbPool -- see the comment on that env var in compose.yaml), so interpolation resolves to
  # the identical value; authz-migrate sets no DATABASE_URL at all, so it takes the fallback below,
  # unchanged from before.
  url: "${DATABASE_URL:-postgres://postgres:postgres@postgresql:5432/lightbridge_authz}"
  pool_size: 10
# Mandatory for authz-api, authz-idp, and authz-budget -- each refuses to start without it (see
# AGENTS.md's "Redis is a mandatory dependency" house rule). Used for Redis-backed rate limiting
# on authz-api/authz-budget (docs/adr/0003-cratestack-crud-migration.md, "Rate limiting
# (Redis-backed)") and for authz-idp's private_key_jwt replay-protection store (ADR-0011,
# Decision 6). authz-opa, lightbridge-mcp, and the usage service are explicitly freed from this
# requirement and ignore this block entirely.
redis:
  url: "${REDIS_URL:-redis://redis:6379}"
# HTTP client for authz-api's budget domain to call the usage service's /usage/v1/spend/query
# endpoint (see crates/lightbridge-authz-budget/src/spend.rs). Optional, like redis above. Absent
# -> budget refill spend facts report Spend::Unavailable (fails closed to manual review), not a
# startup failure.
#
# base_url points at authz-usage's mTLS-required query listener (port 3006, UsageServerGroup::query
# -- #347 split the old single usage port into an unauthenticated ingest listener and this
# mTLS-required query listener; see that type's doc comment in crates/lightbridge-authz-usage/src/config.rs).
#
# client_cert_path/client_key_path (#347) present this pod's own cert as a client identity --
# reusing api.crt/api.key rather than minting a separate client-only cert, since the deployed
# authz-tls cert already carries both serverAuth and clientAuth in its extendedKeyUsage (confirmed
# against the live cluster: `kubectl -n converse get certificate authz-tls -o yaml` shows
# `usages: [server auth, client auth]`) -- the same pattern this compose stack's authz-tls service
# now mirrors locally (see that service's cert-generation script). authz-budget shares this same
# config file and therefore presents the same identity when it calls the usage service; mTLS here
# authenticates "a legitimate lightbridge workload holding a CA-signed cert", not a specific
# service identity -- see the PR that introduced this for why per-caller authorization was not
# implemented.
#
# insecure_skip_verify: true is only for this local Compose stack. Real (e.g. in-cluster)
# deployments must set insecure_skip_verify: false and set ca_bundle_path to the deployment's own
# CA bundle instead -- e.g. in a cluster where cert-manager issues this service's own TLS secret
# with a CA-type issuer, that secret already carries a ca.crt alongside tls.crt/tls.key, and this
# pod already mounts the whole secret at /etc/lightbridge/tls, so no new Secret/volume/mount is
# needed to point ca_bundle_path (or client_cert_path/client_key_path) at it (see
# Config::usage_service's doc comment in crates/lightbridge-authz-core). An unreadable or
# unparseable ca_bundle_path, client_cert_path, or client_key_path is a hard startup failure,
# never a silent fallback to skip-verify, no client identity, or the system trust store.
usage_service:
  base_url: "https://authz-usage:3006"
  insecure_skip_verify: true
  # ca_bundle_path: /etc/lightbridge/tls/ca.crt
  client_cert_path: "/tls/api.crt"
  client_key_path: "/tls/api.key"
  timeout_ms: 5000
oauth2:
  # REQUIRED credential-issuance mode — no default; must be stated explicitly.
  #   self     → mint self-signed JWT API keys (uses `signing`). external → Keycloak-exchanged
  #   tokens (uses `issuance`).
  type: self
  jwks_url: "http://keycloak:9100/realms/dev/protocol/openid-connect/certs"
  oauth2_url: "http://keycloak:9100/realms/dev/protocol/openid-connect/token"
  # Expected audience claim(s) in JWT tokens.
  # Tokens must contain at least one matching audience value.
  #
  # Valid audience values:
  #   - lightbridge-api-key: Primary audience for API Key service
  #   - lightbridge-token-issuer: Audience for token issuer service
  #
  # For production deployments, set via environment:
  #   OAUTH2__AUDIENCE='["lightbridge-api-key"]'
  audience:
    - "lightbridge-api-key"
    - "lightbridge-token-issuer"
  # Used only when `type: external` (Keycloak token-exchange). Ignored under `type: self`.
  issuance:
    grant_type: "urn:ietf:params:oauth:grant-type:token-exchange"
    client_id: "${KEYCLOAK_TOKEN_CLIENT_ID:-lightbridge-token-issuer}"
    client_secret: "${KEYCLOAK_TOKEN_CLIENT_SECRET:-lightbridge-token-issuer-secret}"
    subject_token_type: "urn:ietf:params:oauth:token-type:access_token"
    requested_token_type: "urn:ietf:params:oauth:token-type:access_token"
    # Target audience for issued tokens - must match one of the valid audiences above
    # audience: "lightbridge-api-key"
  # ADR-0025 Stage 1: the ONE issuer this deployment trusts for remote-subject-to-account-id
  # translation. Mandatory for authz-api, authz-idp, authz-opa, authz-budget, and
  # lightbridge-mcp. This is the ONLY issuer field -- `relying_party.issuer` was removed (it used
  # to have to be kept byte-equal to this one by hand; that config trap is gone).
  #
  # `issuer` is IDENTITY: it's what a browser on the HOST reaches Keycloak at (through the
  # `13000`-range port mapping compose.yaml publishes), what every ID token's `iss` claim carries,
  # and what `authz-idp` validates discovery's own `issuer` against. `discovery_url` is LOCATION:
  # where `authz-idp`'s own container dials OIDC discovery from INSIDE the compose network, where
  # `localhost` means the container itself, not the host -- so it must use the `keycloak` service
  # DNS name instead. Without this split, `authz-idp` cannot dial discovery at all (it would try
  # to reach `localhost:9100` from inside its own container and get a connection refused, which
  # surfaces as `GET /authorize` returning 502 "sign-in unavailable").
  federation:
    issuer: "http://localhost:9100/realms/dev"
    discovery_url: "http://keycloak:9100/realms/dev"
  # Local Compose's Keycloak RP client. The browser reaches authz-idp through localhost:13004;
  # production must replace both callback_url and the state-encryption key. The identity issuer
  # now lives solely on `oauth2.federation.issuer` above.
  relying_party:
    client_id: "authz-idp-rp"
    callback_url: "https://localhost:13004/idp/callback"
    state_encryption_key: "${KEYCLOAK_RP_STATE_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}"
    # ADR-0024: separate AES-256-GCM key sealing the Keycloak token set at rest on
    # federated_identities.token_envelope. Development-only fixed key, deliberately different
    # from state_encryption_key above (KeycloakRelyingParty::new refuses a config where the two
    # are equal). Production must override with a unique base64url-encoded 32-byte key.
    token_encryption_key: "${KEYCLOAK_RP_TOKEN_ENCRYPTION_KEY:-QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI}"
    timeout_ms: ${KEYCLOAK_RP_TIMEOUT_MS:-5000}
    browser_session_ttl_seconds: ${BROWSER_SESSION_TTL_SECONDS:-28800}
  # Used only when `type: self` — signing keypair generated on first startup and stored in the DB
  # (see docs/authorino-usage.md). Ignored under `type: external`.
  signing:
    issuer: "${JWT_SIGNING_ISSUER:-https://authz-api:3000}"
    audience: "${JWT_SIGNING_AUDIENCE:-lightbridge-api-key}"
    ttl_seconds: ${JWT_SIGNING_TTL_SECONDS:-7776000}
    max_key_age_days: ${JWT_SIGNING_MAX_KEY_AGE_DAYS:-30}

    # GHSA/#538-adjacent but separate: claims this deployment stamps on tokens it signs, declared
    # rather than hard-coded.
    #
    # This is what lets `authz-idp` be the sole issuer for the human plane. The RBAC roles claim
    # below is derived from `project_members` -- data this service owns -- not copied out of a
    # Keycloak token we happened to broker. `authz-api` reads whatever `oauth2.rbac.roles_claim`
    # names, so the `claim` here MUST match that setting.
    #
    # `source: project_role` resolves to `owner` (the subject owns the project's account and
    # normally holds no roster row -- the same implicit authorization `authorize_project_lead`
    # applies), or the subject's `project_members.role` (`lead` / `member`).
    #
    # A source value absent from `map` falls through to `default`, which is EMPTY here: no roles,
    # therefore no permissions. That is the default-deny direction. A lookup FAILURE is different --
    # it refuses the mint outright rather than stamping an empty claim, so a database blip can never
    # masquerade as a legitimately unprivileged user.
    claim_mappers:
      - claim: lightbridge_api_roles
        source: project_role
        map:
          owner: ["lightbridge-admin"]
          lead: ["lightbridge-editor"]
          member: ["lightbridge-viewer"]
        default: []
  # Native RFC 8693 token-exchange and RFC 8628 device grant. Requires signing; token exchange
  # resolves an upstream IdP access token + project_id, and device approval uses the Keycloak
  # relying-party verification page. Both mint short-lived project-scoped JWTs.
  token_exchange:
    enabled: ${TOKEN_EXCHANGE_ENABLED:-true}
    access_ttl_seconds: ${TOKEN_EXCHANGE_ACCESS_TTL_SECONDS:-900}
    authorization_code_ttl_seconds: ${AUTHORIZATION_CODE_TTL_SECONDS:-300}
    refresh_ttl_seconds: ${TOKEN_EXCHANGE_REFRESH_TTL_SECONDS:-2592000}
    # Absolute cap on a refresh-token chain's lifetime, independent of the per-rotation TTL above
    # -- see Oauth2TokenExchange::refresh_absolute_ttl_seconds's doc comment for why this exists.
    refresh_absolute_ttl_seconds: ${TOKEN_EXCHANGE_REFRESH_ABSOLUTE_TTL_SECONDS:-7776000}
    # Bounded idempotent-replay grace window for a refresh token presented just after it was
    # rotated -- added after the 2026-08-30 console-401s incident (two replicas raced their own
    # refresh single-flight and one replayed the other's already-rotated token, triggering the
    # strict RFC 6819 §5.2.2.3 cascade on a benign race). See
    # Oauth2TokenExchange::refresh_reuse_grace_seconds's doc comment. 0 disables the grace window
    # (strict cascade on every post-rotation replay, the pre-incident behavior).
    refresh_reuse_grace_seconds: ${TOKEN_EXCHANGE_REFRESH_REUSE_GRACE_SECONDS:-30}
    allowed_scopes:
      - openid
      - profile
      - email
      - offline_access
    device_code_ttl_seconds: ${DEVICE_CODE_TTL_SECONDS:-600}
    device_poll_interval_seconds: ${DEVICE_POLL_INTERVAL_SECONDS:-5}
    device_verification_uri: "${DEVICE_VERIFICATION_URI:-https://localhost:13004/device/verify}"
  # Real, config-sourced OAuth2/OIDC clients. Authorization-code clients must register exact
  # redirect_uris and set require_pkce: true; no production dashboard callback is invented here.
  # (ADR-0011, Decision 5). Empty here by default -- with no clients registered, every exchange
  # fails client authentication (invalid_client), it is not left unprotected. `public` clients
  # present no credential beyond client_id; `confidential` clients authenticate via
  # `private_key_jwt` only (ADR-0011, Decision 6) and need their public key inline as `jwks` (a
  # JWK Set) -- there is deliberately no `jwks_uri`. See config/default.yaml for the same example
  # with per-field comments.
  clients:
    - client_id: opencode-cli
      type: public
      scopes: [openid, offline_access]
      grant_types:
        - "urn:ietf:params:oauth:grant-type:device_code"
        - refresh_token
    # it-idp.py (.docker/it/idp_it.py) IT clients: the browser authorization-code flow and RFC
    # 8693 token exchange, both driven end to end by that suite -- never used outside it.
    - client_id: it-browser
      type: public
      scopes: [openid, profile, email, offline_access]
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris: ["http://it-client.invalid/callback"]
      # OIDC RP-Initiated Logout 1.0: the exact, byte-for-byte list `/oauth2/end_session` will
      # redirect to. Anything else is refused and the OP renders its own page -- registration is
      # the whole open-redirect control there. Exercised by `.docker/it/idp_it.py`.
      post_logout_redirect_uris: ["http://it-client.invalid/signed-out"]
      require_pkce: true
    - client_id: it-exchange
      type: public
      scopes: [openid, offline_access]
      grant_types:
        - "urn:ietf:params:oauth:grant-type:token-exchange"
        - refresh_token
  #       - refresh_token
  #     allowed_audiences: [lightbridge-ss]
  #     redirect_uris: ["https://dashboard.example.invalid/oauth/callback"]
  #     require_pkce: true
  # Role-based access control. Roles arrive on the JWT in a single, flat, top-level claim
  # (`roles_claim`, configurable). Each role maps to the permissions it grants; a grant is `*`
  # (everything), `<resource>:*` (all actions on a resource), or `<resource>:<action>`. These
  # permissions gate every CRUD/MCP operation — a caller whose roles grant nothing is denied
  # (HTTP 403). The dev realm assigns `lightbridge-admin` to the seeded user. See docs/rbac.md.
  rbac:
    roles_claim: "${RBAC_ROLES_CLAIM:-lightbridge_api_roles}"
    role_permissions:
      lightbridge-admin:
        - "*"
      lightbridge-editor:
        - "account:create"
        - "account:read"
        - "project:*"
        - "apikey:*"
        - "budget:self-refill"
        - "budget:read-own"
      lightbridge-viewer:
        - "account:create"
        - "account:read"
        - "project:read"
        - "apikey:read"
        - "budget:read-own"
otel:
  enabled: true
  otlp_endpoint: "http://jaeger:4317"
  service_name: "lightbridge-authz"

# Billing plans a caller may attach to an API key at creation. Operator-defined catalogue (no
# plan table/entity): each plan has a stable `id`, a UI `name`, and optional `limits`. A
# CreateApiKey must name one of these ids or it is rejected (400); introspection resolves the id
# to name + limits. `plans` also accepts a single JSON-array string via "${BILLING_PLANS}".
billing:
  plans:
    - id: free
      name: Free
      limits:
        requests_per_second: 5
        requests_per_day: 1000
        concurrent_requests: 2
    - id: pro
      name: Pro
      limits:
        requests_per_second: 50
        requests_per_day: 50000
        requests_per_month: 1000000
        concurrent_requests: 20
    # No `limits` block ⇒ unlimited on every dimension (the edge treats absent limits as no cap).
    - id: enterprise
      name: Enterprise

# The operator-configured AI-model catalogue backing `listModelCatalog`, a read-only display aid
# for a `Project.allowedModels` checkbox picker. Unlike `billing` above, an empty/absent catalogue
# is a supported default. The two entries below are obviously-fake, local/compose-dev-only
# placeholders, not real production model ids. `models` also accepts a single JSON-array string
# via "${MODEL_CATALOG}", mirroring `billing.plans`.
models:
  models:
    - id: dev-model-a
      name: Dev Model A (local dev only)
    - id: dev-model-b
      name: Dev Model B (local dev only)

# Ceiling on how far in the future createApiKey/rotateApiKey may set expires_at
# (lightbridge-authz#395). Commented out deliberately: absent means the built-in 90-day default,
# not "unlimited" -- see config/default.yaml's identical block for the full rationale.
# api_key_expiry:
#   max_lifetime_days: 90

# GHSA-9pc6-965v-2c44 / #538: API key secrets created through lightbridge-mcp are NEVER returned
# in the tool result -- an MCP result goes straight into the calling model's context. The secret is
# sealed here and handed over as a single-use claim URL the requesting human redeems once, in a
# browser, against authz-idp.
#
# Deliberately NOT a startup mandate. An ABSENT block degrades safely: lightbridge-mcp REFUSES
# create-api-key/rotate-api-key (it never falls back to returning the secret), and authz-idp
# answers 503 on /api-keys/claim. A PRESENT but malformed block IS a hard startup failure --
# tolerated case is "absent", never "wrong".
#
# The mandate was softened deliberately: authz-idp is the sole server of its issuer, and every
# in-circulation API-key JWT names it in `iss`, so refusing to boot over a missing claim key would
# take the issuer down to disable one page. authz-api/-opa/-budget ignore this section.
secret_claim:
  # Dev-only fixed key: base64url, exactly 32 bytes. Distinct from BOTH relying-party keys above --
  # different data, different lifetime, different rotation posture. Production MUST override.
  # Rotating it makes un-redeemed claims unopenable, which is cheap here: claims live ~5 minutes.
  encryption_key: "${SECRET_CLAIM_ENCRYPTION_KEY:-Q0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0M}"
  ttl_seconds: 300
  # Where the human collects it. The authz-idp origin, NOT authz-api/-mcp -- authz-idp is the only
  # service holding browser sessions, which is what makes a claim URL useless to a model.
  redeem_base_url: "${SECRET_CLAIM_REDEEM_BASE_URL:-https://authz-idp:3004}"
