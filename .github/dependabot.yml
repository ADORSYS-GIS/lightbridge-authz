version: 2
updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: daily
    time: "08:00"
  open-pull-requests-limit: 5
  groups:
    # The cratestack-* family must move in lockstep (see the comment above the pins in root
    # Cargo.toml) -- a partial bump within a semver-compatible range has broken `main` twice now
    # (#158/#161/#162, then a second occurrence where `cratestack` (package `cratestack-pg`) was
    # left behind at 0.5.1 while its five siblings moved to 0.7.x). Grouping forces every matched
    # crate into ONE Dependabot PR, so a future update can no longer land partially regardless of
    # why the second occurrence happened.
    cratestack:
      patterns:
        - "cratestack*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    time: "08:00"
  open-pull-requests-limit: 5
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
    time: "08:00"
  open-pull-requests-limit: 5
  ignore:
    # ADR-0028 Decision 3. `Dockerfile`'s `ARG AUTHZ_UI_REF=` is not a dependency, it is a DEPLOY:
    # it is the single place this repo records which hosted-login bundle real users get at the
    # authentication boundary. An automated digest bump would ship a UI change to that boundary as
    # a "chore(deps)" PR with no owner having looked at the page. The bump is done by hand,
    # reviewed as a change, with the procedure documented at the ARG itself.
    - dependency-name: "ghcr.io/adorsys-gis/converse-frontends/authz-ui"
