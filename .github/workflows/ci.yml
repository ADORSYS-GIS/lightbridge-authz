name: CI/CD Pipeline
on:
  # Deliberately NOT `push: {}`. A branch with an open PR fired both `push` and
  # `pull_request`, and the concurrency group below resolves to the SAME key for both
  # (`github.event.pull_request.head.ref` and `github.ref_name` are the same branch), so with
  # `cancel-in-progress` the two runs raced to cancel each other. Usually the later survived;
  # on 2026-07-30 both were cancelled and the PR was left with no result at all, which reads
  # as "CI never ran" rather than as a failure.
  #
  # Restricting `push` to `main` removes the duplicate at the source instead of trying to
  # de-duplicate it afterwards. PRs are covered by `pull_request`; `main` is covered by `push`,
  # which is what the release/publish jobs already gate on
  # (`github.ref == 'refs/heads/main' && github.event_name == 'push'`). The only behaviour lost
  # is CI on a branch with no PR open.
  push:
    branches: [main]
  pull_request: {}

# Still worth keeping: successive pushes to the same PR should not pile up heavy
# `integration-test` runs against each other.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories,"bans licenses sources"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/cargo-deny
        with:
          check: ${{ matrix.checks }}

  code-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/code-checks

  # The charts had no automated tests at all before ADORSYS-GIS/lightbridge-authz#645, which is
  # how five byte-identical copies of the same `config.yaml` reached production values without
  # anything noticing. `helm unittest` pins the single-source render contract
  # (charts/*/templates/_config.tpl): what sharedConfig + configOverrides - configOmit produces,
  # that an operator's config replaces rather than merges into the chart's dev placeholders,
  # that env placeholders stay quoted, and that the migrate Job's name still tracks the RENDERED
  # config (#480).
  helm-charts:
    name: Helm chart tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # `lightbridge.config.render` has to exist in BOTH leaf charts, because each is also
      # published and installable on its own — Helm has no cross-chart library short of a
      # library dependency. Helm's template namespace is global, so two DIFFERENT definitions
      # of the same name inside the umbrella chart would silently resolve to whichever parsed
      # last. Byte-equality is the invariant that makes that safe.
      - name: The two _config.tpl copies must stay byte-identical
        run: |
          diff -u charts/lightbridge-authz/templates/_config.tpl \
                  charts/lightbridge-mcp/templates/_config.tpl

      - name: helm unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 0.6.0
          for chart in charts/lightbridge-authz charts/lightbridge-mcp; do
            helm dependency build "$chart"
            helm unittest "$chart"
          done

      # A rendering regression in the umbrella chart is what actually reaches prod, so render it
      # the way ArgoCD does before trusting the unit tests.
      - name: helm template the umbrella chart
        run: |
          for chart in charts/lightbridge-authz-usage charts/lightbridge-authz-stack; do
            helm dependency build "$chart"
          done
          helm template lightbridge charts/lightbridge-authz-stack \
            --kube-version 1.35.3 --include-crds > /dev/null

  # Blocks new or changed non-test Rust files over 200 LoC (ADORSYS-GIS/lightbridge-authz#516).
  # Diff-scoped: only files this change actually touched are measured, and files
  # already over the ceiling are grandfathered against .github/loc-baseline.json —
  # they may be touched but must not grow. Test files (under a /tests/ dir) are
  # excluded from the fail decision and reported separately. Runs in parallel with
  # the other checks so a size violation fails fast without waiting on the full build.
  loc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate diffs base..head, so the full history must be present to
          # resolve the merge-base. A shallow (depth: 1) checkout cannot.
          fetch-depth: 0
      - uses: ./.github/actions/loc-gate
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  # ADR-0021 Decisions 1 + 10, amended by ADR-0029 (#591). This job used to be `frontend` and ran
  # `npm ci` + `vite build` on `web/hosted-login`. That project no longer exists here: the login
  # page's source home is converse-frontends' `apps/authz-ui`, and this repo consumes it as a
  # digest-pinned, assets-only OCI artifact.
  #
  # The job is kept rather than deleted, and its value changed shape. It no longer proves "the
  # frontend builds" (converse-frontends' own test.yml/authz-ui-image.yml do that). It proves the
  # PIN IS GOOD: that ./Dockerfile's `ARG AUTHZ_UI_REF=` is present, digest-pinned, resolvable
  # from this repo's credentials, and really contains a content-hashed bundle. Without it, a bad
  # or unpullable pin would first surface in `integration-test` (minutes later, buried in a
  # compose build) or -- worse -- only on main in `container-build`. It is deliberately NOT in
  # `container-build`'s `needs:`; `binaries` already depends on the same staging step, so the pin
  # is gated on the release path regardless. This is a fast, distinctly-named PR check.
  authz-ui-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/stage-authz-ui

  test:
    needs: code-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/tests
        with:
          database-url: postgres://postgres:postgres@localhost:5432/lightbridge_authz

  binaries:
    needs: code-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/build-release

  integration-test:
    needs: code-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/integration-test

  container-build:
    # #499: `needs` used to be `[binaries]` alone, on the reasoning that "image builds must not be
    # gated on the test suites" and "deployment gating (if any) lives downstream in GitOps". The
    # second half was wrong, and it cost a production incident. There is no downstream gate:
    # argocd-image-updater's `newest-build` strategy promotes on the COSIGN SIGNATURE alone, so
    # the signature minted at the end of this job IS the production gate. On 2026-08-25 bffeaf5
    # built, pushed and signed while `integration-test` was still running, and prod rolled a
    # red-main image minutes before CI went red. Rollback did not help either: `newest-build`
    # simply re-promotes the newest signed image.
    #
    # So the test suites now gate this job. The measured cost is ~1 minute of total run time, not
    # the pipeline delay the original comment feared: `test` is already the critical path at
    # ~11m49s versus `integration-test`'s ~4m30s and this job's ~1m, so the run could never finish
    # before `test` did anyway (run 33353413433, 2026-08-31).
    #
    # A flaky test now blocks publishing. That is the intended trade -- an unpublished image is a
    # deploy that did not happen, whereas an unverified signed image is a deploy that cannot be
    # taken back. Investigate the flake; do not weaken this edge to route around it.
    #
    # `sast` (cargo-deny) is in this list by an explicit decision, and it behaves unlike the other
    # three: it can go red with no change on our side, when a new RUSTSEC advisory is published
    # against a dependency we already ship. So this edge can block an unrelated hotfix at 3am, and
    # that is accepted -- an image with a known advisory should not promote itself to production
    # just because the advisory landed inconveniently. The unblock is to fix or triage the finding
    # in `deny.toml` (which is a real decision, recorded in the file), never to drop `sast` from
    # this list.
    needs: [sast, binaries, test, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: runtime, image_name: '${{ github.repository }}' }
          - { target: mcp-runtime, image_name: '${{ github.repository }}-mcp' }
          - { target: usage-runtime, image_name: '${{ github.repository }}-usage' }
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Build and push container image
        id: build-image
        uses: ./.github/actions/container-build
        with:
          app-version: ${{ github.sha }}
          image-name: ${{ matrix.image_name }}
          target: ${{ matrix.target }}
          platform: linux/amd64
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Scans the pushed image, so it necessarily runs after the push -- but it now runs BEFORE
      # signing. Previously the composite action signed immediately after pushing, so a
      # HIGH/CRITICAL finding failed this job with the image already signed and therefore already
      # promotable: the same shape of hole as #499, one step further down.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.build-image.outputs.version-tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      # The promotion token, minted last and only here. Everything upstream of this point has
      # already had its say: `sast`, `test` and `integration-test` directly via `needs`,
      # `code-checks` transitively (every one of this job's dependencies needs it), and Trivy in
      # the step above, which fails the job before this one runs. Both halves of the supply-chain
      # check are therefore ahead of the signature -- cargo-deny over the dependency graph we
      # build from, Trivy over the image we ship. An image that reaches GHCR without clearing all
      # of them stays unsigned, and argocd-image-updater will not promote an unsigned image.
      #
      # `frontend` is deliberately NOT in the list, and its absence is not a gap: `binaries` stages
      # the same Vite build into `dist/static`, which is what `Dockerfile.dist` copies
      # (`COPY dist/static /app/static`), so the image's UI comes from `binaries` and that job
      # already gates this one. `frontend` is a second, faster proof for PRs, not the image's
      # source of truth.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (keyless, GitHub OIDC)
        shell: bash
        env:
          IMAGE_REF: ${{ steps.build-image.outputs.image-ref }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          # Fail loudly rather than silently skipping the signature: an unsigned image is simply
          # never promoted, so a no-op here would look green while quietly halting deployment.
          if [ -z "${IMAGE_REF}" ] || [ -z "${DIGEST}" ]; then
            echo "::error::refusing to sign: empty image-ref or digest from the build step"
            exit 1
          fi
          cosign sign --yes "${IMAGE_REF}@${DIGEST}"
  release-please:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - name: Open/advance the release PR (cuts the release + tag on merge)
        id: release-please
        uses: googleapis/release-please-action@v5
        with:
          # A PAT (RELEASE_PLEASE_TOKEN) lets the release PR trigger CI and its
          # tag fire the publish jobs; falls back to GITHUB_TOKEN until it exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: [binaries, container-build, release-please]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release-please.outputs.tag_name }}
