name: CI/CD Pipeline
on:
  # Deliberately NOT `push: {}`. A branch with an open PR fired both `push` and
  # `pull_request`, and the concurrency group below resolves to the SAME key for both
  # (`github.event.pull_request.head.ref` and `github.ref_name` are the same branch), so with
  # `cancel-in-progress` the two runs raced to cancel each other. Usually the later survived;
  # on 2026-07-30 both were cancelled and the PR was left with no result at all, which reads
  # as "CI never ran" rather than as a failure.
  #
  # Restricting `push` to `main` removes the duplicate at the source instead of trying to
  # de-duplicate it afterwards. PRs are covered by `pull_request`; `main` is covered by `push`,
  # which is what the release/publish jobs already gate on
  # (`github.ref == 'refs/heads/main' && github.event_name == 'push'`). The only behaviour lost
  # is CI on a branch with no PR open.
  push:
    branches: [main]
  pull_request: {}

# Still worth keeping: successive pushes to the same PR should not pile up heavy
# `integration-test` runs against each other.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories,"bans licenses sources"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/cargo-deny
        with:
          check: ${{ matrix.checks }}

  code-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/code-checks

  # ADR-0021 Decisions 1 + 10 (#442): the hosted login page (web/hosted-login) is a separate npm
  # project, not part of the Rust workspace -- proves `vite build` succeeds and produces
  # content-hashed output on every push/PR, independent of the Rust `code-checks`/`test` jobs.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/build-frontend

  test:
    needs: code-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/tests
        with:
          database-url: postgres://postgres:postgres@localhost:5432/lightbridge_authz

  binaries:
    needs: code-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/build-release

  integration-test:
    needs: code-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/integration-test

  container-build:
    # Only depends on `binaries` (it consumes dist-binaries.tar.gz). Deliberately NOT `test` or
    # `integration-test`: image builds must not be gated on the test suites, so a flaky/slow test
    # can't block publishing. `test` + `integration-test` run in parallel and gate CI status only;
    # deployment gating (if any) lives downstream in GitOps, not here.
    needs: [binaries]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: runtime, image_name: '${{ github.repository }}' }
          - { target: mcp-runtime, image_name: '${{ github.repository }}-mcp' }
          - { target: usage-runtime, image_name: '${{ github.repository }}-usage' }
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Build and push container image
        id: build-image
        uses: ./.github/actions/container-build
        with:
          app-version: ${{ github.sha }}
          image-name: ${{ matrix.image_name }}
          target: ${{ matrix.target }}
          platform: linux/amd64
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.build-image.outputs.version-tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
  release-please:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - name: Open/advance the release PR (cuts the release + tag on merge)
        id: release-please
        uses: googleapis/release-please-action@v5
        with:
          # A PAT (RELEASE_PLEASE_TOKEN) lets the release PR trigger CI and its
          # tag fire the publish jobs; falls back to GITHUB_TOKEN until it exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: [binaries, container-build, release-please]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release-please.outputs.tag_name }}
