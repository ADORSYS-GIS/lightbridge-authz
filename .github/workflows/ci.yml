name: CI/CD Pipeline
on:
  push: {}
  pull_request: {}

# A branch with an open PR fires both `push` and `pull_request`, running the heavy
# jobs (integration-test) twice concurrently on the self-hosted runner and starving
# each other. Collapse duplicate runs per branch to a single in-flight run.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST Scan
    runs-on: adorsys-gis-runner
    strategy:
      matrix:
        checks: [advisories,"bans licenses sources"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/cargo-deny
        with:
          check: ${{ matrix.checks }}

  code-checks:
    runs-on: adorsys-gis-runner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/code-checks

  test:
    needs: code-checks
    runs-on: adorsys-gis-runner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/tests
        with:
          database-url: postgres://postgres:postgres@localhost:5432/lightbridge_authz

  binaries:
    needs: code-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: adorsys-gis-runner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/build-release

  integration-test:
    needs: code-checks
    runs-on: adorsys-gis-runner
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/integration-test

  container-build:
    needs: [binaries, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: adorsys-gis-runner
    strategy:
      matrix:
        include:
          - { target: runtime, image_name: '${{ github.repository }}' }
          - { target: mcp-runtime, image_name: '${{ github.repository }}-mcp' }
          - { target: usage-runtime, image_name: '${{ github.repository }}-usage' }
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Build and push container image
        id: build-image
        uses: ./.github/actions/container-build
        with:
          app-version: ${{ github.sha }}
          image-name: ${{ matrix.image_name }}
          target: ${{ matrix.target }}
          platform: linux/amd64
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.build-image.outputs.version-tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
  release:
    needs: [binaries,container-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: adorsys-gis-runner
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/actions/release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
