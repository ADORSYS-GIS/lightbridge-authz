name: Security Audit
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    # ADORSYS-GIS/ai-ops security-gates including the runs-on input (PR #148).
    # Pinned to the merge commit (immutable) since v1.0.0 predates that input.
    uses: ADORSYS-GIS/ai-ops/.github/workflows/security-gates.yml@ea7d6113b3be1038f55042d581d1afc0329af12b
    secrets: inherit
    with:
      trivy-scan-type: 'fs'
      trivy-target: '.'
      runs-on: adorsys-gis-runner
