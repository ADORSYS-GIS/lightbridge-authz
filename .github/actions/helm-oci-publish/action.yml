name: Helm OCI Publish
description: Packages Helm charts and pushes them to GHCR as OCI artifacts under the charts/ prefix.
inputs:
  github-token:
    description: Token to authenticate against GHCR and push the charts
    required: true
  charts-dir:
    description: Directory containing the charts
    required: false
    default: charts
  registry:
    description: OCI registry host to push charts to
    required: false
    default: ghcr.io
  repository-owner:
    description: Registry namespace owner (charts are pushed under <owner>/charts)
    required: false
    default: ${{ github.repository_owner }}
runs:
  using: composite
  steps:
    # Pinned to the same Helm as the `helm-charts` job in .github/workflows/ci.yml (ArgoCD
    # v3.5.1's bundled Helm) so a chart is packaged by the Helm that tested it. An unpinned
    # setup-helm tracks `latest` and silently changes the packaging toolchain mid-release; the
    # same floating pin is what broke the helm-charts job when Helm 4 shipped. Keep the two in
    # lockstep.
    - name: Install Helm
      uses: azure/setup-helm@v4.3.1
      with:
        version: v4.2.1
      env:
        GITHUB_TOKEN: "${{ inputs.github-token }}"

    - name: Add dependency repos to Helm
      shell: bash
      run: |
        helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
        helm repo update

    - name: Log in to GHCR
      shell: bash
      env:
        GITHUB_TOKEN: "${{ inputs.github-token }}"
      run: |
        echo "${GITHUB_TOKEN}" | helm registry login "${{ inputs.registry }}" \
          --username "${{ github.actor }}" --password-stdin

    - name: Refuse to republish an already-published chart version
      shell: bash
      env:
        CHARTS_DIR: ${{ inputs.charts-dir }}
        REGISTRY: ${{ inputs.registry }}
        OWNER: ${{ inputs.repository-owner }}
      run: |
        set -euo pipefail

        owner="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
        oci_repo="oci://${REGISTRY}/${owner}/charts"
        failed=0

        for chart in "${CHARTS_DIR}"/*/; do
          [ -f "${chart}Chart.yaml" ] || continue
          name="$(awk -F'[[:space:]]*:[[:space:]]*' '/^name:/{print $2; exit}' "${chart}Chart.yaml")"
          version="$(awk -F'[[:space:]]*:[[:space:]]*' '/^version:/{print $2; exit}' "${chart}Chart.yaml")"
          ref="${oci_repo}/${name}"

          echo "Checking whether ${name}:${version} is already published at ${ref} ..."
          if error_output="$(helm show chart "${ref}" --version "${version}" 2>&1 >/dev/null)"; then
            echo "::error::Chart '${name}' version '${version}' is already published at ${ref}:${version}. Refusing to overwrite an already-published chart version — bump 'version' (and 'appVersion' if applicable) in ${chart}Chart.yaml before publishing."
            failed=1
          elif echo "${error_output}" | grep -qiE "not found|404|manifest unknown|NAME_UNKNOWN|NAME_INVALID"; then
            echo "OK: ${name}:${version} is not yet published."
          else
            echo "::error::Could not verify registry state for ${ref}:${version}: ${error_output}"
            failed=1
          fi
        done

        if [ "${failed}" -ne 0 ]; then
          echo "::error::One or more charts failed the pre-publish version check — see above. No charts were pushed."
          exit 1
        fi

    - name: Package and push charts
      shell: bash
      env:
        CHARTS_DIR: ${{ inputs.charts-dir }}
        REGISTRY: ${{ inputs.registry }}
        OWNER: ${{ inputs.repository-owner }}
      run: |
        set -euo pipefail

        owner="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
        oci_repo="oci://${REGISTRY}/${owner}/charts"
        pkg_dir="$(mktemp -d)"

        has_local_deps() {
          grep -qE "repository:[[:space:]]*[\"']?file://" "$1/Chart.yaml"
        }

        for chart in "${CHARTS_DIR}"/*/; do
          [ -f "${chart}Chart.yaml" ] || continue
          has_local_deps "${chart%/}" || helm dependency build "${chart}"
        done

        for chart in "${CHARTS_DIR}"/*/; do
          [ -f "${chart}Chart.yaml" ] || continue
          if has_local_deps "${chart%/}"; then
            helm dependency update "${chart}"
          fi
        done

        for chart in "${CHARTS_DIR}"/*/; do
          [ -f "${chart}Chart.yaml" ] || continue
          helm package "${chart}" --destination "${pkg_dir}"
        done

        for pkg in "${pkg_dir}"/*.tgz; do
          echo "Pushing ${pkg} to ${oci_repo}"
          helm push "${pkg}" "${oci_repo}"
        done
