name: Build Release
description: Build the static release binaries and publish them to the CI S3 bucket (for the release job and the container image builds).
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup
    - uses: ./.github/actions/build-binaries

    # ADR-0021 Decisions 1 + 10 (#442): stages the hosted login page's static build into
    # dist/static, alongside the binaries above, so it rides the same dist-binaries.tar.gz into
    # container-build and Dockerfile.dist's runtime stage.
    - uses: ./.github/actions/build-frontend

    - name: Package tarballs
      shell: bash
      run: |
        set -euo pipefail
        # release-artifacts.tar.gz: dist contents (attached to the GitHub Release).
        tar -czf release-artifacts.tar.gz -C dist .
        # dist-binaries.tar.gz: the dist/ dir (extracted verbatim for the image build).
        tar -czf dist-binaries.tar.gz dist

    # Published to S3 (MinIO) instead of actions/upload-artifact: the org GitHub
    # Actions artifact-storage quota is exhausted, which fails CreateArtifact and
    # blocks the whole image build. See .github/actions/s3-artifact.
    - name: Upload release tarball
      uses: ./.github/actions/s3-artifact
      with:
        mode: upload
        name: release-artifacts.tar.gz

    - name: Upload dist binaries (for container build)
      uses: ./.github/actions/s3-artifact
      with:
        mode: upload
        name: dist-binaries.tar.gz
