name: Build Binaries
description: Compile the static musl release binaries on the host (sccache-cached) and stage them in ./dist for image builds.
inputs:
  target:
    description: Rust target triple to build
    required: false
    default: x86_64-unknown-linux-musl
runs:
  using: composite
  steps:
    - name: Install musl toolchain
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y musl-tools
        rustup target add "${{ inputs.target }}"

    # Memory guard for the self-hosted runner (same rationale as code-checks/tests): `nproc`
    # inside the runner pod reports the HOST's core count (12), not the pod's actual cgroup
    # `cpu` limit (4) or `memory` limit (8Gi) -- confirmed by exec'ing into a live runner pod,
    # `free -h`/`nproc` both read cgroup-unaware /proc, so cargo's default one-job-per-`nproc`
    # would try to run up to 12 concurrent link steps in a pod that can't back that. Without an
    # explicit cap this step had NO guard at all (unlike code-checks/tests), making it the least
    # safe of the cargo invocations on this runner.
    # Lowered to 2 alongside code-checks/tests: this compiles `lightbridge-authz-api` too, the
    # ~6 GB compilation units; jobs=2 keeps two from landing alongside each other
    # This action is reached on PRs via `integration-test`, not only on main.
    - uses: ./.github/actions/heavy-build-guard

    - name: Build release binaries
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        CC_x86_64_unknown_linux_musl: musl-gcc
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        CARGO_BUILD_JOBS: "2"
        CARGO_INCREMENTAL: "0"
      run: |
        set -euo pipefail
        cargo build --profile prod --locked --target "${TARGET}"
        mkdir -p dist
        for bin in lightbridge-authz lightbridge-mcp lightbridge-authz-usage lightbridge-authz-healthcheck; do
          cp "target/${TARGET}/prod/${bin}" "dist/${bin}"
        done
        ls -lash dist/
