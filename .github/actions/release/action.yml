name: Release Artifacts
description: Download the release tarball from the CI S3 bucket, publish a GitHub Release, and sweep the run's S3 artifacts.
inputs:
  github-token:
    description: Token to publish release
    required: true
runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
    - name: Download artifact
      uses: ./.github/actions/s3-artifact
      with:
        mode: download
        name: release-artifacts.tar.gz
    - name: Create GitHub Release
      uses: softprops/action-gh-release@e798e6a1ede8d07b74ac4cdac6bdfa4cc1653907
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        files: release-artifacts.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
    # Terminal job of the run (needs binaries + container-build), so the per-run
    # S3 artifacts are no longer needed — best-effort sweep to keep the bucket tidy.
    - name: Clean up S3 artifacts
      if: always()
      uses: ./.github/actions/s3-artifact
      with:
        mode: cleanup
