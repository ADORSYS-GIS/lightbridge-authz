name: Release Artifacts
description: Download the release tarball from the CI S3 bucket, attach it to the release-please GitHub Release, and sweep the run's S3 artifacts.
inputs:
  github-token:
    description: Token to upload the release asset
    required: true
  tag:
    description: Tag of the release-please release to attach binaries to (e.g. v0.9.0)
    required: true
runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
    - name: Download artifact
      uses: ./.github/actions/s3-artifact
      with:
        mode: download
        name: release-artifacts.tar.gz
    - name: Attach binaries to the release
      # release-please already created the GitHub Release + tag on the merge
      # commit; pointing at that tag updates the existing release and appends
      # the freshly built binary tarball (no new release is created here).
      uses: softprops/action-gh-release@e798e6a1ede8d07b74ac4cdac6bdfa4cc1653907
      with:
        tag_name: ${{ inputs.tag }}
        files: release-artifacts.tar.gz
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
    # Terminal job of the run (needs binaries + container-build), so the per-run
    # S3 artifacts are no longer needed — best-effort sweep to keep the bucket tidy.
    - name: Clean up S3 artifacts
      if: always()
      uses: ./.github/actions/s3-artifact
      with:
        mode: cleanup
