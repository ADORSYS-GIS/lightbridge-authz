name: Rust Setup
description: Checkout repository, install Rust, and cache dependencies.
inputs:
  components:
    description: Comma-separated rustup components to install (clippy, rustfmt, etc.)
    required: false
    default: ''
  toolchain:
    description: Rust toolchain to install
    required: false
    default: stable
runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: Install Rust
      if: ${{ inputs.components == '' }}
      uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
      with:
        toolchain: ${{ inputs.toolchain }}

    - name: Install Rust (with components)
      if: ${{ inputs.components != '' }}
      uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@11da8522bc3856a8fbc565f1d1530989c793d67d

    # sccache's S3 bucket lived on the self-hosted runner's ambient environment, so on a public
    # runner (where none of these are set, and no repo secret supplies them) every Rust job used to
    # die right here on the `${VAR:?}` preflight. Detect instead of assuming.
    #
    # Do NOT read "no S3" as "no sccache". `Swatinem/rust-cache` above is not a substitute: it
    # deliberately evicts workspace crates from its cache and keeps only dependencies, and the
    # crate that dominates this build IS a workspace crate. `lightbridge-authz-api` is a single
    # `cratestack::include_server_schema!` expansion of `schema/authz.cstack` into the entire CRUD
    # surface — one rustc process, unsplittable and unparallelizable, measured locally at ~8 GB RSS
    # and 30+ minutes cold. sccache is what kept CI at ~6 minutes, because it caches at the
    # compiler level and so covers workspace crates too.
    #
    # So the fallback is sccache over the GitHub Actions cache backend, which needs no credentials,
    # is free for public repos, and preserves that property. S3 stays the preferred backend when
    # configured, keeping a self-hosted runner's behaviour byte-for-byte unchanged.
    - name: Detect sccache backend
      id: sccache-cfg
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${SCCACHE_ENDPOINT:-}" ] && [ -n "${SCCACHE_BUCKET:-}" ] \
           && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
          echo "backend=s3" >> "$GITHUB_OUTPUT"
          echo "sccache S3 configuration present — will verify and enable."
        else
          echo "backend=gha" >> "$GITHUB_OUTPUT"
          echo "No sccache S3 configuration — using the GitHub Actions cache backend."
        fi

    # Installs the sccache binary and, with the GHA backend, wires up the Actions cache tokens.
    # On the S3 path the binary was preinstalled on the runner; installing it here is harmless and
    # makes the action self-contained either way.
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Enable sccache (GitHub Actions cache backend)
      if: steps.sccache-cfg.outputs.backend == 'gha'
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

    - name: Verify sccache S3 credentials (mc)
      if: steps.sccache-cfg.outputs.backend == 's3'
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v mc >/dev/null 2>&1; then
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          echo "/tmp" >> "$GITHUB_PATH"
          export PATH="/tmp:${PATH}"
        fi

        case "${SCCACHE_ENDPOINT}" in
          http://*|https://*) url="${SCCACHE_ENDPOINT}" ;;
          *) url="https://${SCCACHE_ENDPOINT}" ;;
        esac

        mc alias set sccache "${url}" "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}" >/dev/null

        probe="sccache/${SCCACHE_BUCKET}/.ci-cred-check-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
        if ! mc ls "sccache/${SCCACHE_BUCKET}" >/dev/null 2>&1 \
           || ! printf 'ok' | mc pipe "${probe}" >/dev/null 2>&1; then
          echo "::error::sccache S3 preflight failed — cannot read/write bucket '${SCCACHE_BUCKET}' at ${url} with the runner key. Grant that key a MinIO policy for s3:GetObject/PutObject/DeleteObject/ListBucket on 'arn:aws:s3:::${SCCACHE_BUCKET}' (+ /*), and confirm the bucket exists."
          exit 1
        fi
        mc rm "${probe}" >/dev/null 2>&1 || true
        echo "sccache S3 credentials OK — read+write verified on '${SCCACHE_BUCKET}' (${url})."

    - name: Enable sccache
      if: steps.sccache-cfg.outputs.backend == 's3'
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        # Custom S3 endpoints (MinIO-style) cannot auto-detect a region, so
        # sccache requires SCCACHE_REGION explicitly. Respect a runner-provided
        # value; otherwise fall back to the conventional default.
        echo "SCCACHE_REGION=${SCCACHE_REGION:-us-east-1}" >> "$GITHUB_ENV"
        # The endpoint has no scheme, so sccache defaults to plain HTTP; the
        # MinIO endpoint (behind Cloudflare/HSTS) requires HTTPS. mc over https
        # authenticates fine, so force sccache onto TLS too.
        echo "SCCACHE_S3_USE_SSL=${SCCACHE_S3_USE_SSL:-true}" >> "$GITHUB_ENV"
