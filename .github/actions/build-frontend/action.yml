name: Build Frontend
description: >
  Install dependencies and run a production Vite build of the hosted login page
  (web/hosted-login, ADR-0021 Decisions 1 + 10, #442), assert it produced content-hashed output,
  and stage it into dist/static for the container build.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: web/hosted-login/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: web/hosted-login
      run: npm ci

    # Biome is the house preference for a fresh JS/TS project with no pre-existing
    # Prettier/ESLint convention to respect (CLAUDE.md). `biome ci` is the CI-flavored
    # invocation: format + lint + import-organization checks, non-mutating, non-zero
    # exit on any finding.
    - name: Lint and format check (Biome)
      shell: bash
      working-directory: web/hosted-login
      run: npx biome ci .

    - name: Build
      shell: bash
      working-directory: web/hosted-login
      # `npm run build` also runs scripts/verify-service-worker-scope.mjs (ADR-0021
      # Decision 10, #442) -- the SW-level twin of
      # `static_fallback_never_shadows_an_existing_protocol_route`: fails the build if
      # the service worker's precache manifest ever includes anything outside
      # `assets/**`, or if it grows navigation-interception code (a `navigateFallback`/
      # `NavigationRoute` wired via `createHandlerBoundToURL`), either of which would let
      # the SW intercept `/oauth2/*`, `/.well-known/*`, `/authorize`, or `/healthz` on
      # this origin.
      run: npm run build

    # Decision 10's caching posture only makes sense if Vite is actually emitting
    # content-hashed filenames -- assert it here rather than discovering a regression at
    # `static_assets_tests.rs` runtime or, worse, in production.
    - name: Assert content-hashed output
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        hashed=(web/hosted-login/dist/assets/*-*.js)
        if [ ${#hashed[@]} -eq 0 ]; then
          echo "expected at least one content-hashed JS asset under web/hosted-login/dist/assets/, found none" >&2
          exit 1
        fi
        test -f web/hosted-login/dist/index.html

    - name: Stage into dist/static for the container build
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist/static
        cp -r web/hosted-login/dist/. dist/static/
