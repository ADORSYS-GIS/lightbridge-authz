name: CI Artifact
description: >-
  Upload/download/cleanup a build artifact between jobs in a run. Prefers the CI S3 (MinIO)
  bucket, reusing the ambient sccache credentials when a runner provides them; otherwise falls
  back to actions/upload-artifact + actions/download-artifact. The S3 path exists because those
  actions fail once the org GitHub Actions artifact-storage quota is exhausted ("Failed to
  CreateArtifact: Artifact storage quota has been hit") — a private-repo constraint that does not
  apply now the repo is public, which is what makes the fallback viable on public runners.
  S3 objects are namespaced per workflow run so jobs in the same run share them; GitHub artifacts
  are already run-scoped by construction.

inputs:
  mode:
    description: "upload | download | cleanup"
    required: true
  name:
    description: "Artifact file name (e.g. dist-binaries.tar.gz). Ignored for cleanup."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Detect artifact backend
      id: backend
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${SCCACHE_ENDPOINT:-}" ] && [ -n "${SCCACHE_BUCKET:-}" ] \
           && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
          echo "kind=s3" >> "$GITHUB_OUTPUT"
        else
          echo "kind=gha" >> "$GITHUB_OUTPUT"
        fi

    # GitHub-artifact fallback. `cleanup` is intentionally unimplemented here: run-scoped
    # artifacts expire on their own retention schedule, so there is nothing to reclaim.
    - name: Upload (GitHub artifact)
      if: steps.backend.outputs.kind == 'gha' && inputs.mode == 'upload'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.name }}
        if-no-files-found: error
        retention-days: 1

    - name: Download (GitHub artifact)
      if: steps.backend.outputs.kind == 'gha' && inputs.mode == 'download'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}

    - name: Transfer via mc
      if: steps.backend.outputs.kind == 's3'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail

        # mc may already be on PATH (rust-setup installs it); otherwise fetch it.
        if ! command -v mc >/dev/null 2>&1; then
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          export PATH="/tmp:${PATH}"
        fi

        case "${SCCACHE_ENDPOINT}" in
          http://*|https://*) url="${SCCACHE_ENDPOINT}" ;;
          *) url="https://${SCCACHE_ENDPOINT}" ;;
        esac
        mc alias set ciart "${url}" "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}" >/dev/null

        # Retry mc transfers. The sc-cache MinIO intermittently fails a transfer of a
        # just-written object under artifact-quota / cleanup pressure — it has surfaced as
        # `mc: Insufficient permissions to access this path` on a download whose upload succeeded
        # moments earlier, failing the image build. Retry with exponential backoff so a transient
        # transfer failure doesn't sink the run. (A permanently-evicted object still fails after the
        # last attempt — the durable answer to that is a run-scoped store, tracked separately.)
        mc_retry() {
          local n=1 max=5 delay=3
          while true; do
            if "$@"; then return 0; fi
            if [ "${n}" -ge "${max}" ]; then
              echo "::error::mc transfer failed after ${max} attempts: $*"
              return 1
            fi
            echo "mc attempt ${n}/${max} failed; retrying in ${delay}s..." >&2
            sleep "${delay}"
            n=$((n + 1)); delay=$((delay * 2))
          done
        }

        # Per-run prefix (stable across jobs AND attempts of a run, unique across runs).
        #
        # Keyed on GITHUB_RUN_ID only, deliberately NOT run_attempt: a partial re-run
        # ("Re-run failed jobs") does NOT re-execute the already-succeeded `binaries` upload job, so
        # keying on run_attempt made the re-run's container-build jobs look under `<run_id>-2/` while
        # the artifact only ever existed at `<run_id>-1/` -> `mc: Insufficient permissions` on
        # download, failing the image build. The binaries are deterministic for a run's commit, so a
        # re-run correctly reuses the first attempt's upload; run_id alone is the right key.
        prefix="ciart/${SCCACHE_BUCKET}/ci-artifacts/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}"

        case "${MODE}" in
          upload)
            [ -n "${NAME}" ] || { echo "::error::name is required for upload"; exit 1; }
            mc_retry mc cp --quiet "${NAME}" "${prefix}/${NAME}"
            echo "Uploaded ${NAME} -> ${prefix}/${NAME}"
            ;;
          download)
            [ -n "${NAME}" ] || { echo "::error::name is required for download"; exit 1; }
            mc_retry mc cp --quiet "${prefix}/${NAME}" "${NAME}"
            echo "Downloaded ${prefix}/${NAME} -> ${NAME}"
            ;;
          cleanup)
            mc rm --recursive --force "${prefix}" >/dev/null 2>&1 || true
            echo "Cleaned ${prefix}"
            ;;
          *)
            echo "::error::unknown mode '${MODE}' (want upload|download|cleanup)"
            exit 1
            ;;
        esac
