name: Container Build
description: Build and push a Docker image for the requested target.

inputs:
  app-version:
    description: Version of the application
    required: true
  image-name:
    description: Name of the image
    required: true
  target:
    description: Docker build target
    required: false
    default: runtime
  platform:
    description: Docker platform to build (for example linux/amd64)
    required: true
  tag-suffix:
    description: Optional suffix appended to generated tags (for example -arm)
    required: false
    default: ""
  github-token:
    description: GitHub token for registry auth
    required: true

runs:
  using: composite
  steps:
    - id: docker-setup
      uses: ./.github/actions/setup-docker
      with:
        app-version: ${{ inputs.app-version }}
        image-name: ${{ inputs.image-name }}
        tag-suffix: ${{ inputs.tag-suffix }}
        github-token: ${{ inputs.github-token }}

    - name: Build image with buildah
      id: build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        PLATFORM: ${{ inputs.platform }}
        TAGS: ${{ steps.docker-setup.outputs.tags }}
        LABELS: ${{ steps.docker-setup.outputs.labels }}
      run: |
        set -euo pipefail

        tag_args=()
        while IFS= read -r tag; do
          [ -n "$tag" ] && tag_args+=(--tag "$tag")
        done <<< "$TAGS"

        label_args=()
        while IFS= read -r label; do
          [ -n "$label" ] && label_args+=(--label "$label")
        done <<< "$LABELS"

        akid_file="$(mktemp)"
        sak_file="$(mktemp)"
        trap 'rm -f "$akid_file" "$sak_file"' EXIT
        printf '%s' "${AWS_ACCESS_KEY_ID:-}" > "$akid_file"
        printf '%s' "${AWS_SECRET_ACCESS_KEY:-}" > "$sak_file"

        buildah build \
          --file Dockerfile \
          --target "$TARGET" \
          --platform "$PLATFORM" \
          --build-arg SCCACHE_BUCKET="${SCCACHE_BUCKET:-}" \
          --build-arg SCCACHE_ENDPOINT="${SCCACHE_ENDPOINT:-}" \
          --build-arg CARGO_BUILD_JOBS="${CARGO_BUILD_JOBS:-2}" \
          --secret "id=aws_access_key_id,src=${akid_file}" \
          --secret "id=aws_secret_access_key,src=${sak_file}" \
          "${label_args[@]}" \
          "${tag_args[@]}" \
          .

    - name: Push image with buildah
      id: push
      shell: bash
      env:
        TAGS: ${{ steps.docker-setup.outputs.tags }}
      run: |
        set -euo pipefail
        digest_file="$(mktemp)"
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          echo "Pushing ${tag}"
          buildah push --digestfile "$digest_file" "$tag"
        done <<< "$TAGS"
        echo "digest=$(cat "$digest_file")" >> "$GITHUB_OUTPUT"

    - name: Install cosign
      uses: sigstore/cosign-installer@v3.7.0

    - name: Sign image (keyless, GitHub OIDC)
      shell: bash
      env:
        IMAGE_REF: ${{ steps.docker-setup.outputs.image-ref }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: cosign sign --yes "${IMAGE_REF}@${DIGEST}"

outputs:
  version-tag:
    description: Fully qualified image tag for this application version
    value: ${{ steps.docker-setup.outputs.version-tag }}
  digest:
    description: Digest of the pushed image
    value: ${{ steps.push.outputs.digest }}
