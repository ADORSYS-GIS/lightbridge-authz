name: Container Build
description: Build and push a Docker image for the requested target.

inputs:
  app-version:
    description: Version of the application
    required: true
  image-name:
    description: Name of the image
    required: true
  target:
    description: Docker build target
    required: false
    default: runtime
  platform:
    description: Docker platform to build (for example linux/amd64)
    required: true
  tag-suffix:
    description: Optional suffix appended to generated tags (for example -arm)
    required: false
    default: ""
  github-token:
    description: GitHub token for registry auth
    required: true

runs:
  using: composite
  steps:
    - name: Download prebuilt binaries
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: dist-binaries
        path: dist

    - id: docker-setup
      uses: ./.github/actions/setup-docker
      with:
        app-version: ${{ inputs.app-version }}
        image-name: ${{ inputs.image-name }}
        tag-suffix: ${{ inputs.tag-suffix }}
        github-token: ${{ inputs.github-token }}

    - name: Build image with buildah
      id: build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        PLATFORM: ${{ inputs.platform }}
        TAGS: ${{ steps.docker-setup.outputs.tags }}
        LABELS: ${{ steps.docker-setup.outputs.labels }}
      run: |
        set -euo pipefail

        chmod +x dist/* || true

        tag_args=()
        while IFS= read -r tag; do
          [ -n "$tag" ] && tag_args+=(--tag "$tag")
        done <<< "$TAGS"

        label_args=()
        while IFS= read -r label; do
          [ -n "$label" ] && label_args+=(--label "$label")
        done <<< "$LABELS"

        buildah build \
          --file Dockerfile.dist \
          --target "$TARGET" \
          --platform "$PLATFORM" \
          "${label_args[@]}" \
          "${tag_args[@]}" \
          .

    - name: Push image with buildah
      id: push
      shell: bash
      env:
        TAGS: ${{ steps.docker-setup.outputs.tags }}
      run: |
        set -euo pipefail
        digest_file="$(mktemp)"
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          echo "Pushing ${tag}"
          buildah push --digestfile "$digest_file" "$tag"
        done <<< "$TAGS"
        echo "digest=$(cat "$digest_file")" >> "$GITHUB_OUTPUT"

    - name: Install cosign
      uses: sigstore/cosign-installer@v3.7.0

    - name: Sign image (keyless, GitHub OIDC)
      shell: bash
      env:
        IMAGE_REF: ${{ steps.docker-setup.outputs.image-ref }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: cosign sign --yes "${IMAGE_REF}@${DIGEST}"

outputs:
  version-tag:
    description: Fully qualified image tag for this application version
    value: ${{ steps.docker-setup.outputs.version-tag }}
  digest:
    description: Digest of the pushed image
    value: ${{ steps.push.outputs.digest }}
