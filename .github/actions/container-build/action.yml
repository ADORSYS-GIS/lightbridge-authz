name: Container Build
description: Build and push a Docker image for the requested target.

inputs:
  app-version:
    description: Version of the application
    required: true
  image-name:
    description: Name of the image
    required: true
  target:
    description: Docker build target
    required: false
    default: runtime
  platform:
    description: Docker platform to build (for example linux/amd64)
    required: true
  tag-suffix:
    description: Optional suffix appended to generated tags (for example -arm)
    required: false
    default: ""
  github-token:
    description: GitHub token for registry auth
    required: true

runs:
  using: composite
  steps:
    # buildah was preinstalled on the self-hosted runner (rootless podman/buildah, no Docker
    # daemon); `ubuntu-latest` ships the Docker daemon but not buildah. Installing it keeps the
    # build script below byte-for-byte identical rather than porting it to buildx, and preserves
    # the amd64-only, no-QEMU property AGENTS.md asks for.
    - name: Install buildah
      shell: bash
      run: |
        set -euo pipefail
        if command -v buildah >/dev/null 2>&1; then
          echo "buildah already present: $(buildah --version)"
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install -y buildah
        buildah --version

    # AGENTS.md records these as the rootless settings this project builds under; they were
    # exported by the self-hosted runner rather than set here, so they have to be made explicit
    # now. `:-` keeps a runner-provided value winning, so self-hosted behaviour is unchanged.
    - name: Configure rootless buildah
      shell: bash
      run: |
        set -euo pipefail
        echo "STORAGE_DRIVER=${STORAGE_DRIVER:-vfs}" >> "$GITHUB_ENV"
        echo "BUILDAH_ISOLATION=${BUILDAH_ISOLATION:-chroot}" >> "$GITHUB_ENV"

    - name: Download prebuilt binaries
      uses: ./.github/actions/s3-artifact
      with:
        mode: download
        name: dist-binaries.tar.gz

    - name: Extract prebuilt binaries
      shell: bash
      run: |
        set -euo pipefail
        tar -xzf dist-binaries.tar.gz
        ls -lash dist/

    - id: docker-setup
      uses: ./.github/actions/setup-docker
      with:
        app-version: ${{ inputs.app-version }}
        image-name: ${{ inputs.image-name }}
        tag-suffix: ${{ inputs.tag-suffix }}
        github-token: ${{ inputs.github-token }}

    - name: Build image with buildah
      id: build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        PLATFORM: ${{ inputs.platform }}
        TAGS: ${{ steps.docker-setup.outputs.tags }}
        LABELS: ${{ steps.docker-setup.outputs.labels }}
      run: |
        set -euo pipefail

        chmod +x dist/* || true

        tag_args=()
        while IFS= read -r tag; do
          [ -n "$tag" ] && tag_args+=(--tag "$tag")
        done <<< "$TAGS"

        label_args=()
        while IFS= read -r label; do
          [ -n "$label" ] && label_args+=(--label "$label")
        done <<< "$LABELS"

        buildah build \
          --file Dockerfile.dist \
          --target "$TARGET" \
          --platform "$PLATFORM" \
          "${label_args[@]}" \
          "${tag_args[@]}" \
          .

    - name: Push image with buildah
      id: push
      shell: bash
      env:
        TAGS: ${{ steps.docker-setup.outputs.tags }}
      run: |
        set -euo pipefail
        digest_file="$(mktemp)"
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          echo "Pushing ${tag}"
          buildah push --digestfile "$digest_file" "$tag"
        done <<< "$TAGS"
        echo "digest=$(cat "$digest_file")" >> "$GITHUB_OUTPUT"

    # This action deliberately does NOT sign. The cosign signature is what
    # argocd-image-updater promotes on (`newest-build` resolves over signed images), so it is the
    # production-promotion token, not a build artifact -- and #499 is what happens when the token
    # is minted here: signing ran seconds after the push, before `test`/`integration-test` had a
    # verdict and before Trivy had looked at the image, so a red-main build (bffeaf5) reached prod
    # while CI was still red. Signing now lives in `ci.yml`'s `container-build` job, after the
    # Trivy gate and behind `needs: [test, integration-test]`, where the ordering is visible in
    # the workflow instead of buried in a composite step.
    #
    # `image-ref` is exported for that signing step: cosign signs `ref@digest`, never a tag.

outputs:
  version-tag:
    description: Fully qualified image tag for this application version
    value: ${{ steps.docker-setup.outputs.version-tag }}
  image-ref:
    description: Fully qualified image reference WITHOUT a tag, for signing by digest
    value: ${{ steps.docker-setup.outputs.image-ref }}
  digest:
    description: Digest of the pushed image
    value: ${{ steps.push.outputs.digest }}
