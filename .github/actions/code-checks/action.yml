name: Code Checks
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup
      with:
        components: clippy,rustfmt
    # `--all-targets --all-features` is the heaviest cargo invocation in the repo: it builds every
    # integration-test binary plus the goose load-test tree. `CARGO_BUILD_JOBS: 2` bounds that
    # concurrency; the guard below handles the one crate no job cap can bound. See
    # `heavy-build-guard` for why both are needed.
    - uses: ./.github/actions/heavy-build-guard
    - shell: bash
      env:
        CARGO_BUILD_JOBS: "2"
        CARGO_INCREMENTAL: "0"
      run: cargo check --all-targets --all-features
    - shell: bash
      run: cargo fmt --all -- --check
    - shell: bash
      env:
        CARGO_BUILD_JOBS: "2"
        CARGO_INCREMENTAL: "0"
      run: cargo clippy --all-targets --all-features -- -D warnings
