name: Code Checks
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup
      with:
        components: clippy,rustfmt
    # Memory guards. `--all-targets --all-features` builds every integration-test binary plus the
    # goose load-test tree, each statically linked against the whole graph; at cargo's default
    # one-job-per-core the concurrent link steps exhausted RAM. Capping jobs bounds peak memory
    # roughly linearly. CARGO_INCREMENTAL=0 is standard for CI — incremental state costs memory and
    # disk and buys nothing on a cold checkout.
    #
    # The `jobs: 2` this used to carry was tuned for the self-hosted runner's 8Gi pod, where cgroup
    # limits were invisible from inside the container (`nproc`/`free -h` reported the host's 12
    # cores / 31Gi) so cargo could not auto-tune and 4 still killed the agent. `ubuntu-latest` is a
    # plain 4 vCPU / 16 GB VM with no such mismatch, so one job per core is both correct and roughly
    # twice as fast.
    #
    # Independent of job count: `lightbridge-authz-api` alone peaks around 8 GB in a single rustc
    # process, because the cratestack codegen macro expands the whole CRUD surface from
    # `schema/authz.cstack`. That is one job's worth of memory no cap can split up, and it is the
    # real ceiling on this step — measured locally at ~8 GB RSS and 30+ minutes on a cold cache.
    - shell: bash
      env:
        CARGO_BUILD_JOBS: "4"
        CARGO_INCREMENTAL: "0"
      run: cargo check --all-targets --all-features
    - shell: bash
      run: cargo fmt --all -- --check
    - shell: bash
      env:
        CARGO_BUILD_JOBS: "4"
        CARGO_INCREMENTAL: "0"
      run: cargo clippy --all-targets --all-features -- -D warnings
