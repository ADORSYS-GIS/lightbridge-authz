name: Integration Tests
description: Build binaries bare, then bring the compose stack up (docker compose, prebuilt-binary images) and run the Authorino/servers IT suites.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup
    - uses: ./.github/actions/build-binaries

    # ADR-0021 Decisions 1 + 10, amended by ADR-0028 (#591): compose.ci.yaml builds the `runtime`
    # target (authz-migrate, authz-api) from Dockerfile.dist, which COPYs dist/static. Without
    # this, `docker compose build` fails with "/dist/static": not found (#446 introduced the COPY;
    # the populating step was once missing and the break was masked for 3 merges because the runs
    # that would have caught it were cancelled, not failed).
    #
    # This is also the step that makes `run_suite it-idp` below meaningful: .docker/it/idp_it.py's
    # `section_root_and_spa` asserts GET /ui/ and GET /ui/login return 200 with an HTML
    # content-type. That assertion is now the live, end-to-end proof that the digest-pinned
    # external bundle really lands at /app/static in a running authz-idp -- the single most
    # valuable gate on this whole cutover.
    - uses: ./.github/actions/stage-authz-ui

    - name: Integration tests (docker compose)
      shell: bash
      run: |
        set -eo pipefail

        chmod +x dist/* || true

        # compose.ci.yaml builds the app images from ./dist via Dockerfile.dist
        # (a COPY, not a compile) -> fast and within the runner memory limit.
        compose="docker compose -p lightbridge-authz -f compose.yaml -f compose.it.yaml -f compose.ci.yaml"
        trap '$compose ps || true; $compose logs || true; $compose down -v || true' EXIT

        cn() { echo "lightbridge-authz-$1-1"; }

        wait_ready() { # container cmd... : poll until the command succeeds inside the container
          local c; c="$(cn "$1")"; shift
          for _ in $(seq 1 90); do
            docker exec "$c" "$@" >/dev/null 2>&1 && return 0
            sleep 2
          done
          echo "::error::$c not ready after timeout"; docker logs --tail 50 "$c" || true; return 1
        }

        wait_ready_hc() { # service port : poll the healthcheck binary inside the container
          local c; c="$(cn "$1")"; local port="$2"
          for _ in $(seq 1 90); do
            docker exec "$c" /usr/local/bin/lightbridge-authz-healthcheck -r "$port" >/dev/null 2>&1 && return 0
            sleep 2
          done
          echo "::error::$c (:$port) not ready"; docker logs --tail 60 "$c" || true; return 1
        }

        run_migration() { # service : one-shot; retry to ride out transient compose-network DNS failures
          local svc="$1" c; c="$(cn "$svc")"
          for attempt in 1 2 3; do
            $compose up -d --no-deps --force-recreate "$svc" >/dev/null 2>&1 || true
            for _ in $(seq 1 90); do
              [ "$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null)" = "exited" ] && break
              sleep 2
            done
            [ "$(docker inspect -f '{{.State.ExitCode}}' "$c" 2>/dev/null)" = "0" ] && return 0
            echo "migration $svc attempt $attempt failed (transient DNS?); retrying"
            docker logs --tail 15 "$c" || true
            sleep 5
          done
          echo "::error::$svc failed after 3 attempts"; docker logs --tail 80 "$c" || true; return 1
        }

        run_suite() { # service : the IT runners create unique resources per run, so retry to
          # ride out transient rootless-timing flakes (e.g. MCP session store warmup).
          #
          # 5 attempts / 12s gaps (48s total idle budget, up from 3/8s = 16s): it-authorino hit a
          # rootless-podman aardvark-dns inconsistency where authz-api's own container failed to
          # resolve `keycloak` for its JWT/JWKS fetch (401s, all 3 old attempts, ~44s) even though a
          # DIFFERENT container on the same compose network resolved the same hostname fine around
          # the same time -- a per-container DNS resolver flake, not "keycloak wasn't ready" (its
          # own readiness probe already passed). The identical DNS-inconsistency class was observed
          # to self-heal within ~35s elsewhere in this same job (authz-mcp's Postgres connection,
          # 7 retries with backoff) -- the old 16s budget here was shorter than that observed
          # self-healing window.
          for attempt in 1 2 3 4 5; do
            timeout 360 $compose run --rm --no-deps "$1" && return 0
            echo "suite $1 attempt $attempt failed; retrying"
            sleep 12
          done
          echo "::error::suite $1 failed after 5 attempts"; return 1
        }

        wait_completed() { # service : wait for a one-shot container to exit 0
          local c; c="$(cn "$1")"
          for _ in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null)" = "exited" ]; then
              [ "$(docker inspect -f '{{.State.ExitCode}}' "$c" 2>/dev/null)" = "0" ] && return 0
              echo "::error::$c exited non-zero"; docker logs --tail 80 "$c" || true; return 1
            fi
            sleep 2
          done
          echo "::error::$c did not finish in time"; docker logs --tail 80 "$c" || true; return 1
        }

        $compose version
        $compose build

        # Start services with --no-deps and gate readiness manually rather than relying on
        # compose `depends_on: service_healthy`. This was originally forced by rootless podman,
        # which cannot run container healthchecks (they need a systemd session); docker does run
        # them, but the explicit polling is kept deliberately — it fails with the offending
        # container's logs instead of an opaque compose timeout, which is worth more in CI than
        # the few lines it saves. Leaf services (jaeger/adminer/mcp-inspector) are never started.
        echo "== starting datastores + tls + keycloak =="
        $compose up -d --no-deps postgresql timescaledb redis authz-tls keycloak
        wait_ready postgresql pg_isready -U postgres -d lightbridge_authz -h 127.0.0.1
        wait_ready timescaledb pg_isready -U postgres -d lightbridge_authz_usage -h 127.0.0.1
        wait_ready redis redis-cli ping
        wait_completed authz-tls

        echo "== running migrations =="
        run_migration authz-migrate
        run_migration authz-usage-migrate

        echo "== starting app services =="
        # authz-idp joins the set for it-idp below. It is the only app service here that is NOT
        # exercised by it-authorino/it-servers, so before it-idp ran in CI there was no reason to
        # start it -- and no reason to notice it had drifted.
        $compose up -d --no-deps authz-api authz-opa authz-mcp authz-usage authz-idp
        wait_ready_hc authz-api 3000
        wait_ready_hc authz-opa 3001
        wait_ready_hc authz-mcp 3000
        wait_ready_hc authz-usage 3002
        wait_ready_hc authz-idp 3004

        echo "== running IT suites =="
        run_suite it-authorino
        run_suite it-servers
        # it-idp was authored but never wired in here, so `just it-idp` was the only thing that
        # ever ran it -- and nothing forced anyone to. Two merged PRs changed behaviour the suite
        # asserts and left it red without anyone noticing: #569's refresh-reuse grace window, and
        # #565's profile claims (which fired a tripwire #545 had planted for exactly that moment,
        # into an empty room). Running it here is what makes those tripwires mean something.
        #
        # Sequential, like the two above -- every suite provisions against the same Keycloak user,
        # so running them concurrently would race on that account (the same collision
        # `compose.it.yaml`'s `it` profile exists to prevent).
        run_suite it-idp
