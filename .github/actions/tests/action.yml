name: Workspace Tests
description: >-
  Start Postgres + Redis (docker), run the workspace test suite, then the Postgres/Redis-backed
  `it-tests` feature suite (api-key, budget, rest, usage) against the same Postgres container.
inputs:
  database-url:
    description: Postgres connection string
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup

    - name: Start PostgreSQL (docker)
      shell: bash
      run: |
        set -euo pipefail
        # Run Postgres directly rather than via a job-level `services:` block, so this composite
        # stays self-contained and callable from any job. The public runner has a Docker daemon;
        # the self-hosted one was rootless podman with no daemon, which is why this used to shell
        # out to podman.
        docker run -d --name lightbridge-pg \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=lightbridge_authz \
          -p 5432:5432 \
          docker.io/library/postgres:17
        echo "Waiting for Postgres to accept connections..."
        for i in $(seq 1 60); do
          if docker exec lightbridge-pg pg_isready -U postgres -d lightbridge_authz >/dev/null 2>&1; then
            echo "Postgres is ready."
            exit 0
          fi
          sleep 2
        done
        echo "Postgres did not become ready in time; recent logs:"
        docker logs --tail 50 lightbridge-pg || true
        exit 1

    # Only the it-tests suite needs Redis (RequestScopedOpStore's client-assertion replay store,
    # `TokenExchangeOpStore`'s refresh-token bits, `rpc_it_tests.rs`/`token_exchange_tests.rs` --
    # see their `AUTHZ_REDIS_URL` doc comments). `cargo test --workspace` alone doesn't touch it,
    # but starting it upfront keeps this one composite self-contained.
    - name: Start Redis (docker)
      shell: bash
      run: |
        set -euo pipefail
        docker run -d --name lightbridge-redis -p 6379:6379 docker.io/library/redis:7
        echo "Waiting for Redis to accept connections..."
        for i in $(seq 1 30); do
          if docker exec lightbridge-redis redis-cli ping 2>/dev/null | grep -q PONG; then
            echo "Redis is ready."
            exit 0
          fi
          sleep 1
        done
        echo "Redis did not become ready in time; recent logs:"
        docker logs --tail 50 lightbridge-redis || true
        exit 1

    # Same memory guard as code-checks, for both reasons: this links the 24 test binaries AND it
    # compiles `lightbridge-authz-api`, the ~8 GB single-rustc `include_server_schema!` expansion
    # that reach ~6 GB each; jobs=2 keeps two of them from landing alongside each other.
    - uses: ./.github/actions/heavy-build-guard

    - name: Run tests
      shell: bash
      run: cargo test --workspace
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        CARGO_BUILD_JOBS: "2"
        CARGO_INCREMENTAL: "0"

    # it-tests (api-key/budget/rest, three of `just it-tests`'s four crates -- the fourth,
    # `lightbridge-authz-usage-rest`, runs separately below against this same Postgres container)
    # exercise real migrations against a live DATABASE_URL, unlike the sqlx::test-isolated suites
    # above. Mirrors `just it-tests`'s own
    # migration step (`authz-migrate`) via the binary directly, since there's no compose stack in
    # this job. #219 tracks 7 tests in rpc_it_tests.rs that fail deterministically even against a
    # freshly migrated DB (marked `#[ignore = "tracked in #219"]`); #220 tracks one already-ignored
    # test in access_control_scenarios_tests.rs. Both are pre-existing, known, out of scope here --
    # this step exists so the other ~20+ it-tests genuinely run and stay green, instead of being
    # silently absent from CI's build graph the way they were before.
    - name: Run DB migrations (for it-tests)
      shell: bash
      run: cargo run -p lightbridge-authz --bin lightbridge-authz -- migrate --config-path config/default.yaml
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        CARGO_BUILD_JOBS: "2"
        CARGO_INCREMENTAL: "0"

    # `rpc_it_tests.rs` and `budget_rpc_it_tests.rs` are each run separately, `--test-threads=1`:
    # unlike every other it-tests file here (all `#[sqlx::test]`-isolated, one ephemeral DB per
    # test), both share one `DATABASE_URL`-backed database across their whole binary by design
    # (#219's own repro uses the same flag for the first; `budget_rpc_it_tests.rs`'s own doc
    # comment on `every_moved_procedure_is_reachable_on_authz_budget` documents the same
    # `core_pool()`, no-per-test-isolation shape) -- verified locally that `rpc_it_tests`'
    # default-parallel run throws a spurious failure
    # (`list_projects_tolerates_legacy_jsonb_null_allowed_models`, cross-test interference, not a
    # real bug: passes alone and passes serialized) that vanishes entirely under
    # `--test-threads=1`. This is the exact "shared-database integration tests running in
    # parallel wiping each other's rows" failure mode AGENTS.md's testing rules already warn
    # about -- serializing these two binaries avoids reintroducing it, rather than papering over
    # it with a retry.
    #
    # Every remaining test file's target name used to be hand-enumerated here via one `--test`
    # flag per file. That list silently went stale the moment a new it-tests file was added
    # without a matching edit here: `idp_server_tests.rs`, `budget_rpc_it_tests.rs`,
    # `device_code_store_tests.rs`, `model_catalog_it_tests.rs`, `model_policy_it_tests.rs`,
    # `quota_tier_it_tests.rs`, and `relying_party_tests.rs` all landed after the list was last
    # touched and none of them ever compiled or ran in CI as a result -- including the 3
    # genuinely-failing `db::start_idp_server_*` tests this gap let merge to `main` unnoticed (see
    # the PR description for the full investigation). The list is now discovered from the
    # filesystem instead, mirroring the unrestricted `--tests` flag already used for
    # `lightbridge-authz-api-key`/`lightbridge-authz-budget` above and by `just it-tests` itself,
    # so a new test file is covered automatically instead of needing a second, easily-forgotten
    # edit. `load_tests.rs` is excluded: it needs the separate `load-tests` feature and runs only
    # under `just load-test`.
    - name: Run it-tests (api-key, budget, rest)
      shell: bash
      run: |
        set -euo pipefail
        cargo test -p lightbridge-authz-api-key --features it-tests --tests
        cargo test -p lightbridge-authz-budget --features it-tests --tests
        cargo test -p lightbridge-authz-rest --features it-tests --test rpc_it_tests -- --test-threads=1
        cargo test -p lightbridge-authz-rest --features it-tests --test budget_rpc_it_tests -- --test-threads=1

        mapfile -t rest_parallel_tests < <(
          find crates/lightbridge-authz-rest/tests -maxdepth 1 -name '*.rs' \
            | xargs -n1 basename \
            | sed 's/\.rs$//' \
            | grep -vE '^(rpc_it_tests|budget_rpc_it_tests|load_tests)$' \
            | sort
        )
        test_args=()
        for t in "${rest_parallel_tests[@]}"; do
          test_args+=(--test "$t")
        done
        cargo test -p lightbridge-authz-rest --features it-tests --lib "${test_args[@]}"
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        AUTHZ_REDIS_URL: redis://127.0.0.1:6379
        CARGO_BUILD_JOBS: "2"
        CARGO_INCREMENTAL: "0"

    # lightbridge-authz-usage-rest's own ephemeral sqlx::test suite (repo_it_tests.rs,
    # spend_query_it_tests.rs, scope_ownership_it_tests.rs -- #570/#578) against the SAME plain
    # Postgres container as the step above -- not a dedicated TimescaleDB.
    # `migrations-usage/20260829000001_usage_event_latency.sql` is
    # deliberately written to degrade on vanilla Postgres (no Timescale-only functions), and
    # production runs plain Postgres today (#549 Finding 2); a real Timescale image produced an
    # identical schema in local verification (hypertable creation fails and is swallowed) at the
    # cost of an extra 2.4 GB pull and ~690 MiB idle RSS inside this OOM-sensitive build job, so it
    # bought nothing. Timescale-shaped CI is deferred to the epic's Phase 1 storage rewrite, gated
    # on the #581 D1 image decision -- do not reintroduce a Timescale container here before that
    # lands. `#[sqlx::test]` creates its own ephemeral DB per test, so this collides with neither
    # the shared `lightbridge_authz` database the step above uses nor with itself across the two
    # binaries.
    #
    # Test targets are named explicitly (`--test repo_it_tests --test spend_query_it_tests
    # --test scope_ownership_it_tests`) rather than `--tests`, for two reasons: it avoids
    # re-running the 88 non-DB-gated tests in
    # this crate's lib target and `usage_tests.rs` that `cargo test --workspace` already ran above,
    # and it makes a broken `--features`/`required-features` wiring a hard `cargo` error (exit
    # 101, "requires the features: `it-tests`") instead of cargo silently matching zero targets.
    # The `total passed > 0` check below is now sound (only these two it-tests binaries run under
    # these flags) and catches the one residual silent-skip case a hard cargo error can't: an
    # inner `#![cfg(feature = "it-tests")]` guard surviving after `required-features` is removed
    # from Cargo.toml, which makes cargo build an empty test binary that reports "0 tests" and
    # exits 0 (AGENTS.md: "a skipped test is not a passing test").
    - name: Run it-tests (usage)
      shell: bash
      run: |
        set -euo pipefail
        log_file="$(mktemp)"
        cargo test -p lightbridge-authz-usage-rest --features it-tests \
          --test repo_it_tests --test spend_query_it_tests \
          --test scope_ownership_it_tests 2>&1 | tee "${log_file}"
        total_passed=0
        while read -r n; do
          total_passed=$((total_passed + n))
        done < <(grep -oE '[0-9]+ passed' "${log_file}" | grep -oE '^[0-9]+' || true)
        echo "lightbridge-authz-usage-rest it-tests passed: ${total_passed}"
        if [ "${total_passed}" -eq 0 ]; then
          echo "::error::lightbridge-authz-usage-rest it-tests reported 0 passed tests -- a skip is not a pass."
          exit 1
        fi
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        CARGO_BUILD_JOBS: "2"
        CARGO_INCREMENTAL: "0"

    - name: Stop PostgreSQL and Redis
      if: always()
      shell: bash
      run: |
        docker rm -f lightbridge-pg || true
        docker rm -f lightbridge-redis || true
