name: Workspace Tests
description: Start a Postgres backend (docker) and run the workspace test suite.
inputs:
  database-url:
    description: Postgres connection string
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup

    - name: Start PostgreSQL (docker)
      shell: bash
      run: |
        set -euo pipefail
        # Run Postgres directly rather than via a job-level `services:` block, so this composite
        # stays self-contained and callable from any job. The public runner has a Docker daemon;
        # the self-hosted one was rootless podman with no daemon, which is why this used to shell
        # out to podman.
        docker run -d --name lightbridge-pg \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=lightbridge_authz \
          -p 5432:5432 \
          docker.io/library/postgres:17
        echo "Waiting for Postgres to accept connections..."
        for i in $(seq 1 60); do
          if docker exec lightbridge-pg pg_isready -U postgres -d lightbridge_authz >/dev/null 2>&1; then
            echo "Postgres is ready."
            exit 0
          fi
          sleep 2
        done
        echo "Postgres did not become ready in time; recent logs:"
        docker logs --tail 50 lightbridge-pg || true
        exit 1

    # Same memory guard as code-checks, for both reasons: this links the 24 test binaries AND it
    # compiles `lightbridge-authz-api`, the ~8 GB single-rustc `include_server_schema!` expansion
    # that made `jobs: 4` SIGTERM the code-checks job on a 16 GB runner.
    - name: Add swap headroom
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f /mnt/ci-swap ]; then
          sudo fallocate -l 8G /mnt/ci-swap
          sudo chmod 600 /mnt/ci-swap
          sudo mkswap /mnt/ci-swap >/dev/null
          sudo swapon /mnt/ci-swap
        fi
        free -h

    - name: Run tests
      shell: bash
      run: cargo test --workspace
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        CARGO_BUILD_JOBS: "2"
        CARGO_INCREMENTAL: "0"

    - name: Stop PostgreSQL
      if: always()
      shell: bash
      run: docker rm -f lightbridge-pg || true
