name: Workspace Tests
description: Start a Postgres backend (rootless podman) and run the workspace test suite.
inputs:
  database-url:
    description: Postgres connection string
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup

    - name: Start PostgreSQL (rootless podman)
      shell: bash
      run: |
        set -euo pipefail
        # The self-hosted runner is rootless (podman/buildah, no Docker daemon),
        # so GitHub `services:` containers are unavailable; run Postgres directly.
        podman run -d --name lightbridge-pg \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=lightbridge_authz \
          -p 5432:5432 \
          docker.io/library/postgres:17
        echo "Waiting for Postgres to accept connections..."
        for i in $(seq 1 60); do
          if podman exec lightbridge-pg pg_isready -U postgres -d lightbridge_authz >/dev/null 2>&1; then
            echo "Postgres is ready."
            exit 0
          fi
          sleep 2
        done
        echo "Postgres did not become ready in time; recent logs:"
        podman logs --tail 50 lightbridge-pg || true
        exit 1

    # Same memory guard as code-checks: `cargo test --workspace` links the same 24 test binaries,
    # so it hits the identical wall at cargo's default job count.
    - name: Run tests
      shell: bash
      run: cargo test --workspace
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        CARGO_BUILD_JOBS: "4"
        CARGO_INCREMENTAL: "0"

    - name: Stop PostgreSQL
      if: always()
      shell: bash
      run: podman rm -f lightbridge-pg || true
