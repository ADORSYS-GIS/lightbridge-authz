name: Heavy Build Guard
description: >-
  Prepare a GitHub-hosted runner to survive this workspace's single outsized rustc process.
  Used before every cargo invocation that compiles `lightbridge-authz-api`.

runs:
  using: composite
  steps:
    # Why this exists, established by measurement rather than inference after three failed
    # attempts (`.github/actions/code-checks` carries the sampler that produced these numbers):
    #
    #   21:07:00  used= 2648Mi  top-rss=1.3Gi rustc
    #   21:07:30  used= 8660Mi  top-rss=4.3Gi rustc
    #   21:08:00  used=14556Mi  top-rss=7.1Gi rustc   <- 15Gi RAM nearly gone
    #   21:08:15  used=15762Mi  swap= 1362Mi          <- spilling to swap
    #   21:09:15  used=15783Mi  swap=11249Mi          <- thrashing
    #   21:09:53  exit 143
    #
    # The decisive line is 21:08:00: 14.5Gi in use while the LARGEST process is 7.1Gi, against a
    # ~1.4Gi baseline. That leaves ~6Gi in a second rustc. Individual compilation units in this
    # workspace reach ~7 GB — `lightbridge-authz-api` is one `include_server_schema!` expansion of
    # `schema/authz.cstack` into the whole CRUD surface — so `CARGO_BUILD_JOBS: 2` puts two of them
    # in flight together and exceeds a 16 GB runner. Hence jobs=1 at every call site.
    #
    # Two earlier diagnoses were wrong and are recorded so they are not retried: job concurrency
    # (real, separately fixed, but not this) and systemd-oomd (the SIGTERM-not-SIGKILL signal
    # pointed there, but the runner reports it inactive). The tell against a plain kernel OOM kill
    # is that cargo prints no `(signal: 9, SIGKILL)` error of its own — the runner tears down the
    # step once the box is thrashing, so it surfaces as `exit code 143` on the step and
    # `cancelled` on the job, which reads as a scheduling artifact rather than a resource problem.
    #
    # Mostly invisible in practice: with a warm sccache these units are cache hits and never
    # compile, which is why the old 8Gi self-hosted pod coped. Only a cold cache — a fresh GHA
    # cache, or an edit to `authz.cstack` — pays the real cost.
    - name: Add swap headroom
      shell: bash
      run: |
        set -euo pipefail
        # /mnt is the runner's large ephemeral disk. Guarded so repeated use within one job is a
        # no-op.
        if ! swapon --show=NAME --noheadings 2>/dev/null | grep -q '/mnt/ci-swap'; then
          sudo fallocate -l 8G /mnt/ci-swap
          sudo chmod 600 /mnt/ci-swap
          sudo mkswap /mnt/ci-swap >/dev/null
          sudo swapon /mnt/ci-swap
        fi
        free -h
