---
services:
  postgresql:
    ports: !reset []

  timescaledb:
    ports: !reset []

  redis:
    ports: !reset []

  keycloak:
    ports: !reset []

  authz-api:
    ports: !reset []

  authz-opa:
    ports: !reset []

  authz-usage:
    ports: !reset []

  authz-mcp:
    ports: !reset []

  jaeger:
    ports: !reset []

  adminer:
    ports: !reset []

  mcp-inspector:
    ports: !reset []

  # #534/ADR-0030: generates the `it-machine` `client_credentials` (M2M) IT fixture keypair fresh
  # at every IT-stack-up and renders the IT-only `authz-idp` config that registers it -- mirrors
  # `authz-tls`'s "generate into a shared location at compose-up time, never commit it" shape.
  # See `generate_it_machine_fixtures.py`'s own doc comment for why a checked-in private key is
  # not an option here (PR #604: Gitleaks/Trivy both correctly flag a real RSA key as a secret,
  # even test-only material with no scanner allowlist to carve an exception into).
  #
  # No `profiles: ["it"]` here, unlike the three suite runners below: this service must run
  # whenever `compose.it.yaml` is loaded at all (every `just it-*` recipe), not only when a
  # specific suite's own profile is explicitly requested -- `authz-idp`'s override below depends
  # on it unconditionally. Harmless for `it-authorino`/`it-servers`, which do not need the
  # `it-machine` client at all: the rendered config is additive over the checked-in one.
  it-machine-keygen:
    image: python:3.12-slim
    volumes:
      - "./.docker:/repo/.docker"
    working_dir: /repo/.docker/it
    command:
      - sh
      - -c
      - |
        set -e
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends openssl > /dev/null
        python3 generate_it_machine_fixtures.py

  # `!override` (not the default append-merge) because this REPLACES the base `container.yaml`
  # mount at `/tmp/config.yaml` with the generated IT-only variant -- appending a second mount at
  # the identical container path would be a duplicate-mount-point error, not a merge.
  # `container.it.yaml` is `container.yaml` (read unmodified) PLUS the `it-machine` client entry;
  # the checked-in `container.yaml` itself never carries an `it-machine` entry, so the plain
  # `just up` stack (which never loads this file) never has one to validate at startup either.
  authz-idp:
    volumes: !override
      - ./.docker/authz/container.it.yaml:/tmp/config.yaml:ro
      - "authz_tls:/tls:ro"
    depends_on:
      it-machine-keygen:
        condition: service_completed_successfully

  it-authorino:
    # Gated behind the `it` profile so a plain `up -d` (which every `just it-*` recipe runs to
    # bring the stack up) starts ONLY the infrastructure, never the suites themselves. Without
    # this, `up -d` launched all THREE suites concurrently and then `run --rm <suite>` executed a
    # fourth -- four scenarios racing on one Keycloak user's account and projects in the same
    # database. `docker compose run` auto-enables the named service's own profiles, so the recipes
    # need no `--profile` flag.
    #
    # The race used to be invisible: concurrent `createAccount` calls collided on the accounts
    # primary key, and every suite tolerated the 409 as "already provisioned", so they all
    # converged on one account by accident. ADR-0026 makes a repeat call mint a NEW account
    # instead, which turned that latent concurrency into three accounts created inside 5ms and a
    # failing anchor assertion -- surfacing the problem rather than causing it.
    profiles: ["it"]
    image: python:3.12-slim
    depends_on:
      authz-api:
        condition: service_started
      authz-opa:
        condition: service_started
      keycloak:
        condition: service_started
    volumes:
      - "./.docker/it/authorino_it.py:/it/authorino_it.py:ro"
      # ADR-0013: authz-api's RPC surface is CBOR-only now, so this script needs a CBOR codec to
      # call it directly (see cbor_min.py's own module doc for why this is hand-rolled rather than
      # a pip-installed dependency).
      - "./.docker/it/cbor_min.py:/it/cbor_min.py:ro"
    environment:
      KEYCLOAK_URL: "http://keycloak:9100"
      API_URL: "https://authz-api:3000"
      OPA_URL: "https://authz-opa:3001"
      CLIENT_ID: "test-client"
      USERNAME: "test@admin"
      PASSWORD: "test"
      AUTHORINO_BASIC: "authorino:change-me"
      MAX_WAIT_SECONDS: "300"
    command: ["python", "/it/authorino_it.py"]

  it-servers:
    # Gated behind the `it` profile so a plain `up -d` (which every `just it-*` recipe runs to
    # bring the stack up) starts ONLY the infrastructure, never the suites themselves. Without
    # this, `up -d` launched all THREE suites concurrently and then `run --rm <suite>` executed a
    # fourth -- four scenarios racing on one Keycloak user's account and projects in the same
    # database. `docker compose run` auto-enables the named service's own profiles, so the recipes
    # need no `--profile` flag.
    #
    # The race used to be invisible: concurrent `createAccount` calls collided on the accounts
    # primary key, and every suite tolerated the 409 as "already provisioned", so they all
    # converged on one account by accident. ADR-0026 makes a repeat call mint a NEW account
    # instead, which turned that latent concurrency into three accounts created inside 5ms and a
    # failing anchor assertion -- surfacing the problem rather than causing it.
    profiles: ["it"]
    image: python:3.12-slim
    depends_on:
      authz-api:
        condition: service_started
      authz-opa:
        condition: service_started
      authz-usage:
        condition: service_started
      authz-mcp:
        condition: service_started
      keycloak:
        condition: service_started
      authz-tls:
        condition: service_started
    volumes:
      - "./.docker/it/servers_it.py:/it/servers_it.py:ro"
      # ADR-0013: authz-api's/authz-budget's RPC surfaces are CBOR-only now (see cbor_min.py's own
      # module doc for why this is hand-rolled rather than a pip-installed dependency).
      - "./.docker/it/cbor_min.py:/it/cbor_min.py:ro"
      # Read-only access to the local CA + a CA-signed leaf (api.crt/api.key) so this test runner
      # can present a client certificate against authz-usage's mTLS-required query listener
      # (#347), the same way authz-api itself does (usage_service.client_cert_path/client_key_path
      # in .docker/authz/container.yaml).
      - "authz_tls:/tls:ro"
    environment:
      KEYCLOAK_URL: "http://keycloak:9100"
      API_URL: "https://authz-api:3000"
      OPA_URL: "https://authz-opa:3001"
      USAGE_URL: "https://authz-usage:3002"
      USAGE_QUERY_URL: "https://authz-usage:3006"
      USAGE_CLIENT_CERT: "/tls/api.crt"
      USAGE_CLIENT_KEY: "/tls/api.key"
      MCP_URL: "https://authz-mcp:3000"
      CLIENT_ID: "test-client"
      USERNAME: "test@admin"
      PASSWORD: "test"
      AUTHORINO_BASIC: "authorino:change-me"
      MAX_WAIT_SECONDS: "300"
    command: ["python", "/it/servers_it.py"]

  it-idp:
    # Gated behind the `it` profile so a plain `up -d` (which every `just it-*` recipe runs to
    # bring the stack up) starts ONLY the infrastructure, never the suites themselves. Without
    # this, `up -d` launched all THREE suites concurrently and then `run --rm <suite>` executed a
    # fourth -- four scenarios racing on one Keycloak user's account and projects in the same
    # database. `docker compose run` auto-enables the named service's own profiles, so the recipes
    # need no `--profile` flag.
    #
    # The race used to be invisible: concurrent `createAccount` calls collided on the accounts
    # primary key, and every suite tolerated the 409 as "already provisioned", so they all
    # converged on one account by accident. ADR-0026 makes a repeat call mint a NEW account
    # instead, which turned that latent concurrency into three accounts created inside 5ms and a
    # failing anchor assertion -- surfacing the problem rather than causing it.
    profiles: ["it"]
    image: python:3.12-slim
    depends_on:
      authz-idp:
        condition: service_started
      authz-api:
        condition: service_started
      keycloak:
        condition: service_started
      authz-tls:
        condition: service_started
      # #534/ADR-0030: this suite reads the it-machine private key directly (below) -- explicit,
      # not merely relied on transitively via authz-idp's own dependency on the same service, so a
      # future change to authz-idp's deps can't silently break this one.
      it-machine-keygen:
        condition: service_completed_successfully
    volumes:
      - "./.docker/it/idp_it.py:/it/idp_it.py:ro"
      # ADR-0013: authz-api's RPC surface is CBOR-only now (see cbor_min.py's own module doc for
      # why this is hand-rolled rather than a pip-installed dependency) -- this suite provisions
      # the account/project it needs through that surface before driving any IdP flow.
      - "./.docker/it/cbor_min.py:/it/cbor_min.py:ro"
      # #534/ADR-0030: the dependency-free RS256 signer/verifier for the live client_credentials
      # coverage (see jwt_min.py's own module doc for why this is hand-rolled too), and the
      # `it-machine` client's freshly generated private key (never checked into the repo --
      # `generate_it_machine_fixtures.py`'s own doc comment explains why) it signs assertions with.
      - "./.docker/it/jwt_min.py:/it/jwt_min.py:ro"
      - "./.docker/it/generated:/it/generated:ro"
      - "authz_tls:/tls:ro"
    environment:
      IDP_URL: "https://authz-idp:3004"
      API_URL: "https://authz-api:3000"
      KEYCLOAK_URL: "http://keycloak:9100"
      CLIENT_ID: "test-client"
      USERNAME: "test@admin"
      PASSWORD: "test"
      MAX_WAIT_SECONDS: "300"
      IT_MACHINE_KEY_PATH: "/it/generated/it-machine-key.pem"
    command: ["python", "/it/idp_it.py"]
