server:
  # Ingest-only listener: /v1/otel/{traces,metrics,logs} + health probes + Swagger docs.
  # Unauthenticated -- see UsageServerGroup::usage's doc comment (crates/lightbridge-authz-usage/src/config.rs).
  usage:
    address: "0.0.0.0"
    port: 3002
    tls:
      cert_path: "./config/tls/usage.crt"
      key_path: "./config/tls/usage.key"
  # mTLS-required listener (#347): /usage/v1/usage/query + /usage/v1/spend/query. Required (not
  # optional) -- see UsageServerGroup::query's doc comment. `client_ca_bundle_path` points at a CA
  # bundle this non-Compose local run doesn't generate by default (see AGENTS.md's note that
  # ./config/tls/* may not exist without manual setup); populate it the same way you would
  # cert_path/key_path above, or run via Compose (just up) where authz-tls provisions it.
  query:
    address: "0.0.0.0"
    port: 3006
    tls:
      cert_path: "./config/tls/usage.crt"
      key_path: "./config/tls/usage.key"
      client_ca_bundle_path: "./config/tls/ca.crt"
logging:
  level: "info"
database:
  # Same silent-misconfiguration bug class as config/default.yaml's database.url (lightbridge-
  # authz#PR447): a bare literal here means `cargo run -p lightbridge-authz-usage -- migrate
  # --config-path config/usage.yaml` would silently ignore an exported env var and connect to
  # localhost regardless. Deliberately named USAGE_DATABASE_URL, not DATABASE_URL -- this repo's
  # main authz stack already treats a plain `DATABASE_URL` export as its own convention (see
  # AGENTS.md's it-tests instructions and this config's sibling config/default.yaml); reusing that
  # same name here would silently repoint the *usage* migrate/service at the *authz* database
  # whenever both are exported in the same shell, which is exactly the class of bug this fix
  # removes, not one to reintroduce under a different name.
  url: "${USAGE_DATABASE_URL:-postgres://postgres:postgres@localhost:5432/lightbridge_authz_usage}"
  pool_size: 10
otel:
  enabled: true
  otlp_endpoint: "http://localhost:4317"
  service_name: "lightbridge-authz-usage"
