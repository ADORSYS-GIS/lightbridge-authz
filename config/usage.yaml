server:
  usage:
    address: "0.0.0.0"
    port: 3002
    tls:
      cert_path: "./config/tls/usage.crt"
      key_path: "./config/tls/usage.key"
    # Basic-auth credentials gating /usage/v1/spend/query only -- every other route on this
    # server (OTEL ingest, /usage/v1/usage/query, health probes, docs) stays unauthenticated.
    # Must match server.api's `usage_service.basic_auth` in config/default.yaml.
    basic_auth:
      username: "usage-internal"
      password: "change-me"
logging:
  level: "info"
database:
  url: "postgres://postgres:postgres@localhost:5432/lightbridge_authz_usage"
  pool_size: 10
otel:
  enabled: true
  otlp_endpoint: "http://localhost:4317"
  service_name: "lightbridge-authz-usage"
