server:
  # Ingest-only listener: /v1/otel/{traces,metrics,logs} + health probes + Swagger docs.
  # Unauthenticated -- see UsageServerGroup::usage's doc comment (crates/lightbridge-authz-usage/src/config.rs).
  usage:
    address: "0.0.0.0"
    port: 3002
    tls:
      cert_path: "./config/tls/usage.crt"
      key_path: "./config/tls/usage.key"
  # mTLS-required listener (#347): /usage/v1/usage/query + /usage/v1/spend/query. Required (not
  # optional) -- see UsageServerGroup::query's doc comment. `client_ca_bundle_path` points at a CA
  # bundle this non-Compose local run doesn't generate by default (see AGENTS.md's note that
  # ./config/tls/* may not exist without manual setup); populate it the same way you would
  # cert_path/key_path above, or run via Compose (just up) where authz-tls provisions it.
  query:
    address: "0.0.0.0"
    port: 3006
    tls:
      cert_path: "./config/tls/usage.crt"
      key_path: "./config/tls/usage.key"
      client_ca_bundle_path: "./config/tls/ca.crt"
logging:
  level: "info"
database:
  # Same silent-misconfiguration bug class as config/default.yaml's database.url (lightbridge-
  # authz#PR447): a bare literal here means `cargo run -p lightbridge-authz-usage -- migrate
  # --config-path config/usage.yaml` would silently ignore an exported env var and connect to
  # localhost regardless. Deliberately named USAGE_DATABASE_URL, not DATABASE_URL -- this repo's
  # main authz stack already treats a plain `DATABASE_URL` export as its own convention (see
  # AGENTS.md's it-tests instructions and this config's sibling config/default.yaml); reusing that
  # same name here would silently repoint the *usage* migrate/service at the *authz* database
  # whenever both are exported in the same shell, which is exactly the class of bug this fix
  # removes, not one to reintroduce under a different name.
  url: "${USAGE_DATABASE_URL:-postgres://postgres:postgres@localhost:5432/lightbridge_authz_usage}"
  pool_size: 10
otel:
  enabled: true
  otlp_endpoint: "http://localhost:4317"
  service_name: "lightbridge-authz-usage"
# #570: validates the end-user bearer token `/usage/v1/usage/query` now requires. Reuses the same
# JWKS this deployment's Keycloak realm already serves for authz-api/authz-opa (see
# config/default.yaml's own oauth2.jwks_url) -- this service only ever reads jwks_url off this
# block (plus audience/rbac if set); `type` is required by the shared Oauth2 struct but has no
# effect here since this service never mints anything.
oauth2:
  type: external
  jwks_url: "http://localhost:9100/realms/dev/protocol/openid-connect/certs"
# #570: the ownership authority `/usage/v1/usage/query` calls for `account`/`project` scopes --
# authz-opa's POST /idp/v1/authorize-usage-scope. Basic-auth credential must match authz-opa's own
# server.opa.basic_auth (see config/default.yaml). insecure_skip_verify is only for local/dev runs
# against a self-signed certificate with no shared CA bundle mounted here.
scope_authority:
  base_url: "https://localhost:13001"
  username: "authorino"
  password: "change-me"
  insecure_skip_verify: true
# #549 AC2: retention/rollup for usage_events. Shipped uncommented because the job is ON by default
# (a destructive DELETE loop must never be invisible in the rendered config). The background job
# rolls raw rows older than raw_days into usage_events_daily and deletes them, and deletes rolled-up
# days older than rollup_days, in one transaction. raw_days MUST be >= 90 (the dashboard's max
# range); rollup_days MUST be > raw_days (otherwise a rolled-up day is deleted in the same
# transaction that wrote it).
retention:
  enabled: true
  raw_days: 90
  rollup_days: 365
  interval_seconds: 3600
