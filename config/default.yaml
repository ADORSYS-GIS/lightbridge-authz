server:
  api:
    address: "0.0.0.0"
    port: 3000
    tls:
      cert_path: "./config/tls/api.crt"
      key_path: "./config/tls/api.key"
    # Consumed only by the MCP server: hostnames/authorities accepted in the inbound Host header
    # (DNS-rebinding protection). Defaults to localhost/127.0.0.1/::1 when unset — override in any
    # deployment where the MCP server is reached by a service name or ingress host.
    # allowed_hosts: ["localhost", "127.0.0.1"]
    # Consumed only by authz-api: base path the generated RPC CRUD surface is mounted under.
    # Unset (default) serves the ops at /rpc/<op_id>; set e.g. /api to serve them at
    # /api/rpc/<op_id> so the server matches a generated client whose basePath is /api without an
    # edge rewrite. Only the RPC surface moves — health probes, /.well-known/*, and /oauth2/token
    # stay at the root. Leading slash is added if missing, trailing slash stripped; "" or "/" = root.
    # rpc_base_path: /api
  opa:
    address: "0.0.0.0"
    port: 3001
    tls:
      cert_path: "./config/tls/opa.crt"
      key_path: "./config/tls/opa.key"
    basic_auth:
      username: "authorino"
      password: "change-me"
  # authz-idp (ADR-0012 Phase 1): the OIDC broker service carrying discovery/JWKS/token-exchange
  # off authz-api. Transitional -- authz-api keeps serving the same surface too until the
  # auth.ai.camer.digital ingress is repointed at authz-idp (a separate, later cutover PR).
  idp:
    address: "0.0.0.0"
    port: 3004
    tls:
      cert_path: "./config/tls/idp.crt"
      key_path: "./config/tls/idp.key"
  # authz-budget: the budget-domain microservice carrying every budget:*-gated RPC procedure off
  # authz-api (hard cutover, not a transitional duplication like idp above -- see
  # docs/architecture/budget.md). Its RPC surface is mounted under a fixed /budget prefix
  # (/budget/rpc/<op_id>), not the configurable rpc_base_path authz-api uses.
  budget:
    address: "0.0.0.0"
    port: 3005
    tls:
      cert_path: "./config/tls/budget.crt"
      key_path: "./config/tls/budget.key"
logging:
  level: "info"
database:
  url: "postgres://postgres:postgres@localhost:5432/lightbridge_authz"
  pool_size: 10
# Mandatory for authz-api, authz-idp, and authz-budget -- each refuses to start without it (see
# AGENTS.md's "Redis is a mandatory dependency" house rule). Used for Redis-backed rate limiting
# on authz-api/authz-budget (docs/adr/0003-cratestack-crud-migration.md, "Rate limiting
# (Redis-backed)") and for authz-idp's private_key_jwt replay-protection store (ADR-0011,
# Decision 6). authz-opa, lightbridge-mcp, and the usage service are explicitly freed from this
# requirement and ignore this block entirely.
#
# Local Compose Redis is plaintext (redis://), so ca_bundle_path is left unset here. Real
# deployments (including in-cluster ones) point url at rediss:// -- the cluster's redis-ha is
# TLS-only -- and MUST set ca_bundle_path to the cluster's own CA bundle (e.g.
# /etc/lightbridge/tls/ca.crt, the same ca.crt this service's own TLS cert/key are issued
# alongside -- see the usage_service block below for the identical CA). lightbridge-authz#363;
# see crates/lightbridge-authz-rest/src/redis_tls.rs for the fail-closed contract: a rediss://
# url with a missing/unreadable ca_bundle_path is a hard startup failure, never a silent
# fallback to plaintext or an unverified handshake.
redis:
  url: "${REDIS_URL:-redis://localhost:6379}"
  # ca_bundle_path: /etc/lightbridge/tls/ca.crt
# HTTP client for authz-api's budget domain to call the usage service's mTLS-required query
# listener (UsageServerGroup::query, port 3006/host 13006 -- #347 split the old single usage port
# into an unauthenticated ingest listener and this query listener; see
# crates/lightbridge-authz-budget/src/spend.rs and crates/lightbridge-authz-usage/src/config.rs).
# Optional, like redis above: only authz-api reads this; authz-opa/lightbridge-mcp/usage ignore
# it. Absent -> budget refill spend facts report Spend::Unavailable (fails closed to manual
# review), not a startup failure.
#
# client_cert_path/client_key_path (#347) present this process's own cert as a client identity for
# mTLS. Commented out here (like ca_bundle_path below) since this non-container config has no
# generated cert to point at by default -- see AGENTS.md's note that ./config/tls/* may not exist
# without manual setup. Run via Compose (just up) for a working end-to-end mTLS example, where the
# authz-tls service provisions a CA-signed cert with both serverAuth and clientAuth EKU.
#
# insecure_skip_verify: true is only for this local, non-container config, which has no shared CA
# bundle to point at. Real deployments (including in-cluster ones) must set insecure_skip_verify:
# false and instead set ca_bundle_path to the cluster's own CA bundle (e.g.
# /etc/lightbridge/tls/ca.crt, the ca.crt cert-manager writes alongside this service's own TLS
# cert/key -- see Config::usage_service's doc comment in crates/lightbridge-authz-core). An
# unreadable or unparseable ca_bundle_path, client_cert_path, or client_key_path is a hard startup
# failure, never a silent fallback.
usage_service:
  base_url: "https://localhost:13006"
  insecure_skip_verify: true
  # ca_bundle_path: /etc/lightbridge/tls/ca.crt
  # client_cert_path: ./config/tls/api.crt
  # client_key_path: ./config/tls/api.key
  timeout_ms: 5000
oauth2:
  # REQUIRED credential-issuance mode — no default; you must state it.
  #   self     → this service mints self-signed JWT API keys (uses `signing` below).
  #   external → API keys are exchanged at the upstream IdP/Keycloak (uses `issuance` below).
  type: self
  jwks_url: "http://localhost:9100/realms/dev/protocol/openid-connect/certs"
  oauth2_url: "http://localhost:9100/realms/dev/protocol/openid-connect/token"
  # Expected audience claim(s) in JWT tokens. If set, tokens must contain at least one of these values.
  # This is critical for security - ensures tokens are intended for this service.
  # When empty or not set, audience validation is disabled.
  #
  # Valid audience values:
  #   - lightbridge-api-key: Primary audience for API Key service
  #   - lightbridge-token-issuer: Audience for token issuer service
  audience:
    - "lightbridge-api-key"
    - "lightbridge-token-issuer"
  # Used only when `type: external` — exchanges the credential at the upstream IdP (Keycloak
  # token-exchange). Ignored under `type: self`.
  issuance:
    grant_type: "urn:ietf:params:oauth:grant-type:token-exchange"
    client_id: "${KEYCLOAK_TOKEN_CLIENT_ID:-lightbridge-token-issuer}"
    client_secret: "${KEYCLOAK_TOKEN_CLIENT_SECRET:-lightbridge-token-issuer-secret}"
    subject_token_type: "urn:ietf:params:oauth:token-type:access_token"
    requested_token_type: "urn:ietf:params:oauth:token-type:access_token"
  # Self-signed API-key JWTs (enterprise: the credential must be a JWT). When enabled, issued
  # keys are RS256 JWTs signed by this service, carrying api_key_id/project_id/account_id/
  # allowed_models claims. The signing keypair is generated on first startup and stored in the
  # DB (signing_keys table); the public keys are published as JWKS (+ OIDC discovery) so
  # Authorino verifies signatures via its `jwt` identity. Revocation still flows through the
  # introspection endpoint. The active key auto-rotates once older than max_key_age_days; the
  # rotated-out key is marked stale and kept in the JWKS until its tokens expire.
  # Used only when `type: self` — RS256 keypair generated + stored in the DB, JWKS published for
  # Authorino. Ignored under `type: external`.
  signing:
    issuer: "${JWT_SIGNING_ISSUER:-https://localhost:13000}"
    audience: "${JWT_SIGNING_AUDIENCE:-lightbridge-api-key}"
    ttl_seconds: ${JWT_SIGNING_TTL_SECONDS:-7776000}
    max_key_age_days: ${JWT_SIGNING_MAX_KEY_AGE_DAYS:-30}
  # Native RFC 8693 token-exchange (POST /oauth2/token). Requires `signing`. Exchanges an upstream
  # IdP access token (+ project_id) for a short-lived project-scoped self-signed JWT, plus a
  # revocable refresh token when `offline_access` is requested. Independent of `issuance`.
  token_exchange:
    enabled: ${TOKEN_EXCHANGE_ENABLED:-false}
    access_ttl_seconds: ${TOKEN_EXCHANGE_ACCESS_TTL_SECONDS:-900}
    refresh_ttl_seconds: ${TOKEN_EXCHANGE_REFRESH_TTL_SECONDS:-2592000}
    # Absolute cap on a refresh-token chain's lifetime, independent of the per-rotation TTL above
    # -- see Oauth2TokenExchange::refresh_absolute_ttl_seconds's doc comment for why this exists.
    refresh_absolute_ttl_seconds: ${TOKEN_EXCHANGE_REFRESH_ABSOLUTE_TTL_SECONDS:-7776000}
    allowed_scopes:
      - openid
      - profile
      - email
      - offline_access
  # Real, config-sourced OAuth2/OIDC clients permitted to use the token-exchange endpoint above
  # (ADR-0011, Decision 5). Empty here by default -- with no clients registered, every exchange
  # fails client authentication (invalid_client), it is not left unprotected. Uncomment/adapt when
  # enabling token_exchange for a real client. `public` clients present no credential beyond
  # client_id; `confidential` clients authenticate via `private_key_jwt` only (ADR-0011, Decision
  # 6 -- never client_secret_basic/client_secret_post) and need their public key inline as `jwks`
  # (a JWK Set: `{"keys": [...]}`) -- there is deliberately no `jwks_uri`.
  # clients:
  #   - client_id: lightbridge-ss
  #     type: public
  #     scopes: [openid, profile, email, offline_access]
  #     grant_types:
  #       - "urn:ietf:params:oauth:grant-type:token-exchange"
  #       - refresh_token
  #     allowed_audiences: [lightbridge-ss]
  #   - client_id: lightbridge-mcp
  #     type: confidential
  #     scopes: [openid, profile, email, offline_access]
  #     grant_types:
  #       - "urn:ietf:params:oauth:grant-type:token-exchange"
  #       - refresh_token
  #     allowed_audiences: [lightbridge-mcp]
  #     jwks:
  #       keys:
  #         - kty: RSA
  #           kid: "lightbridge-mcp-2026-08"
  #           alg: RS256
  #           n: "<base64url-encoded RSA modulus of lightbridge-mcp's public key>"
  #           e: "AQAB"
  # Role-based access control. Roles arrive on the JWT in a single, flat, top-level claim
  # (`roles_claim`, configurable). Each role maps to the permissions it grants; a grant is `*`
  # (everything), `<resource>:*` (all actions on a resource), or `<resource>:<action>`. These
  # permissions gate every CRUD/MCP operation — a caller whose roles grant nothing is denied
  # (HTTP 403). See docs/rbac.md for the full claim ↔ permission mapping.
  rbac:
    roles_claim: "${RBAC_ROLES_CLAIM:-lightbridge_api_roles}"
    role_permissions:
      lightbridge-admin:
        - "*"
      lightbridge-editor:
        - "account:create"
        - "account:read"
        - "project:*"
        - "apikey:*"
        - "budget:self-refill"
        - "budget:read-own"
      lightbridge-viewer:
        - "account:create"
        - "account:read"
        - "project:read"
        - "apikey:read"
        - "budget:read-own"

otel:
  enabled: true
  otlp_endpoint: "http://localhost:4317"
  service_name: "lightbridge-authz"

# Billing plans a caller may attach to an API key at creation time. Operator-defined catalogue
# (no plan table/entity): each plan has a stable `id` (stored on the key and named in
# CreateApiKey), a UI `name`, and optional `limits`. A CreateApiKey must name one of these ids or
# it is rejected with 400. Token introspection resolves the id to the plan's name + limits.
#
# `plans` also accepts a single JSON-array string for fully env-driven setups, e.g.
#   billing: { plans: "${BILLING_PLANS}" }  with BILLING_PLANS='[{"id":"free","name":"Free"}]'
billing:
  plans:
    - id: free
      name: Free
      limits:
        requests_per_second: 5
        requests_per_day: 1000
        concurrent_requests: 2
    - id: pro
      name: Pro
      limits:
        requests_per_second: 50
        requests_per_day: 50000
        requests_per_month: 1000000
        concurrent_requests: 20
    # No `limits` block ⇒ unlimited on every dimension (the edge treats absent limits as no cap).
    - id: enterprise
      name: Enterprise

# The operator-configured AI-model catalogue backing `listModelCatalog`, a read-only display aid
# for a `Project.allowedModels` checkbox picker (see that procedure's schema doc comment). Unlike
# `billing` above, an empty/absent catalogue is a supported default -- there is no write-path
# validation against it. The two entries below are obviously-fake, local-dev-only placeholders,
# not real production model ids -- an operator supplies the real catalogue for their deployment.
#
# `models` also accepts a single JSON-array string for fully env-driven setups, e.g.
#   models: { models: "${MODEL_CATALOG}" }  with MODEL_CATALOG='[{"id":"dev-model-a","name":"Dev Model A"}]'
models:
  models:
    - id: dev-model-a
      name: Dev Model A (local dev only)
    - id: dev-model-b
      name: Dev Model B (local dev only)

# Ceiling on how far in the future createApiKey/rotateApiKey may set expires_at
# (lightbridge-authz#395: every API key must carry an expiry, no more nullable "never expires"
# keys). Commented out here deliberately: the default (90 days) already applies when this block is
# absent -- unlike `billing`/`quota_tiers`/`models` above, an absent block does NOT mean "accept
# anything", it means "use the conservative built-in ceiling" (see `ApiKeyExpiry`'s own doc
# comment in lightbridge-authz-core). Uncomment only to override the default.
# api_key_expiry:
#   max_lifetime_days: 90

