[package]
name = "lightbridge-authz-budget"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
sqlx.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# The snapshot refresher owns its own interval loop and bounds its spend reads with a `JoinSet`
# (ADR-0034 section 15), so this crate needs the runtime rather than borrowing the caller's.
tokio.workspace = true
tracing.workspace = true

[dependencies.lightbridge-authz-core]
workspace = true

[dev-dependencies]
httpmock.workspace = true
axum.workspace = true
axum-server.workspace = true
rustls.workspace = true
rcgen.workspace = true
time.workspace = true

