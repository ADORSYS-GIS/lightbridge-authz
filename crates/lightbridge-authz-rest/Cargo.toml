[package]
name = "lightbridge-authz-rest"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[package.metadata]
description = "REST server crate for Lightbridge Authz"

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
base64.workspace = true
axum-server.workspace = true
getrandom.workspace = true
reqwest.workspace = true
rustls.workspace = true
lightbridge-authz-api.workspace = true
lightbridge-authz-core = { workspace = true, features = ["axum"] }
lightbridge-authz-api-key.workspace = true
lightbridge-authz-bearer.workspace = true
lightbridge-authz-budget.workspace = true
jsonwebtoken.workspace = true
authkestra-op.workspace = true
authkestra-engine.workspace = true
rsa.workspace = true
rand_core.workspace = true
sha2.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
tower-http.workspace = true
cratestack-core.workspace = true
cratestack-axum.workspace = true
cratestack-redis.workspace = true
# Direct client for `oauth2_op::client_assertion_store` (ADR-0011 phase 2): `ClientAssertionStore`
# needs raw `SET NX PX` semantics, which `cratestack-redis` (a `RateLimitStore` implementation,
# not a general-purpose client) does not expose.
redis.workspace = true
# Server facade + wire codecs: rest builds the generated RPC router, implements the
# ProcedureRegistry, and wraps it with the CBOR/JSON codec set (ADR-0003).
cratestack = { workspace = true }
cratestack-codec-cbor.workspace = true
cratestack-codec-json.workspace = true
minicbor.workspace = true

[dev-dependencies]
tokio.workspace = true
chrono.workspace = true
anyhow.workspace = true
goose.workspace = true
reqwest.workspace = true
sqlx.workspace = true
httpmock.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true

[features]
load-tests = []
it-tests = []

[[test]]
name = "load_tests"
path = "tests/load_tests.rs"
harness = false
required-features = ["load-tests"]
