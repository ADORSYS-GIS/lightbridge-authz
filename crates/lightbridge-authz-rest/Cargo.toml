[package]
name = "lightbridge-authz-rest"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[package.metadata]
description = "REST server crate for Lightbridge Authz"

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
base64.workspace = true
axum-server.workspace = true
getrandom.workspace = true
reqwest.workspace = true
rustls.workspace = true
lightbridge-authz-api.workspace = true
lightbridge-authz-core = { workspace = true, features = ["axum"] }
lightbridge-authz-api-key.workspace = true
lightbridge-authz-bearer.workspace = true
lightbridge-authz-budget.workspace = true
jsonwebtoken.workspace = true
authkestra-op.workspace = true
authkestra-engine.workspace = true
rsa.workspace = true
rand_core.workspace = true
sha2.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
tower-http.workspace = true
cratestack-core.workspace = true
cratestack-axum.workspace = true
cratestack-redis.workspace = true
# Direct client for `oauth2_op::client_assertion_store` (ADR-0011 phase 2): `ClientAssertionStore`
# needs raw `SET NX PX` semantics, which `cratestack-redis` (a `RateLimitStore` implementation,
# not a general-purpose client) does not expose.
redis.workspace = true
# Server facade + wire codec: rest builds the generated RPC router, implements the
# ProcedureRegistry, and wraps it with the lenient CBOR codec (ADR-0013 — CBOR is the only
# transport codec; no JSON encoder ships in this crate's production code).
cratestack = { workspace = true }
cratestack-codec-cbor.workspace = true
minicbor.workspace = true
minicbor-serde.workspace = true

[dev-dependencies]
tokio.workspace = true
chrono.workspace = true
anyhow.workspace = true
goose.workspace = true
reqwest.workspace = true
sqlx.workspace = true
httpmock.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
# Dev-only: tests use this to prove a JSON-Content-Type request is now rejected (415) and to keep
# `common::Wire::Json` as that negative-path probe. Never a production dependency post-ADR-0013.
cratestack-codec-json.workspace = true
# Dev-only (lightbridge-authz#363): `redis_tls_tests.rs` generates throwaway CA/leaf keypairs
# (rcgen, same pattern as lightbridge-authz-budget's usage_service_ca_bundle_tests.rs) and serves
# them over a raw rustls TLS TCP acceptor (tokio-rustls) to prove
# `redis_tls::build_redis_client` actually verifies the server certificate, not just plumbs the
# config through.
rcgen.workspace = true
time.workspace = true
tokio-rustls.workspace = true

[features]
load-tests = []
it-tests = []

[[test]]
name = "load_tests"
path = "tests/load_tests.rs"
harness = false
required-features = ["load-tests"]
