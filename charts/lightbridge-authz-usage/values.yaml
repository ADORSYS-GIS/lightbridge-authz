enabled: true

global:
  authz_usage:
    image:
      version: "0.8.1"
      repository: "ghcr.io/adorsys-gis/lightbridge-authz-usage"

# Since #347, `UsageConfig::server` requires BOTH `usage` (the unauthenticated ingest listener)
# and `query` (the mTLS-required listener for `/usage/v1/usage/query` +
# `/usage/v1/spend/query`) -- see `UsageServerGroup` in
# crates/lightbridge-authz-usage/src/config.rs. A config omitting `server.query` fails to load
# (`config_missing_query_server_fails_to_load`), which is exactly what this chart used to render:
# neither `serve` nor `migrate` could start on Kubernetes. `configMaps.config.data."config.yaml"`
# below now renders both listeners.
config:
  query:
    tls:
      # Path (inside the mounted `*-tls` secret -- see `persistence.tls` below) to a PEM CA
      # bundle used to require and verify a client certificate on the query listener
      # (`Tls::client_ca_bundle_path`, crates/lightbridge-authz-core/src/config/mod.rs). That
      # field is `Option<String>`, so leaving this empty (the default) omits
      # `client_ca_bundle_path` from the rendered config entirely and the query listener falls
      # back to server-only TLS -- no client-certificate requirement, but still a config that
      # loads and a binary that starts. That is the deliberately least-disruptive default here.
      #
      # Set this to a path such as "/etc/lightbridge/tls/ca.crt" once you have confirmed the
      # `*-tls` secret this chart mounts actually contains a CA entry there -- e.g. a cert-manager
      # Certificate backed by a CA-type Issuer emits `ca.crt` alongside `tls.crt`/`tls.key`
      # automatically (the same convention `Config::usage_service`'s doc comment documents for
      # the calling side, in `.docker/authz/container.yaml`).
      #
      # THE BUILT-IN `global.tls.job` in charts/lightbridge-authz-stack DOES NOT produce a CA at
      # all for this secret today -- it mints independent self-signed leaf certs per service
      # (api.crt, opa.crt, ..., usage.crt), unlike the local Compose TLS generator
      # (`compose.yaml`'s `authz-tls` service), which signs every leaf off one shared CA and
      # writes `ca.crt` alongside them. Do not point this at that job's secret without first
      # giving it a shared CA to sign from -- an unreadable `client_ca_bundle_path` is a hard
      # startup failure (see that field's doc comment), not a silent fallback.
      clientCaBundlePath: ""

controllers:
  main:
    type: deployment
    replicas: 1
    # Zero-downtime rollout -- see the matching comment in
    # charts/lightbridge-authz/values.yaml for the mechanism this fixes (bjw-s/common
    # defaults an unset `strategy` to `Recreate`, which killed all pods before creating
    # replacements on every deploy).
    # `unavailable` is quoted "0" (not bare int 0) -- see the full explanation in
    # charts/lightbridge-authz/values.yaml: bjw-s/common's `with .unavailable` treats an
    # int zero as empty and drops `maxUnavailable` from the render entirely.
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: "0"
      surge: 1
    podDisruptionBudget:
      maxUnavailable: 1
    # Second (later) sync-wave than `migrate` below -- see the matching comment in
    # charts/lightbridge-authz/values.yaml (docs/adr/0016-migrate-job-sync-wave-not-hook.md) for
    # the full incident/reasoning this mirrors.
    annotations:
      "argocd.argoproj.io/sync-wave": "2"
    containers:
      authz:
        image:
          repository: "{{ .Values.global.authz_usage.image.repository }}"
          tag: "{{ .Values.global.authz_usage.image.version }}"
          pullPolicy: IfNotPresent
        args:
          - serve
          - --config-path
          - /etc/lightbridge/config.yaml
        ports:
          - name: http
            containerPort: 3000
            protocol: TCP
          # mTLS-required query listener (#347). Port 3006 mirrors the local Compose config
          # (`.docker/usage/container.yaml`) and the port already named in
          # `.docker/authz/container.yaml`'s `usage_service.base_url` comment
          # ("port 3006, UsageServerGroup::query") -- i.e. the port every other reference to this
          # listener in the repo already assumes. `http` (ingest, 3000) is left unchanged so
          # nothing that already points at this chart's existing port breaks.
          - name: query
            containerPort: 3006
            protocol: TCP
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DATABASE_URL
        # Probes stay pointed at the ingest listener (`http`/3000) even though the query listener
        # exposes its own `/healthz*` routes too (UsageServerGroup::query's doc comment). The
        # query listener requires a client certificate at the TLS handshake, before any HTTP
        # request is even read (`Tls::client_ca_bundle_path`'s doc comment) -- a plain kubelet
        # `httpGet` probe presents none, so probing that port would refuse the handshake and the
        # pod would never go healthy. This mirrors the ingest-listener-only probing compose and
        # `config/usage.yaml` already use.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
              httpGet:
                scheme: HTTPS
                path: /healthz
                port: http
          readiness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
              httpGet:
                scheme: HTTPS
                path: /healthz/ready
                port: http
          startup:
            enabled: true
            custom: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
              timeoutSeconds: 2
              httpGet:
                scheme: HTTPS
                path: /healthz/startup
                port: http

  migrate:
    type: job
    # NOT a Helm hook -- see charts/lightbridge-authz/values.yaml's matching `migrate` block
    # (docs/adr/0016-migrate-job-sync-wave-not-hook.md) for the full incident/reasoning this
    # mirrors: the old `post-install,post-upgrade` hook is a PostSync hook that only fires once
    # every non-hook resource (including `main` above) is already Healthy, which deadlocks
    # permanently the moment a migration is itself a precondition for the new pods to pass their
    # readiness probe. `argocd.argoproj.io/sync-wave: "1"` runs this Job in an earlier wave than
    # `main`'s wave "2" instead, unconditionally.
    suffix: '{{ printf "%s:%s" .Values.global.authz_usage.image.repository .Values.global.authz_usage.image.version | sha256sum | trunc 10 }}'
    job:
      backoffLimit: 3
      # 7-day retention for post-incident inspection, on the native Kubernetes Job-controller GC
      # path -- see the matching comment in charts/lightbridge-authz/values.yaml for why this is
      # no longer "clean up before the next deploy's static name collides" (the `suffix` above
      # means each distinct image gets its own Job name, so there is nothing left to collide).
      ttlSecondsAfterFinished: 604800
    annotations:
      "argocd.argoproj.io/sync-wave": "1"
    containers:
      authz:
        image:
          repository: "{{ .Values.global.authz_usage.image.repository }}"
          tag: "{{ .Values.global.authz_usage.image.version }}"
          pullPolicy: IfNotPresent
        args:
          - migrate
          - --config-path
          - /etc/lightbridge/config.yaml
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DATABASE_URL

configMaps:
  config:
    enabled: true
    data:
      config.yaml: |-
        logging:
          level: info
        database:
          url: "${DATABASE_URL}"
          pool_size: 10
        otel:
          enabled: true
          otlp_endpoint: http://localhost:4317
          service_name: lightbridge-authz-usage
        server:
          usage:
            address: 0.0.0.0
            port: 3000
            tls:
              cert_path: /etc/lightbridge/tls/usage.crt
              key_path: /etc/lightbridge/tls/usage.key
          query:
            address: 0.0.0.0
            port: 3006
            tls:
              cert_path: /etc/lightbridge/tls/usage.crt
              key_path: /etc/lightbridge/tls/usage.key
              {{- with .Values.config.query.tls.clientCaBundlePath }}
              client_ca_bundle_path: {{ . | quote }}
              {{- end }}


service:
  authz:
    controller: main
    ports:
      http:
        port: 3000
      query:
        port: 3006

persistence:
  config:
    enabled: true
    type: configMap
    identifier: config
    advancedMounts:
      main:
        authz:
          - path: /etc/lightbridge/config.yaml
            subPath: config.yaml
            readOnly: true
      migrate:
        authz:
          - path: /etc/lightbridge/config.yaml
            subPath: config.yaml
            readOnly: true
  tls:
    enabled: true
    type: secret
    name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-tls'
    globalMounts:
      - path: /etc/lightbridge/tls
        readOnly: true

