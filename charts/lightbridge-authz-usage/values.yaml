enabled: true

global:
  authz_usage:
    image:
      version: "0.8.1"
      repository: "ghcr.io/adorsys-gis/lightbridge-authz-usage"

# Since #347, `UsageConfig::server` requires BOTH `usage` (the unauthenticated ingest listener)
# and `query` (the mTLS-required listener for `/usage/v1/usage/query` +
# `/usage/v1/spend/query`) -- see `UsageServerGroup` in
# crates/lightbridge-authz-usage/src/config.rs. A config omitting `server.query` fails to load
# (`config_missing_query_server_fails_to_load`), which is exactly what this chart used to render:
# neither `serve` nor `migrate` could start on Kubernetes. `configMaps.config.data."config.yaml"`
# below now renders both listeners.
config:
  query:
    tls:
      # Path (inside the mounted `*-tls` secret -- see `persistence.tls` below) to a PEM CA
      # bundle used to require and verify a client certificate on the query listener
      # (`Tls::client_ca_bundle_path`, crates/lightbridge-authz-core/src/config/mod.rs). The
      # query listener's router has no in-app auth of its own (mTLS at the TLS handshake IS the
      # access control for `/usage/v1/usage/query` + `/usage/v1/spend/query` -- see
      # `docs/lightbridge-query-api.md`'s warning banner), so an empty value here is a fail-OPEN
      # default, not a conservative one: the listener would still bind and its Service/container
      # port would still be reachable from any pod in the cluster, just with no client-certificate
      # check. `Tls::client_ca_bundle_path`'s own doc comment
      # (crates/lightbridge-authz-core/src/config/mod.rs) is explicit that there is deliberately
      # no "accept but don't require" mode for this reason. Default here is therefore
      # `/etc/lightbridge/tls/ca.crt` -- matching `docs/lightbridge-query-api.md`, the local
      # Compose config (`.docker/usage/container.yaml`), and `config/usage.yaml` -- so mTLS is ON
      # unless an operator explicitly turns it off.
      #
      # An unreadable/empty `ca.crt` at that path (e.g. the mounted `*-tls` secret has no CA entry
      # yet -- the built-in `global.tls.job` in charts/lightbridge-authz-stack mints independent
      # self-signed leaf certs per service today and does not publish one, unlike the local
      # Compose TLS generator, which signs every leaf off one shared CA) makes the usage binary
      # refuse to start LOUDLY (`crates/lightbridge-authz-core/src/server.rs`'s `build_mtls_config`)
      # -- the correct direction: fail closed and visibly, never silently unauthenticated.
      #
      # To run WITHOUT mTLS on this listener -- e.g. a local/dev install where no shared CA
      # exists at all -- set this to "" explicitly. `templates/common.yaml` then drops the query
      # listener's containerPort AND Service port entirely (see that file), so the deliberate
      # trade is "query endpoint unreachable" in exchange for "config still loads", never
      # "reachable and unauthenticated".
      clientCaBundlePath: "/etc/lightbridge/tls/ca.crt"
  # #570: `oauth2`/`scopeAuthority` below are exposed as real `.Values.config.*` knobs (mirroring
  # `config.query.tls.clientCaBundlePath` above) rather than hardcoded scalars inside
  # `configMaps.config.data."config.yaml"`'s text block, specifically so a values-repo override
  # can `--set`/patch just the field that needs to change (e.g. `scopeAuthority.baseUrl` once the
  # real in-cluster authz-opa address is known) without having to replace the entire rendered
  # config.yaml verbatim.
  #
  # DEPLOY ORDERING (see `docs/lightbridge-query-api.md`'s "#347 needs a companion ai-helm-values
  # change" paragraph for the full consequence chain): both `oauth2.jwksUrl` and every
  # `scopeAuthority.*` field below are MANDATORY -- `UsageConfig::oauth2`/`UsageConfig::
  # scope_authority` are non-`Option` fields (crates/lightbridge-authz-usage/src/config.rs), so a
  # config omitting either fails to load, taking down BOTH listeners (ingest -- usage/billing data
  # loss -- and query -- authz-budget's spend reads degrade to `Spend::Unavailable`, routing every
  # refill decision that depends on them to `manual_review`, never `auto_approve`). Because the
  # `migrate` Job runs at `argocd.argoproj.io/sync-wave: "1"` (before `main`'s wave `"2"`) and
  # ALSO loads this same config, a bad value here fails the migrate Job first and the whole
  # ArgoCD app sync with it -- not a partial degrade. These values MUST be supplied correctly in
  # THE SAME ROLLOUT that enables this version of the chart, not as a follow-up.
  oauth2:
    # Dev-local-shaped placeholder, same convention `charts/lightbridge-authz/values.yaml`'s own
    # `oauth2.jwks_url` uses -- real deployments MUST override with the actual in-cluster (or
    # external) Keycloak/OIDC provider JWKS endpoint.
    jwksUrl: "http://keycloak:9100/realms/dev/protocol/openid-connect/certs"
  scopeAuthority:
    # Dev-local-shaped placeholder ONLY, the same unsettled-cross-chart-address caveat this
    # chart's sibling `usage_service.base_url` (see `charts/lightbridge-authz/values.yaml`)
    # documents for the budget domain's reverse direction -- this chart and
    # `charts/lightbridge-authz` are separate Helm releases, so the real in-cluster authz-opa
    # Service DNS name depends on the umbrella chart's release/alias naming and is NOT settled
    # here. Real deployments MUST override this with that resolved address.
    baseUrl: "https://authz-opa:3001"
    # MUST match whatever `server.opa.basic_auth.username` resolves to on the
    # `lightbridge-authz` release being deployed against.
    username: authorino
    # Same CA bundle already mounted at this path for the query listener's own mTLS verification
    # above (`persistence.tls` mounts the whole `*-tls` secret at `/etc/lightbridge/tls`) --
    # authz-opa's server certificate is signed by the same cluster CA, so reusing this path (
    # rather than leaving `ca_bundle_path` unset, which falls back to the platform's default trust
    # store and would refuse to verify a private-CA-signed authz-opa certificate) is what lets
    # `RemoteScopeAuthority` actually verify authz-opa's TLS certificate instead of every usage
    # query failing closed to 403 at request time.
    caBundlePath: "/etc/lightbridge/tls/ca.crt"

controllers:
  main:
    type: deployment
    replicas: 1
    # Zero-downtime rollout -- see the matching comment in
    # charts/lightbridge-authz/values.yaml for the mechanism this fixes (bjw-s/common
    # defaults an unset `strategy` to `Recreate`, which killed all pods before creating
    # replacements on every deploy).
    # `unavailable` is quoted "0" (not bare int 0) -- see the full explanation in
    # charts/lightbridge-authz/values.yaml: bjw-s/common's `with .unavailable` treats an
    # int zero as empty and drops `maxUnavailable` from the render entirely.
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: "0"
      surge: 1
    podDisruptionBudget:
      maxUnavailable: 1
    # Second (later) sync-wave than `migrate` below -- see the matching comment in
    # charts/lightbridge-authz/values.yaml (docs/adr/0016-migrate-job-sync-wave-not-hook.md) for
    # the full incident/reasoning this mirrors.
    annotations:
      "argocd.argoproj.io/sync-wave": "2"
    containers:
      authz:
        image:
          repository: "{{ .Values.global.authz_usage.image.repository }}"
          tag: "{{ .Values.global.authz_usage.image.version }}"
          pullPolicy: IfNotPresent
        args:
          - serve
          - --config-path
          - /etc/lightbridge/config.yaml
        ports:
          - name: http
            containerPort: 3000
            protocol: TCP
          # mTLS-required query listener (#347). Port 3006 matches the local Compose config
          # (`.docker/usage/container.yaml`) and the port already named in
          # `.docker/authz/container.yaml`'s `usage_service.base_url` comment
          # ("port 3006, UsageServerGroup::query") -- i.e. the port every other reference to this
          # listener in the repo already assumes. This is NOT full parity with Compose, though:
          # Compose's ingest listener is 3002, while this chart's ingest listener (`http`, below)
          # stays 3000 -- that was this chart's port before this PR and is left unchanged
          # deliberately so nothing that already points at it breaks. Only the query port had no
          # prior chart convention to preserve, so it takes the value every other reference in
          # the repo already uses.
          #
          # This entry (and the matching `service.authz.ports.query` below) is dropped entirely
          # by `templates/common.yaml` when `.Values.config.query.tls.clientCaBundlePath` is
          # empty -- see that value's comment for why an unauthenticated-but-reachable query port
          # is never an acceptable default.
          - name: query
            containerPort: 3006
            protocol: TCP
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DATABASE_URL
          # #570: the Basic-auth credential `scope_authority.password` (rendered as `${DATABASE_URL}`-
          # style env interpolation below, never inlined as plain text in the ConfigMap) presents to
          # authz-opa's `POST /idp/v1/authorize-usage-scope`. Sourced from the SAME `opa-secret` Secret
          # and key `charts/lightbridge-authz/values.yaml:74-78` already reads for `authz-opa`'s own
          # `server.opa.basic_auth.password` -- this is one shared credential, not two, so both charts
          # MUST be pointed at the same Secret in the same namespace. IMPORTANT: this credential
          # unlocks the WHOLE authz-opa Basic-auth-protected router, not just the new
          # `authorize-usage-scope` route -- it is the identical credential Authorino itself presents
          # to `POST /v1/authorino/validate/introspect`, so treat it with the same sensitivity as any
          # other authz-opa client secret.
          OPA_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: opa-secret
                key: OPA_PASSWORD
        # Probes stay pointed at the ingest listener (`http`/3000) even though the query listener
        # exposes its own `/healthz*` routes too (UsageServerGroup::query's doc comment). With
        # `config.query.tls.clientCaBundlePath` defaulting to a real CA bundle (see that value's
        # comment), the query listener requires a client certificate at the TLS handshake, before
        # any HTTP request is even read (`Tls::client_ca_bundle_path`'s doc comment) -- a plain
        # kubelet `httpGet` probe presents none, so probing that port would refuse the handshake
        # and the pod would never go healthy. This mirrors Compose's own healthcheck
        # (`compose.yaml`'s `authz-usage` service), which also only ever probes the ingest port
        # (3002 there).
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
              httpGet:
                scheme: HTTPS
                path: /healthz
                port: http
          readiness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
              httpGet:
                scheme: HTTPS
                path: /healthz/ready
                port: http
          startup:
            enabled: true
            custom: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
              timeoutSeconds: 2
              httpGet:
                scheme: HTTPS
                path: /healthz/startup
                port: http

  migrate:
    type: job
    # NOT a Helm hook -- see charts/lightbridge-authz/values.yaml's matching `migrate` block
    # (docs/adr/0016-migrate-job-sync-wave-not-hook.md) for the full incident/reasoning this
    # mirrors: the old `post-install,post-upgrade` hook is a PostSync hook that only fires once
    # every non-hook resource (including `main` above) is already Healthy, which deadlocks
    # permanently the moment a migration is itself a precondition for the new pods to pass their
    # readiness probe. `argocd.argoproj.io/sync-wave: "1"` runs this Job in an earlier wave than
    # `main`'s wave "2" instead, unconditionally.
    #
    # `suffix` folds the rendered config data into the Job name, not just the image, mirroring
    # `charts/lightbridge-authz/values.yaml`'s identical `migrate.suffix` (see that file's much
    # longer comment for the full incident history and rejected alternatives). Short version,
    # ported here because this chart hit the exact same bug class: bjw-s stamps a
    # checksum/config annotation over the mounted ConfigMap into the pod template, so hashing the
    # image alone means a CONFIG-only values change (e.g. this very PR, which changes
    # `configMaps.config.data` without bumping `global.authz_usage.image.version`) re-renders the
    # SAME Job name with a DIFFERENT pod template. Kubernetes Jobs have an immutable
    # `spec.template`, so that apply is rejected outright, and ArgoCD's serverSideDiff dry-runs
    # the apply during diffing -- so the WHOLE app's sync fails, not just this Job (hit twice in
    # prod on 2026-08-24, #480). Folding `configMaps.config.data`'s own content into the hash
    # restores "same inputs -> same name -> identical spec; any changed input -> new name -> new
    # Job" for this chart too. Known residual, same as the sibling chart: a change scoped purely
    # to `controllers.migrate`'s own env/values still collides (cannot self-reference the hash)
    # -- remedy is `kubectl delete job <name>`, see #480.
    suffix: '{{ printf "%s:%s:%s" .Values.global.authz_usage.image.repository .Values.global.authz_usage.image.version (.Values.configMaps.config.data | toYaml | sha256sum) | sha256sum | trunc 10 }}'
    job:
      backoffLimit: 3
      # 7-day retention for post-incident inspection, on the native Kubernetes Job-controller GC
      # path -- see the matching comment in charts/lightbridge-authz/values.yaml for why this is
      # no longer "clean up before the next deploy's static name collides" (the `suffix` above
      # means each distinct image+config combination gets its own Job name, so there is nothing
      # left to collide).
      ttlSecondsAfterFinished: 604800
    annotations:
      "argocd.argoproj.io/sync-wave": "1"
    containers:
      authz:
        image:
          repository: "{{ .Values.global.authz_usage.image.repository }}"
          tag: "{{ .Values.global.authz_usage.image.version }}"
          pullPolicy: IfNotPresent
        args:
          - migrate
          - --config-path
          - /etc/lightbridge/config.yaml
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DATABASE_URL

configMaps:
  config:
    enabled: true
    data:
      config.yaml: |-
        logging:
          level: info
        database:
          url: "${DATABASE_URL}"
          pool_size: 10
        otel:
          enabled: true
          otlp_endpoint: http://localhost:4317
          service_name: lightbridge-authz-usage
        server:
          usage:
            address: 0.0.0.0
            port: 3000
            tls:
              cert_path: /etc/lightbridge/tls/usage.crt
              key_path: /etc/lightbridge/tls/usage.key
          query:
            address: 0.0.0.0
            port: 3006
            tls:
              cert_path: /etc/lightbridge/tls/usage.crt
              key_path: /etc/lightbridge/tls/usage.key
              {{- with .Values.config.query.tls.clientCaBundlePath }}
              client_ca_bundle_path: {{ . | quote }}
              {{- end }}
        # #570: validates the end-user bearer token `/usage/v1/usage/query` now requires. `type`
        # is required by the shared Oauth2 struct but has no effect here since this service never
        # mints anything. See `.Values.config.oauth2` above for the override knob and the
        # mandatory-deploy-ordering note.
        oauth2:
          type: external
          jwks_url: {{ .Values.config.oauth2.jwksUrl | quote }}
        # #570: the ownership authority `/usage/v1/usage/query` calls for `account`/`project`
        # scopes -- authz-opa's POST /idp/v1/authorize-usage-scope. See `.Values.config.scopeAuthority`
        # above for the override knobs and the mandatory-deploy-ordering note. `password` is NEVER
        # inlined as plain text here -- it is `${OPA_PASSWORD}` env interpolation
        # (`lightbridge_authz_core::config`'s `${VAR}` support), resolved at process startup from the
        # `OPA_PASSWORD` env var `controllers.main` sources from the `opa-secret` Secret above, the
        # same secret/key `charts/lightbridge-authz/values.yaml` already reads for authz-opa's own
        # `server.opa.basic_auth.password` -- never rendered into this ConfigMap in the clear.
        scope_authority:
          base_url: {{ .Values.config.scopeAuthority.baseUrl | quote }}
          username: {{ .Values.config.scopeAuthority.username | quote }}
          password: "${OPA_PASSWORD}"
          {{- with .Values.config.scopeAuthority.caBundlePath }}
          ca_bundle_path: {{ . | quote }}
          {{- end }}


service:
  authz:
    controller: main
    ports:
      http:
        port: 3000
      query:
        port: 3006

persistence:
  config:
    enabled: true
    type: configMap
    identifier: config
    advancedMounts:
      main:
        authz:
          - path: /etc/lightbridge/config.yaml
            subPath: config.yaml
            readOnly: true
      migrate:
        authz:
          - path: /etc/lightbridge/config.yaml
            subPath: config.yaml
            readOnly: true
  tls:
    enabled: true
    type: secret
    name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-tls'
    globalMounts:
      - path: /etc/lightbridge/tls
        readOnly: true

