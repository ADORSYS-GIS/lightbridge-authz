enabled: true

# Extra Host authorities accepted by the MCP server's `/mcp` DNS-rebinding protection, on top of
# the release's in-cluster Service name (which is added automatically). Set your ingress host(s)
# here for external access, e.g. `--set mcpAllowedHosts={mcp.example.com}`.
mcpAllowedHosts: []

global:
  authz_mcp:
    image:
      version: "0.8.1"
      repository: "ghcr.io/adorsys-gis/lightbridge-authz-mcp"

controllers:
  main:
    type: deployment
    replicas: 1
    # Zero-downtime rollout -- see the matching comment in
    # charts/lightbridge-authz/values.yaml for the mechanism this fixes (bjw-s/common
    # defaults an unset `strategy` to `Recreate`, which killed all pods before creating
    # replacements on every deploy).
    # `unavailable` is quoted "0" (not bare int 0) -- see the full explanation in
    # charts/lightbridge-authz/values.yaml: bjw-s/common's `with .unavailable` treats an
    # int zero as empty and drops `maxUnavailable` from the render entirely.
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: "0"
      surge: 1
    podDisruptionBudget:
      maxUnavailable: 1
    containers:
      authz:
        image:
          repository: "{{ .Values.global.authz_mcp.image.repository }}"
          tag: "{{ .Values.global.authz_mcp.image.version }}"
          pullPolicy: IfNotPresent
        args:
          - serve
          - --config-path
          - /etc/lightbridge/config.yaml
        ports:
          - name: http
            containerPort: 3000
            protocol: TCP
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DATABASE_URL
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
              httpGet:
                scheme: HTTPS
                path: /healthz
                port: http
          readiness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
              httpGet:
                scheme: HTTPS
                path: /healthz/ready
                port: http
          startup:
            enabled: true
            custom: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
              timeoutSeconds: 2
              httpGet:
                scheme: HTTPS
                path: /healthz/startup
                port: http

# ─────────────────────────────────────────────────────────────────────────────────────
# Single-source config (see templates/_config.tpl for the full contract — that file is
# kept BYTE-IDENTICAL with charts/lightbridge-authz/templates/_config.tpl; the chart tests
# assert it).
#
# `sharedConfig` here is the DEV / STANDALONE default. A real deployment supplies
# `global.lightbridge.sharedConfig`, which this chart reads from the SAME place the
# api/opa/idp/budget aliases do — that is what makes one edit reach all of them. That object
# REPLACES this one outright rather than deep-merging into it, so the local-dev placeholders
# below cannot leak into a production render.
# ─────────────────────────────────────────────────────────────────────────────────────
sharedConfig:
  logging:
    level: info
  database:
    url: "${DATABASE_URL}"
    pool_size: 10
  oauth2:
    # REQUIRED credential-issuance mode — no default. `self` mints self-signed JWT API keys
    # (uses `signing`); `external` exchanges at the upstream IdP (uses `issuance`). MUST match
    # the api service so both surfaces mint the same credential format.
    type: self
    signing:
      issuer: "https://authz-api:3000"
      audience: "lightbridge-api-key"
      ttl_seconds: 7776000
      max_key_age_days: 30
    jwks_url: http://keycloak:9100/realms/dev/protocol/openid-connect/certs
    # Expected audience claim(s) in JWT tokens. Set to restrict token acceptance.
    # Tokens must contain at least one matching audience value.
    #
    # Valid audience values:
    #   - lightbridge-api-key: Primary audience for API Key service
    #   - lightbridge-token-issuer: Audience for token issuer service
    #
    # For production, set via Helm values or environment variable:
    #   OAUTH2__AUDIENCE='["lightbridge-api-key"]'
    # For local development with multiple audiences:
    #   audience: ["lightbridge-api-key", "lightbridge-token-issuer"]
    audience: []
    # ADR-0025 Stage 1: the ONE issuer this deployment trusts for
    # remote-subject-to-account-id translation. REQUIRED -- lightbridge-mcp refuses to
    # start without it, the same as every authz-* component. MUST match the api service's
    # oauth2.federation.issuer. There is no longer a separate `oauth2.relying_party.issuer`
    # to also match -- that field was removed.
    federation:
      issuer: "http://keycloak:9100/realms/dev"
  server:
    api:
      address: 0.0.0.0
      port: 3000
      tls:
        cert_path: /etc/lightbridge/tls/api.crt
        key_path: /etc/lightbridge/tls/api.key
    opa:
      address: 0.0.0.0
      port: 3000
      tls:
        cert_path: /etc/lightbridge/tls/opa.crt
        key_path: /etc/lightbridge/tls/opa.key
      basic_auth:
        username: authorino
        password: "${OPA_PASSWORD}"
  otel:
    enabled: true
    otlp_endpoint: "http://localhost:4317"
    service_name: "lightbridge-authz"
  # `usage_service` is OPTIONAL here, exactly as it is for the budget alias in
  # charts/lightbridge-authz/values.yaml, and is deliberately not set. Since
  # lightbridge-authz#645 lightbridge-mcp serves the budget procedures too, so it builds the same
  # `budget_services` graph the budget listener builds -- and, like that listener, an unset
  # `usage_service` degrades every spend fact to `Spend::Unavailable` rather than failing startup.
  # Refill decisions that depend on spend then fail closed to manual review, never auto-approve.
  # NO new key is required for the pod to start; wiring a real `usage_service.base_url` here is the
  # same follow-up already noted on the budget alias, and belongs in `global.lightbridge.sharedConfig`
  # so both components get it in one edit.
  # Billing plans a caller may attach to an API key at creation. Operator-defined catalogue
  # (no plan table/entity): each plan has a stable id, UI name, and optional limits. A
  # CreateApiKey must name one of these ids or it is rejected (400); introspection resolves
  # the id to name + limits. `plans` also accepts a single JSON-array string via
  # "${BILLING_PLANS}".
  # NOTE: keep this catalogue in sync with charts/lightbridge-authz/values.yaml — API and MCP
  # share the same DB, so a key created under one must be creatable under the other.
  billing:
    plans:
      - id: free
        name: Free
        limits:
          requests_per_second: 5
          requests_per_day: 1000
          concurrent_requests: 2
      - id: pro
        name: Pro
        limits:
          requests_per_second: 50
          requests_per_day: 50000
          requests_per_month: 1000000
          concurrent_requests: 20
      # No `limits` block ⇒ unlimited on every dimension.
      - id: enterprise
        name: Enterprise

# Merged OVER the effective sharedConfig for THIS component only (maps merge recursively;
# scalars and lists are replaced wholesale). `server.api.allowed_hosts` lives here rather
# than in the shared object: it is MCP-only (rmcp streamable-HTTP DNS-rebinding protection)
# and it is templated per release.
configOverrides:
  server:
    api:
      # Host authorities MCP clients may present in the inbound Host header when reaching
      # `/mcp`. Consumed only by the MCP server. Defaults to this release's in-cluster
      # Service name (short + FQDN, with and without :3000) so pod-to-pod access works out
      # of the box; `/healthz` probes are never gated by this. Add ingress host(s) for
      # external access via `mcpAllowedHosts` above.
      # Each entry is an ordinary list item, so `lightbridge.config.render`'s `tpl` pass
      # resolves the release-derived names. `mcpAllowedHosts` is APPENDED to whatever this
      # list ends up being by templates/common.yaml — a structural `{{ range }}` cannot live
      # in a values file that is now real YAML data rather than a string blob.
      allowed_hosts:
        - localhost
        - 127.0.0.1
        - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
        - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}:3000'
        - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}.{{ $.Release.Namespace }}.svc.cluster.local'
        - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}.{{ $.Release.Namespace }}.svc.cluster.local:3000'

# Dotted paths removed AFTER the merge — for blocks this component must not see at all.
configOmit: []

configMaps:
  config:
    enabled: true
    data:
      # Deliberately one line — see charts/lightbridge-authz/values.yaml's matching comment.
      config.yaml: |
        {{ include "lightbridge.config.render" $ | indent 2 | trim }}

service:
  authz:
    controller: main
    ports:
      http:
        port: 3000

persistence:
  config:
    enabled: true
    type: configMap
    identifier: config
    advancedMounts:
      main:
        authz:
          - path: /etc/lightbridge/config.yaml
            subPath: config.yaml
            readOnly: true
  tls:
    enabled: true
    type: secret
    name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-tls'
    globalMounts:
      - path: /etc/lightbridge/tls
        readOnly: true

