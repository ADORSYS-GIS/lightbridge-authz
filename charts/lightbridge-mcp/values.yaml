enabled: true

# Extra Host authorities accepted by the MCP server's `/mcp` DNS-rebinding protection, on top of
# the release's in-cluster Service name (which is added automatically). Set your ingress host(s)
# here for external access, e.g. `--set mcpAllowedHosts={mcp.example.com}`.
mcpAllowedHosts: []

global:
  authz_mcp:
    image:
      version: "0.8.1"
      repository: "ghcr.io/adorsys-gis/lightbridge-authz-mcp"

controllers:
  main:
    type: deployment
    replicas: 1
    containers:
      authz:
        image:
          repository: "{{ .Values.global.authz_mcp.image.repository }}"
          tag: "{{ .Values.global.authz_mcp.image.version }}"
          pullPolicy: IfNotPresent
        args:
          - serve
          - --config-path
          - /etc/lightbridge/config.yaml
        ports:
          - name: http
            containerPort: 3000
            protocol: TCP
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DATABASE_URL
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
              httpGet:
                scheme: HTTPS
                path: /healthz
                port: http
          readiness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
              httpGet:
                scheme: HTTPS
                path: /healthz/ready
                port: http
          startup:
            enabled: true
            custom: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
              timeoutSeconds: 2
              httpGet:
                scheme: HTTPS
                path: /healthz/startup
                port: http

configMaps:
  config:
    enabled: true
    data:
      config.yaml: |-
        logging:
          level: info
        database:
          url: "${DATABASE_URL}"
          pool_size: 10
        oauth2:
          # REQUIRED credential-issuance mode — no default. `self` mints self-signed JWT API keys
          # (uses `signing`); `external` exchanges at the upstream IdP (uses `issuance`). MUST match
          # the api service so both surfaces mint the same credential format.
          type: self
          signing:
            issuer: "https://authz-api:3000"
            audience: "lightbridge-api-key"
            ttl_seconds: 7776000
            max_key_age_days: 30
          jwks_url: http://keycloak:9100/realms/dev/protocol/openid-connect/certs
          # Expected audience claim(s) in JWT tokens. Set to restrict token acceptance.
          # Tokens must contain at least one matching audience value.
          #
          # Valid audience values:
          #   - lightbridge-api-key: Primary audience for API Key service
          #   - lightbridge-token-issuer: Audience for token issuer service
          #
          # For production, set via Helm values or environment variable:
          #   OAUTH2__AUDIENCE='["lightbridge-api-key"]'
          # For local development with multiple audiences:
          #   audience: ["lightbridge-api-key", "lightbridge-token-issuer"]
          audience: []
        server:
          api:
            address: 0.0.0.0
            port: 3000
            tls:
              cert_path: /etc/lightbridge/tls/api.crt
              key_path: /etc/lightbridge/tls/api.key
            # Host authorities MCP clients may present in the inbound Host header when reaching
            # `/mcp` (rmcp streamable-HTTP DNS-rebinding protection). Consumed only by the MCP
            # server. Defaults to this release's in-cluster Service name (short + FQDN, with and
            # without :3000) so pod-to-pod access works out of the box; `/healthz` probes are
            # never gated by this. Add ingress host(s) for external access via `mcpAllowedHosts`
            # below (e.g. `--set mcpAllowedHosts={mcp.example.com}`).
            allowed_hosts:
              - localhost
              - 127.0.0.1
              - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
              - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}:3000'
              - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}.{{ $.Release.Namespace }}.svc.cluster.local'
              - '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}.{{ $.Release.Namespace }}.svc.cluster.local:3000'
              {{- range ($.Values.mcpAllowedHosts | default list) }}
              - {{ . | quote }}
              {{- end }}
          opa:
            address: 0.0.0.0
            port: 3000
            tls:
              cert_path: /etc/lightbridge/tls/opa.crt
              key_path: /etc/lightbridge/tls/opa.key
            basic_auth:
              username: authorino
              password: "${OPA_PASSWORD}"
        otel:
          enabled: true
          otlp_endpoint: "http://localhost:4317"
          service_name: "lightbridge-authz"
        # Billing plans a caller may attach to an API key at creation. Operator-defined catalogue
        # (no plan table/entity): each plan has a stable id, UI name, and optional limits. A
        # CreateApiKey must name one of these ids or it is rejected (400); introspection resolves
        # the id to name + limits. `plans` also accepts a single JSON-array string via
        # "${BILLING_PLANS}".
        billing:
          plans:
            - id: free
              name: Free
              limits:
                requests_per_second: 5
                requests_per_day: 1000
                concurrent_requests: 2
            - id: pro
              name: Pro
              limits:
                requests_per_second: 50
                requests_per_day: 50000
                requests_per_month: 1000000
                concurrent_requests: 20
            - id: enterprise
              name: Enterprise


service:
  authz:
    controller: main
    ports:
      http:
        port: 3000

persistence:
  config:
    enabled: true
    type: configMap
    identifier: config
    advancedMounts:
      main:
        authz:
          - path: /etc/lightbridge/config.yaml
            subPath: config.yaml
            readOnly: true
  tls:
    enabled: true
    type: secret
    name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-tls'
    globalMounts:
      - path: /etc/lightbridge/tls
        readOnly: true

