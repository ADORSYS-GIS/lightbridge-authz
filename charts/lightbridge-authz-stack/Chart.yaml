apiVersion: v2
name: lightbridge-authz-stack
description: >-
  Umbrella chart deploying the full lightbridge-authz stack (api, opa, idp,
  budget, usage, mcp)
type: application
version: 6.0.0
appVersion: 6.0.0
icon: https://adorsys.com/favicon.svg?v=05f867cc1aa036716c10a6c1d4ad6365
home: https://github.com/ADORSYS-GIS/lightbridge-authz
kubeVersion: '>=1.20.0-0'
keywords:
  - authz
  - oauth2
  - opa
  - tls
  - postgres
  - api
sources:
  - https://github.com/ADORSYS-GIS/lightbridge-authz
dependencies:
  - name: lightbridge-authz
    version: '*'
    repository: file://../lightbridge-authz
    alias: api
    condition: api.enabled
  - name: lightbridge-authz
    version: '*'
    repository: file://../lightbridge-authz
    alias: opa
    condition: opa.enabled
  - name: lightbridge-authz
    version: '*'
    repository: file://../lightbridge-authz
    alias: idp
    condition: idp.enabled
  - name: lightbridge-authz
    version: '*'
    repository: file://../lightbridge-authz
    alias: budget
    condition: budget.enabled
  - name: lightbridge-authz-usage
    version: '*'
    repository: file://../lightbridge-authz-usage
    alias: usage
    condition: usage.enabled
  - name: lightbridge-mcp
    version: '*'
    repository: file://../lightbridge-mcp
    alias: mcp
    condition: mcp.enabled
