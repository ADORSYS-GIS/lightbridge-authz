nameOverride: lightbridge

global:
  tlsSecretName: lightbridge-authz-tls
  # ── ONE config for every component ──────────────────────────────────────────────────
  # `global` is the ONLY channel Helm gives an umbrella chart for a value that every ALIAS
  # (api/opa/idp/budget, all four the same subchart) plus lightbridge-mcp can read. Set
  # `global.lightbridge.sharedConfig` to a YAML OBJECT (never a string) and it becomes the
  # single source of truth for every component's /etc/lightbridge/config.yaml — oauth2
  # signing + claim_mappers, rbac role_permissions, database, federation, otel, the lot.
  # Per-component identity (listeners, otel.service_name, client certs) goes in that
  # component's own `configOverrides`; blocks a component must NOT see go in its
  # `configOmit`. See charts/lightbridge-authz/templates/_config.tpl for the full contract
  # and docs/single-source-config.md for the diagrams.
  #
  # Left empty here on purpose: empty means "each subchart falls back to its own
  # dev-shaped `sharedConfig` default", which is what makes `helm install` of this umbrella
  # chart still produce a working local-dev stack. A non-empty value REPLACES those
  # defaults outright — it is never deep-merged into them, so no local-dev placeholder can
  # survive into a production render through a key the operator did not restate.
  lightbridge:
    sharedConfig: {}
  authz:
    image:
      version: "0.8.1"
      repository: "ghcr.io/adorsys-gis/lightbridge-authz"
  authz_mcp:
    image:
      version: "0.8.1"
      repository: "ghcr.io/adorsys-gis/lightbridge-authz-mcp"
  authz_usage:
    image:
      version: "0.8.1"
      repository: "ghcr.io/adorsys-gis/lightbridge-authz-usage"

  tls:
    enabled: false
    apiCommonName: lightbridge-authz-api
    opaCommonName: lightbridge-authz-opa
    idpCommonName: lightbridge-authz-idp
    budgetCommonName: lightbridge-authz-budget
    usageCommonName: lightbridge-authz-usage
    job:
      enabled: true
      image:
        repository: docker.io/bitnami/kubectl
        tag: 1.29.4
      restartPolicy: OnFailure
      backoffLimit: 3
      ttlSecondsAfterFinished: 300
      annotations: { }
      labels: { }
      serviceAccount:
        create: true
        automount: true
      role:
        create: true
      addKubectlOpenssl: true

api:
  enabled: true
  controllers:
    main:
      replicas: 1
      containers:
        authz:
          args:
            - api
            - --config-path
            - /etc/lightbridge/config.yaml
  persistence:
    tls:
      name: lightbridge-authz-tls

opa:
  enabled: true
  controllers:
    main:
      replicas: 2
      containers:
        authz:
          args:
            - opa
            - --config-path
            - /etc/lightbridge/config.yaml
  persistence:
    tls:
      name: lightbridge-authz-tls

# idp — the OIDC surface (/oauth2/token, /oauth2/revoke, /.well-known/openid-configuration,
# /.well-known/jwks.json), ADR-0012. Same image + shared lightbridge-authz subchart as api/opa,
# started with the `idp` subcommand instead. Unlike api/opa it is meant to be reached directly by
# browsers (eventually https://auth.ai.camer.digital), so it gets its own optional Ingress —
# default OFF: enabling it, wiring real DNS, and repointing auth.ai.camer.digital away from
# Keycloak are a deliberate, separate cutover once the service is verified serving
# byte-identical discovery/JWKS, not something this chart flips on for you.
idp:
  enabled: true
  controllers:
    main:
      replicas: 1
      containers:
        authz:
          args:
            - idp
            - --config-path
            - /etc/lightbridge/config.yaml
    # Inherits the subchart's `migrate` Job unchanged, same as api/opa (each aliased instance
    # already runs its own idempotent `migrate` against the shared DB today — pre-existing
    # redundancy, not something introduced here; the subchart's persistence.config.advancedMounts
    # is wired to that controller by name, so disabling it per-alias needs its own mount override
    # too, which isn't worth doing just for this).
  persistence:
    tls:
      name: lightbridge-authz-tls
  ingress:
    main:
      # Default OFF on purpose — see the block comment above. Flip this (and point real DNS at it)
      # in a follow-up, per-environment change, not here.
      enabled: false
      hosts:
        - host: auth.ai.camer.digital
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: authz
                port: 3000
      tls: []

# budget — the budget-domain RPC surface (`/budget/rpc/{op_id}`) PR #351 carried off `authz-api`
# as a hard cutover (not a transitional duplication like `idp` above): every `budget:*`-gated
# procedure now 404s on `authz-api` and only answers here. Same image + shared lightbridge-authz
# subchart as api/opa/idp, started with the `budget` subcommand instead. Budget RPCs will
# eventually need frontend exposure, but enabling that is a separate deliberate decision — the
# frontend can't call the new `/budget` prefix until converse-frontends#175 lands, so this gets an
# optional Ingress, default OFF, exactly like idp's. Host below is a best-effort placeholder (no
# real DNS convention exists for this surface yet) — confirm/replace before ever flipping
# `enabled: true`.
budget:
  enabled: true
  controllers:
    main:
      replicas: 1
      containers:
        authz:
          args:
            - budget
            - --config-path
            - /etc/lightbridge/config.yaml
    # Inherits the subchart's `migrate` Job unchanged, same as api/opa/idp (each aliased instance
    # already runs its own idempotent `migrate` against the shared DB today — pre-existing
    # redundancy, not something introduced here).
  persistence:
    tls:
      name: lightbridge-authz-tls
  ingress:
    main:
      # Default OFF on purpose — see the block comment above.
      enabled: false
      hosts:
        - host: budget.ai.camer.digital
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: authz
                port: 3000
      tls: []

usage:
  enabled: true
  persistence:
    tls:
      name: lightbridge-authz-usage-tls

mcp:
  enabled: true
  persistence:
    tls:
      name: lightbridge-authz-mcp-tls


rawRessources: [ ]