enabled: true

global:
  authz:
    image:
      version: "0.8.1"
      repository: "ghcr.io/adorsys-gis/lightbridge-authz"

controllers:
  main:
    type: deployment
    replicas: 1
    # bjw-s/common defaults an unset `strategy` to `Recreate` for Deployments (see the
    # library chart's own values.yaml comment: "Recreate (default) and RollingUpdate").
    # Nothing here ever set `strategy`, so every deploy of this controller (rendered 4x
    # via the stack chart's api/opa/idp/budget aliases) terminated all existing pods
    # before creating any replacement -- a full-availability gap on every rollout, not
    # just a rounding edge case on single-replica controllers. `unavailable: 0` forces
    # the replacement pod to be Ready before the old one is torn down; that needs one
    # extra pod's worth of headroom during the roll (bounded by `surge: 1`).
    #
    # `unavailable` MUST be the string "0", not the bare int 0: bjw-s/common's Deployment
    # template wraps it in `{{- with .unavailable }}`, and Go templates' `with` treats a
    # numeric zero as empty and silently drops the whole `maxUnavailable` key -- verified
    # by rendering with the int form: the key vanished from the output and Kubernetes'
    # own apiserver default (25%, rounding down) took over instead, which happens to
    # round to 0 at these replica counts today but isn't a promise. The quoted string
    # has non-zero length, so `with` treats it as present and renders `maxUnavailable: 0`
    # literally, which the IntOrString field accepts.
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: "0"
      surge: 1
    # No PodDisruptionBudget existed anywhere in this chart; prod compensated with a
    # hand-maintained `rawRessources` PodDisruptionBudget for only 2 of the 6 workloads
    # this chart family renders (see ai-helm-values `lightbridge-app.yaml`, which claims
    # the upstream chart "doesn't support controller PDBs natively" -- untrue as of the
    # vendored common 4.6.2: `controllers.<name>.podDisruptionBudget` is a native,
    # schema-documented key). `maxUnavailable: 1` matches that existing prod convention.
    podDisruptionBudget:
      maxUnavailable: 1
    # Second (later) sync-wave than `migrate` below (ADR: docs/adr/0016-migrate-job-sync-wave-not-hook.md).
    # ArgoCD applies wave N and waits for it to be Healthy before starting wave N+1, so the new
    # image's pods are never even created until the `migrate` Job of the SAME sync has completed
    # successfully. If migrate fails (Degraded, backoffLimit exhausted), the sync stops here --
    # this Deployment is never touched, so the currently-running (already-migrated) pods keep
    # serving. That is the fail-closed guarantee this deliberately replaces the old
    # `post-install,post-upgrade` Helm hook with: a PostSync hook only runs once every
    # non-hook resource -- including this Deployment -- is already Healthy, which is exactly
    # backwards when a migration is a startup precondition, and is what produced the prod
    # deadlock this ADR fixes (the new image can never pass its readiness probe without the
    # migration, so the Deployment can never go Healthy, so the PostSync hook that would run the
    # migration never fires).
    annotations:
      "argocd.argoproj.io/sync-wave": "2"
    containers:
      authz:
        image:
          repository: "{{ .Values.global.authz.image.repository }}"
          tag: "{{ .Values.global.authz.image.version }}"
          pullPolicy: IfNotPresent
        args:
          - serve
        ports:
          - name: http
            containerPort: 3000
            protocol: TCP
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DATABASE_URL
          OPA_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: opa-secret
                key: OPA_PASSWORD
          # Redis-backed rate limiting for authz-api only (see
          # docs/adr/0003-cratestack-crud-migration.md, "Rate limiting (Redis-backed)").
          # Provisioning the `redis-secret` Secret itself, and Redis's own deployment
          # topology (external managed instance vs. a new bundled subchart), are left
          # as a follow-up decision — this chart has no existing convention for
          # bundling a dependency database (postgresql/timescaledb aren't bundled
          # subcharts either; see compose.yaml / docs/platform-guides.md for how
          # DATABASE_URL is provisioned externally today).
          REDIS_URL:
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: REDIS_URL
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
              httpGet:
                scheme: HTTPS
                path: /healthz
                port: http
          readiness:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
              httpGet:
                scheme: HTTPS
                path: /healthz/ready
                port: http
          startup:
            enabled: true
            custom: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
              timeoutSeconds: 2
              httpGet:
                scheme: HTTPS
                path: /healthz/startup
                port: http

  migrate:
    type: job
    # NOT a Helm hook (see docs/adr/0016-migrate-job-sync-wave-not-hook.md for the full incident
    # and reasoning). This used to be a `post-install,post-upgrade` hook, which ArgoCD runs as a
    # PostSync hook -- fired only after every non-hook resource in the sync (including the `main`
    # Deployment above) is already Healthy. ADR-0015 made a rule-data field required at startup,
    # so the new pods can never pass their readiness probe without this migration having already
    # run -- meaning the Deployment can never go Healthy, so the PostSync hook that would run the
    # migration never fires. Confirmed live in prod 2026-08-19: `argocd app resources` showed zero
    # Job objects anywhere in the tree (managed or orphaned) and the sync operation's own
    # `syncResult.resources` never listed a `batch/Job` entry at all -- the Job was never created,
    # not created-then-deleted. `argocd.argoproj.io/sync-wave: "1"` below replaces the hook: an
    # ordinary, ArgoCD-tracked resource that runs and must go Healthy (Job Complete) in an earlier
    # wave than `main`'s wave "2", regardless of whether `main`'s pods are, or will ever be, ready.
    #
    # `suffix` (rendered via the same generic bjw-s/common `tpl` pass already used for this
    # chart's image repository/tag strings) ties this Job's own name to the image actually being
    # deployed. Kubernetes Jobs are otherwise immutable -- PR #150's incident was a STATIC-named
    # hook Job that got stuck and then silently no-op'd against every later deploy's attempt to
    # re-apply the same name with a different spec. A per-image name sidesteps that permanently:
    # a new image tag renders a new Job name (guaranteed to run), while re-syncing the SAME image
    # (e.g. a values-only change) re-renders the SAME name with an identical spec, which is a
    # true no-op, not a collision. Rejected alternatives: (1) a values-wide checksum suffix --
    # would mint a pointless new migrate Job on every unrelated values change (e.g. an Ingress
    # annotation), which the image tag alone does not; (2) `argocd.argoproj.io/sync-options:
    # Replace=true` on a static name -- forces `kubectl replace` on literally every sync/reconcile
    # (including ArgoCD's periodic no-op resyncs and every `selfHeal` pass), so the Job would be
    # deleted and recreated every few minutes even when nothing changed, defeating the
    # "inspectable" half of this same ADR; (3) `generateName` -- ArgoCD tracks/diffs managed
    # resources by exact name, so a random per-apply suffix cannot be reconciled against the
    # desired manifest and is a documented ArgoCD anti-pattern.
    # 2026-08-25 (#480, amending the paragraph above): the image alone is NOT the Job template's
    # full identity -- bjw-s stamps a checksum/config annotation over the mounted ConfigMap into
    # the pod template, so a CONFIG-only values change re-rendered the SAME Job name with a
    # DIFFERENT template. Kubernetes rejects that (completed Jobs have an immutable spec.template)
    # and, worse, ArgoCD's serverSideDiff dry-runs the apply, so the whole app's diff failed and
    # NOTHING synced -- hit twice on 2026-08-24 during config-only rollouts. Folding the config
    # content into the name hash restores the invariant the paragraph above intended: same
    # inputs -> same name -> identical spec (true no-op); ANY changed input -> new name -> new Job.
    # This is deliberately NOT the values-wide checksum rejected above: only the config data this
    # Job actually mounts participates. Known residual: a change scoped purely to
    # controllers.migrate's own env/values still collides (cannot self-reference the hash);
    # remedy stays `kubectl delete job <name>` -- see #480.
    # `configMaps.config.data` is now a fixed one-line template (see the `configMaps` block
    # at the bottom of this file), so hashing it raw would produce the SAME digest for every
    # possible config and reintroduce #480's collision. `lightbridge.config.checksum` hashes
    # the config this Job actually mounts instead, which is what the paragraph above always
    # meant.
    suffix: '{{ printf "%s:%s:%s" .Values.global.authz.image.repository .Values.global.authz.image.version (include "lightbridge.config.checksum" $) | sha256sum | trunc 10 }}'
    job:
      backoffLimit: 3
      # Bounded retention, not the old hook-delete-policy's job of "clean up so the next deploy's
      # static name doesn't collide" -- that concern no longer exists (see `suffix` above). This
      # is purely "how long does a completed migration stay inspectable" now: 7 days is enough to
      # diagnose an incident like this one after the fact (`kubectl describe job`, `kubectl logs`)
      # without Jobs accumulating forever, and runs on the native Kubernetes Job-controller GC
      # path, independent of ArgoCD's hook-finalizer / prune machinery entirely.
      ttlSecondsAfterFinished: 604800
    annotations:
      "argocd.argoproj.io/sync-wave": "1"
    containers:
      authz:
        image:
          repository: "{{ .Values.global.authz.image.repository }}"
          tag: "{{ .Values.global.authz.image.version }}"
          pullPolicy: IfNotPresent
        args:
          - migrate
          - --config-path
          - /etc/lightbridge/config.yaml
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DATABASE_URL

# ─────────────────────────────────────────────────────────────────────────────────────
# Single-source config (see templates/_config.tpl for the full contract).
#
# `sharedConfig` here is the DEV / STANDALONE default: it is what you get from
# `helm install charts/lightbridge-authz` on its own, and it is what the umbrella chart's
# api/opa/idp/budget aliases all inherit when nobody overrides it. Note that the idp-only
# (`oauth2.relying_party`, `oauth2.token_exchange`, `server.idp`) and budget-only
# (`server.budget`) blocks sit in the SAME object every alias reads: they are inert for the
# subcommands that never look at them, which is precisely why one shared object works.
#
# A real deployment supplies `global.lightbridge.sharedConfig` instead — the only channel
# Helm gives an umbrella chart for a value every ALIAS can see. That object REPLACES this
# one outright rather than deep-merging into it, so none of the local-dev placeholders
# below (`keycloak:9100`, the fixed `state_encryption_key`, …) can leak into a production
# render through a key the operator did not restate.
# ─────────────────────────────────────────────────────────────────────────────────────
sharedConfig:
  logging:
    level: info
  database:
    url: "${DATABASE_URL}"
    pool_size: 10
  # Redis-backed rate limiting for authz-api (see
  # docs/adr/0003-cratestack-crud-migration.md, "Rate limiting (Redis-backed)").
  redis:
    url: "${REDIS_URL}"
  oauth2:
    # REQUIRED credential-issuance mode — no default. `self` mints self-signed JWT API keys
    # (uses `signing`); `external` exchanges at the upstream IdP (uses `issuance`). Override
    # per environment.
    type: self
    signing:
      issuer: "https://authz-api:3000"
      audience: "lightbridge-api-key"
      ttl_seconds: 7776000
      max_key_age_days: 30
    jwks_url: http://keycloak:9100/realms/dev/protocol/openid-connect/certs
    # Expected audience claim(s) in JWT tokens. Set to restrict token acceptance.
    # Tokens must contain at least one matching audience value.
    #
    # Valid audience values:
    #   - lightbridge-api-key: Primary audience for API Key service
    #   - lightbridge-token-issuer: Audience for token issuer service
    #
    # For production deployment, override in your Helm values:
    #   configMaps:
    #     config:
    #       data:
    #         config.yaml: |
    #           oauth2:
    #             audience: ["lightbridge-api-key"]
    #
    # For local development with multiple audiences:
    #   audience: ["lightbridge-api-key", "lightbridge-token-issuer"]
    audience: []
    # ADR-0025 Stage 1: the ONE issuer this deployment trusts for
    # remote-subject-to-account-id translation. REQUIRED for every alias (api/opa/idp/
    # budget) and for lightbridge-mcp -- each refuses to start without it. This is the ONLY
    # issuer field -- `relying_party.issuer` below was removed (it used to have to be kept
    # byte-equal to this one by hand; that config trap is gone). Real deployments MUST
    # override this from their own values repo alongside relying_party. `discovery_url` is
    # left unset here (defaults to `issuer`): this chart's placeholder value already points
    # at the in-cluster `keycloak` service for both identity and discovery-dial purposes. A
    # deployment where the externally-reachable issuer differs from the in-cluster dial
    # target (e.g. local Compose's `localhost` vs `keycloak` split -- see
    # `.docker/authz/container.yaml`) should set `discovery_url` explicitly to the
    # in-cluster address.
    federation:
      issuer: "http://keycloak:9100/realms/dev"
    # REQUIRED for the `idp` alias only (ADR-0023: authz-idp is a full IdP — both this block
    # and `token_exchange` below are mandatory, `start_idp_server` refuses to start without
    # them). `authz-api`/`authz-opa`/`authz-budget` never read this block; it is harmless
    # dead config for their subcommands, kept in the same shared config.yaml because all
    # four aliases mount it identically (see this subchart's persistence.config). Real
    # deployments MUST override every value here from their own values repo (callback_url,
    # and above all state_encryption_key) — these are local-dev-shaped placeholders, not
    # production values, mirroring config/default.yaml's own precedent for this exact block.
    # The identity issuer now lives solely on `oauth2.federation.issuer` above.
    relying_party:
      client_id: "authz-idp-rp"
      callback_url: "https://authz-idp:3000/idp/callback"
      # Development-only fixed key. Production MUST override with a unique base64url-encoded
      # 32-byte key (config/default.yaml's KEYCLOAK_RP_STATE_ENCRYPTION_KEY precedent).
      state_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      # ADR-0024: separate AES-256-GCM key sealing the Keycloak token set at rest.
      # Development-only fixed key, deliberately different from state_encryption_key above
      # (KeycloakRelyingParty::new refuses a config where the two are equal). Production
      # MUST supply this via a secretKeyRef env (e.g. KEYCLOAK_RP_TOKEN_ENCRYPTION_KEY),
      # never inline in this ConfigMap-rendered values file.
      token_encryption_key: "QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI"
      timeout_ms: 5000
      browser_session_ttl_seconds: 28800
    # REQUIRED for the `idp` alias (ADR-0023) — see the comment on `relying_party` above.
    # `enabled: true` and `openid` present in `allowed_scopes` are both hard startup
    # requirements for authz-idp specifically.
    token_exchange:
      enabled: true
      access_ttl_seconds: 900
      authorization_code_ttl_seconds: 300
      refresh_ttl_seconds: 2592000
      refresh_absolute_ttl_seconds: 7776000
      refresh_reuse_grace_seconds: 30
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      device_code_ttl_seconds: 600
      device_poll_interval_seconds: 5
      device_verification_uri: "https://authz-idp:3000/device/verify"
  server:
    api:
      address: 0.0.0.0
      port: 3000
      tls:
        cert_path: /etc/lightbridge/tls/api.crt
        key_path: /etc/lightbridge/tls/api.key
    opa:
      address: 0.0.0.0
      port: 3000
      tls:
        cert_path: /etc/lightbridge/tls/opa.crt
        key_path: /etc/lightbridge/tls/opa.key
      basic_auth:
        username: authorino
        password: "${OPA_PASSWORD}"
    # OIDC surface (ADR-0012): /oauth2/token, /oauth2/revoke,
    # /.well-known/openid-configuration, /.well-known/jwks.json. Browser/client-facing, so —
    # unlike opa — no basic_auth. Mirrors server.opa's address/port/tls shape (same
    # address/port/tls_paths pattern the api/opa sections already use); the `idp` binary
    # subcommand this section configures is being implemented in a companion PR, so treat
    # this exact key name as a best-effort mirror to confirm against that PR's actual config
    # schema before merge, not a verified contract.
    idp:
      address: 0.0.0.0
      port: 3000
      tls:
        cert_path: /etc/lightbridge/tls/idp.crt
        key_path: /etc/lightbridge/tls/idp.key
    # Budget-domain RPC surface (`/budget/rpc/{op_id}`, PR #351's hard cutover off authz-api).
    # No basic_auth (unlike opa) — every route here is behind the same bearer-JWT
    # rpc_authorize gate authz-api already uses, per `BudgetServer`'s doc comment in
    # crates/lightbridge-authz-core/src/config/mod.rs. redis (above) is a hard requirement
    # for this server's rate limiting, already present in this shared config block. No
    # `oauth2.signing` dependency: this server never bootstraps a signing key, only validates
    # bearer tokens via `oauth2.jwks_url` (mirrors opa, unlike api/idp). `usage_service` is
    # intentionally not configured here yet — spend reads degrade to `Spend::Unavailable`
    # and refill decisions that depend on them fail closed to manual review; wiring a real
    # `usage_service.base_url` is a follow-up once the in-cluster usage-service address is
    # settled.
    budget:
      address: 0.0.0.0
      port: 3000
      tls:
        cert_path: /etc/lightbridge/tls/budget.crt
        key_path: /etc/lightbridge/tls/budget.key
      # ADR-0034 section 15: the remaining-snapshot refresher's pacing. See the same keys in
      # config/default.yaml for what each one trades. `snapshot_refresh_seconds` is the dominant
      # term of the forgiven-overspend window.
      # section 15.6 added the seed and the slow lane: every account with a budget grant or a
      # used, active API key inside `snapshot_seed_lookback_days` gets a row every tick, and an
      # idle account is demoted to `snapshot_slow_lane_minutes` rather than dropped.
      snapshot_refresh_seconds: 15
      snapshot_active_window_minutes: 1440
      snapshot_slow_lane_minutes: 10
      snapshot_seed_lookback_days: 30
      snapshot_batch: 500
      snapshot_concurrency: 8
  otel:
    enabled: true
    otlp_endpoint: "http://localhost:4317"
    service_name: "lightbridge-authz"
  # Billing plans a caller may attach to an API key at creation. Operator-defined catalogue
  # (no plan table/entity): each plan has a stable id, UI name, and optional limits. A
  # CreateApiKey must name one of these ids or it is rejected (400); introspection resolves
  # the id to name + limits. `plans` also accepts a single JSON-array string via
  # "${BILLING_PLANS}".
  # NOTE: keep this catalogue in sync with charts/lightbridge-mcp/values.yaml — API and MCP
  # share the same DB, so a key created under one must be creatable under the other.
  billing:
    plans:
      - id: free
        name: Free
        limits:
          requests_per_second: 5
          requests_per_day: 1000
          concurrent_requests: 2
      - id: pro
        name: Pro
        limits:
          requests_per_second: 50
          requests_per_day: 50000
          requests_per_month: 1000000
          concurrent_requests: 20
      # No `limits` block ⇒ unlimited on every dimension.
      - id: enterprise
        name: Enterprise

# Merged OVER the effective sharedConfig for THIS component only: maps merge recursively,
# scalars and LISTS are replaced wholesale. This is where per-component identity belongs —
# `otel.service_name`, the listener block for this component's subcommand, its own client
# certificates, and so on.
configOverrides: {}

# Dotted paths removed AFTER the merge. A merge can add a key; it can never take one away,
# so this is the only way to say "this component must not see that block at all" (e.g. opa
# has no Redis of its own and must not be handed one).
configOmit: []

configMaps:
  config:
    enabled: true
    data:
      # Deliberately one line. The content is assembled from `sharedConfig` +
      # `configOverrides` - `configOmit` above. bjw-s/common renders the ConfigMap's whole
      # `data` map through `tpl` with this chart's root context, so this include runs there;
      # `indent 2 | trim` keeps the literal block scalar that `toYaml` emits for this
      # multi-line value valid once the rendered config is spliced into it.
      config.yaml: |
        {{ include "lightbridge.config.render" $ | indent 2 | trim }}

service:
  authz:
    controller: main
    ports:
      http:
        port: 3000

persistence:
  config:
    enabled: true
    type: configMap
    identifier: config
    advancedMounts:
      main:
        authz:
          - path: /etc/lightbridge/config.yaml
            subPath: config.yaml
            readOnly: true
      migrate:
        authz:
          - path: /etc/lightbridge/config.yaml
            subPath: config.yaml
            readOnly: true
  tls:
    enabled: true
    type: secret
    name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-tls'
    globalMounts:
      - path: /etc/lightbridge/tls
        readOnly: true

