[workspace]
members = [
    "crates/lightbridge-authz-core",
    "crates/lightbridge-authz-rest",
    "app/lightbridge-authz",
    "app/lightbridge-authz-usage",
    "crates/lightbridge-authz-api",
    "crates/lightbridge-authz-api-key",
    "crates/lightbridge-authz-bearer",
    "crates/lightbridge-authz-usage",
]
resolver = "3"

[workspace.dependencies]
lightbridge-authz-core = { path = "./crates/lightbridge-authz-core" }
lightbridge-authz-rest = { path = "./crates/lightbridge-authz-rest" }
lightbridge-authz-api = { path = "./crates/lightbridge-authz-api" }
lightbridge-authz-api-key = { path = "./crates/lightbridge-authz-api-key" }
lightbridge-authz-bearer = { path = "./crates/lightbridge-authz-bearer" }
lightbridge-authz-usage-rest = { path = "./crates/lightbridge-authz-usage" }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
jsonwebtoken = { version = "11.0" }
# Resource-server JWT/JWKS validation (see crates/lightbridge-authz-bearer). This is the
# published crate that implements the module ADR-0004 refers to as "authkestra-resource" — that
# name is not published to crates.io (it exists only in the authkestra git repo, unreleased,
# behind a "resource" feature added after the 0.1.2/0.1.3 tags this workspace depends on).
# `authkestra-guard` (crate `authkestra_guard`, module `jwt`) is the currently-published
# equivalent: `ValidationConfig`/`JwksCache`/`validate_jwt_generic`, ground-truthed from source.
authkestra-guard = "0.1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "tracing", "net", "time"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "serde", "serde_json"] }
opentelemetry = { version = "0.32" }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "tokio"] }
opentelemetry-proto = "0.32"
tracing-opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
prost = "0.14"
axum = { version = "0.8", features = ["macros", "tracing"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
cuid = { version = "2", default-features = false, features = ["v2"] }
getrandom = "0.4"
goose = "0.18"
httpmock = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors"] }
rsa = { version = "0.9", features = ["pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", features = ["json", "form"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "json", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
utoipa = { version = "5", features = ["macros", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "reqwest"] }
regex = "1.10"
flate2 = "1.1.9"

rmcp = { version = "2.1.0", features = ["transport-streamable-http-server"] }

mimalloc = "0"

# cratestack: pinned to the same 0.4.13 release across the family so `cratestack-redis`'s
# `RateLimitStore` impl and `cratestack-axum`'s trait/config types stay in lockstep (see
# docs/adr/0003-cratestack-crud-migration.md, "Rate limiting (Redis-backed)"). 0.4.10 fixed the two
# upstream bugs this migration found and worked around (cratestack/cratestack#120, closing #116/#117
# — the workarounds are left in place for now, not reverted); 0.4.11 additionally caps unbounded
# list-route `limit`/`offset` at `MAX_LIST_LIMIT = 1000` (cratestack/cratestack#126, closing #123, a
# gap this migration also found and filed). 0.4.13 fixes the remaining two schema-authoring bugs this
# migration worked around — composite primary keys (`@@id([...])`, cratestack/cratestack#145) and
# `type` blocks referencing a model field (cratestack/cratestack#147) — both adopted directly in the
# schema now that they're fixed (see the `AccountMembership`/`ApiKeySecret` comments in
# `crates/lightbridge-authz-api/schema/authz.cstack`). See ADR-0003, "Known cratestack-pg 0.4.9 bugs"
# and "Pagination (`@@paged`)" for the full record.
cratestack-core = "0.4.13"
cratestack-axum = "0.4.13"
cratestack-redis = "0.4.13"
# Server facade (schema codegen + sqlx/axum runtime). Renamed to `cratestack` because the
# `include_server_schema!` macro emits `::cratestack::*` paths (see cratestack-pg lib docs). The
# generated schema module lives in `lightbridge-authz-api`; `lightbridge-authz-rest` also depends on
# it to build the RPC router (ADR-0003).
cratestack = { package = "cratestack-pg", version = "0.4.13" }
cratestack-codec-cbor = "0.4.13"
cratestack-codec-json = "0.4.13"
# Direct dep (also pulled in transitively via cratestack-codec-cbor -> minicbor-serde) so
# `lightbridge-authz-rest::codec::LenientCborCodec` can walk/rewrite CBOR frames at the token
# level via `minicbor::data::Token`/`minicbor::decode::Tokenizer` (both gated behind the "half"
# feature). See that module for why.
minicbor = { version = "2.2", features = ["std", "half"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }

# Debug/test builds ship line tables instead of full DWARF.
#
# Why: `--all-targets` builds 24 integration-test binaries, and Rust links each one statically
# against the whole graph (~577 crates). With cargo's default `debug = true` each artifact lands at
# 250-300 MB, almost all of it debug sections, and the LINKER has to hold that in memory — peak RSS
# per link runs several times the output size. Multiply by cargo's default job count (one per core)
# and the tail of a build is a dozen concurrent multi-GB links; that is what has been OOM-killing
# developer machines and starving the self-hosted CI runner until it drops its connection to
# GitHub (which also loses the logs, since the agent dies before uploading them).
#
# `line-tables-only` keeps what debugging actually needs day to day — panic backtraces with file
# and line numbers — and drops variable/type DWARF. Set `debug = true` locally when stepping
# through a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.prod]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
incremental = false
strip = true

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"
publish = false
authors = [
    "Stephane Segning <selastlambou@gmail.com>"
]
