[workspace]
members = [
    "crates/lightbridge-authz-core",
    "crates/lightbridge-authz-rest",
    "app/lightbridge-authz",
    "app/lightbridge-authz-usage",
    "crates/lightbridge-authz-api",
    "crates/lightbridge-authz-api-key",
    "crates/lightbridge-authz-bearer",
    "crates/lightbridge-authz-budget",
    "crates/lightbridge-authz-usage",
]
resolver = "3"

[workspace.dependencies]
lightbridge-authz-core = { path = "./crates/lightbridge-authz-core" }
lightbridge-authz-rest = { path = "./crates/lightbridge-authz-rest" }
lightbridge-authz-api = { path = "./crates/lightbridge-authz-api" }
lightbridge-authz-api-key = { path = "./crates/lightbridge-authz-api-key" }
lightbridge-authz-bearer = { path = "./crates/lightbridge-authz-bearer" }
lightbridge-authz-budget = { path = "./crates/lightbridge-authz-budget" }
lightbridge-authz-usage-rest = { path = "./crates/lightbridge-authz-usage" }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
# ⚠️ THIS VERSION IS COUPLED TO `authkestra-resource` BELOW. Bump them together or not at all.
#
# `lightbridge-authz-bearer` passes `Validation`/`Algorithm` values straight into authkestra's
# API, so both crates must resolve to the SAME jsonwebtoken major. When they don't, the lockfile
# carries both majors and the build fails with `error[E0308]: mismatched types` — the types are
# nominally identical but come from different crate versions. That broke `main` three times
# (#159, #166, #170) while authkestra-engine still required `^10.3.0`.
#
# Unblocked 2026-08-01: authkestra 0.3.2 moved to jsonwebtoken 11, which is what this pair now
# tracks (upstream marcjazz/authkestra#175). Verified before merging that the lockfile contains
# exactly ONE jsonwebtoken entry — `grep -A1 '^name = "jsonwebtoken"' Cargo.lock` must show a
# single 11.x. If you ever see two, that is the old failure recurring.
# ⚠️ `rust_crypto` is declared EXPLICITLY, not inherited. jsonwebtoken makes the
# crypto backend a required feature choice (`rust_crypto` or `aws_lc_rs`; neither
# is in `default`), and with neither selected, signing PANICS at runtime — this
# workspace signs in `lightbridge-authz-rest::signing` (RFC 8693 token exchange).
# It previously worked only because `authkestra-engine` happens to declare
# `features = ["rust_crypto"]` and Cargo unifies features across the graph. That
# made our signing path depend on someone else's feature choice: had authkestra
# switched to `aws_lc_rs` or dropped the dep, this would still compile and then
# panic on the first signing call. Declare what we need.
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
# Resource-server JWT/JWKS validation (see crates/lightbridge-authz-bearer). `authkestra-resource`
# (crate `authkestra_resource`, module `jwt`) is the published crate ADR-0004 originally referred
# to as unreleased — it is now live on crates.io. API shape (`ValidationConfig`/`JwksCache`/
# `validate_jwt_generic`) is identical to the `authkestra-guard` 0.1.0 it replaced, ground-truthed
# from source.
#
# ⚠️ Coupled to `jsonwebtoken` above — see that comment before moving either.
#
# ADR-0011 (authz issues a derived OIDC token object via token-exchange) adds `authkestra-op` and
# `authkestra-engine` as new direct dependencies — `authkestra-engine::token::TokenManager` mints
# the access/id tokens (replacing hand-rolled `jsonwebtoken::encode` in `signing.rs`), and
# `authkestra-op::handlers::{discovery,jwks}` replace the hand-built discovery/JWKS JSON. Every
# crate in the upstream authkestra workspace shares one `[workspace.package] version` via
# `version.workspace = true` (see the original 0.3.2 -> 0.4.0 lockstep note this replaces), so all
# three lines below MUST move together, exactly like the cratestack lockstep block further down —
# a partial bump within this trio reproduces that exact failure mode.
#
# The git-pin era is over. `marcjazz/authkestra` cut a real crates.io release, 0.5.0, on
# 2026-08-15, containing everything the previous git-rev pin (`a19cdd2`) carried (PR #207 —
# multi-value `Claims.aud`; PR #208 — the `OpStore::handle_token_exchange` override seam) plus
# three more merged fixes verified as ancestors of the `authkestra-op-v0.5.0` tag before this bump:
# PR #214 (`OidcDiscovery::authorization_endpoint` becomes `Option<String>`, omitted unless
# `authorization_code` is in `grant_types_supported`; `handle_authorization_code` now gates on
# `client.allows_grant_type` like every sibling grant handler), PR #215 (`extra["jti"]` is honored
# as a `jti` override across all four `TokenManager` issuance paths instead of producing an
# undecodable duplicate-key JWT — this repo now uses it to mint `lgbr:`-prefixed CUID2 `jti`s
# instead of authkestra's generated UUIDv4, closing the ADR-0039 gap `signing.rs`/`signing_tests.rs`
# used to document), and PR #217 (RFC 8693 §2.2.1's REQUIRED `issued_token_type` added to
# `TokenResponse`, and `default_handle_token_exchange` made `pub`). `authkestra-resource`'s source
# is unchanged across the whole `a19cdd2..authkestra-resource-v0.5.0` range (verified: `git diff`
# between them over `crates/authkestra-resource/` is empty) — it stays in the lockstep below only
# because every crate in the upstream workspace shares one `version.workspace = true`, not because
# it moved.
#
# `default_handle_token_exchange` being `pub` does NOT let this repo delete its own override in
# `crates/lightbridge-authz-rest/src/oauth2_op/store.rs` — evaluated and rejected, not overlooked.
# See that file's header comment for the two independent reasons delegation would silently break
# every real request.
#
# ⚠️ Every crate in the upstream authkestra workspace still shares one `version.workspace = true`,
# so all three lines below MUST move together on any future bump, exactly like the cratestack
# lockstep block further down — a partial bump within this trio reproduces the exact failure mode
# the old git-pin comment (see git history) documented for jsonwebtoken majors.
authkestra-resource = "0.5.0"
authkestra-op = "0.5.0"
authkestra-engine = "0.5.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "tracing", "net", "time"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "serde", "serde_json"] }
opentelemetry = { version = "0.32" }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "tokio"] }
opentelemetry-proto = "0.32"
tracing-opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
prost = "0.14"
axum = { version = "0.8", features = ["macros", "tracing"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
cuid = { version = "2", default-features = false, features = ["v2"] }
getrandom = "0.4"
goose = "0.18"
httpmock = "0.8"
# Dev-only: generates throwaway CA/leaf TLS keypairs at test runtime so tests can exercise real
# TLS handshakes (crates/lightbridge-authz-budget/tests/usage_service_ca_bundle_tests.rs) without
# ever committing a private key PEM to the repo -- gitleaks' `private-key` rule flags any committed
# RSA/EC private key by content regardless of whether it's a real secret, so a checked-in test
# fixture key is a guaranteed CI secret-scan failure. Same crate/version httpmock already vendors
# internally for its own "https" feature (unused here), so this doesn't add a new supply-chain
# surface to research.
rcgen = { version = "0.14", features = ["pem"] }
# Dev-only, alongside rcgen above: computes ATS-compliant (<=825 day) leaf-certificate validity
# windows relative to "now" so the generated test certs never go stale. Already resolved as
# rcgen's own transitive dependency; declared directly only so the test can call
# `OffsetDateTime::now_utc()` itself.
time = { version = "0.3", features = ["std"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors"] }
rsa = { version = "0.9", features = ["pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", features = ["json", "form"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "json", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
utoipa = { version = "5", features = ["macros", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "reqwest"] }
regex = "1.10"
flate2 = "1.1.9"

rmcp = { version = "3.0.1", features = ["transport-streamable-http-server"] }

mimalloc = "0"

# cratestack: pinned to the same 0.5.0 release across the family so `cratestack-redis`'s
# `RateLimitStore` impl and `cratestack-axum`'s trait/config types stay in lockstep (see
# docs/adr/0003-cratestack-crud-migration.md, "Rate limiting (Redis-backed)"). 0.4.10 fixed the two
# upstream bugs this migration found and worked around (cratestack/cratestack#120, closing #116/#117
# — the workarounds are left in place for now, not reverted); 0.4.11 additionally caps unbounded
# list-route `limit`/`offset` at `MAX_LIST_LIMIT = 1000` (cratestack/cratestack#126, closing #123, a
# gap this migration also found and filed). 0.4.13 fixes the remaining two schema-authoring bugs this
# migration worked around — composite primary keys (`@@id([...])`, cratestack/cratestack#145) and
# `type` blocks referencing a model field (cratestack/cratestack#147) — both adopted directly in the
# schema now that they're fixed (see the `AccountMembership`/`ApiKeySecret` comments in
# `crates/lightbridge-authz-api/schema/authz.cstack`). 0.4.16 fixes the connection-per-call bug in
# `RedisRateLimitStore`/`RedisIdempotencyStore` found while debugging intermittent `it-tests` 500s
# (cratestack/cratestack#174, fixed in #175 — see ADR-0003, "Known cratestack-redis bug found after
# this migration"). See ADR-0003, "Known cratestack-pg 0.4.9 bugs" and "Pagination (`@@paged`)" for
# the full record. 0.4.19 is a build-profile-only fix (cratestack/cratestack#250, see this repo's own
# `[profile.prod]` comment above) — no schema/API-surface change.
#
# 0.5.0 is a MINOR bump carrying a real breaking change (cratestack/cratestack#253): path-addressed
# relation filter free functions (`model::relation::field_op(...)`) were removed — that form was
# itself the exponential-codegen bug (cratestack/cratestack#252, 16-model schemas could not build).
# Checked before bumping: this workspace uses none of that form (only the chained
# `model::relation().field().op(...)` builder, which is unaffected) — verified with
# `grep -rnE "::[A-Za-z_]+_(eq|ne|in_|lt|lte|gt|gte|contains|starts_with|is_null|is_not_null|is_true|is_false|asc|desc)\("`
# across `crates/` and `app/` returning zero matches.
#
# 0.5.1 is a plain patch — cratestack/cratestack#257 only adds a relation-connectivity regression
# test fixture inside cratestack's own test suite (closing the coverage gap #253 left: no example or
# fixture anywhere in that repo was relation-dense enough to have caught #252 before it shipped).
# No API/schema-surface change.
#
# THE LOCKSTEP IS LOAD-BEARING, not stylistic. Dependabot moved four of these to 0.4.16
# (#158/#161/#162) and left the rest at 0.4.13, which broke `main`: 0.4.16's `cratestack-core` adds a
# `TransportStyle::Grpc` variant that 0.4.13's `cratestack-macros` does not cover, so the workspace
# stopped compiling with `error[E0004]: non-exhaustive patterns`. Bump every line below together, or
# none of them — a partial bump within a semver-compatible range is exactly the failure mode.
#
# SECOND OCCURRENCE (2026-08-14, this bump): Dependabot again moved `cratestack-core`/`-axum`/
# `-redis`/`-codec-cbor` to 0.7.1 and `cratestack-codec-json` to 0.7.6 (#227/#228/#229/#230 plus
# follow-on codec-json bumps, commits 6918d7c/a27df05/38e2bb1/eb5815a/5de5491/5d9f6e6) while leaving
# `cratestack` (`cratestack-pg`) pinned at 0.5.1 — the one line among these six whose `version =`
# sits inside a `{ package = "cratestack-pg", ... }` table instead of a bare `name = "x.y.z"` line.
# Not independently confirmed as Dependabot's actual root cause (no access to its updater internals
# from here), but it is the one structural difference between the line that got left behind and the
# five that didn't, twice in a row now. Result: two incompatible major lines resolved simultaneously
# (`cratestack-core` 0.5.2 AND 0.7.10, `cratestack-axum` 0.5.1 AND 0.7.5, both codecs duplicated),
# breaking `cargo check -p lightbridge-authz-rest` with `CodecSet<LenientCborCodec, JsonCodec>:
# HttpTransport` not satisfied plus a second `RateLimitStore` mismatch, both rooted in
# `crates/lightbridge-authz-api/src/lib.rs`'s `cratestack::include_server_schema!`. New baseline:
# every line below is 0.7.16, and `.github/dependabot.yml` now groups every `cratestack*` package
# into one PR so a future bump can no longer land partially regardless of the root cause above.
# Verify with `cargo metadata --format-version 1 | jq` (or equivalent) that every `cratestack-*`
# package name resolves to exactly one version — `cargo tree -d | grep cratestack` is NOT that
# check: it also prints single-version `cratestack-*` crates as leaves of other, unrelated
# already-duplicated packages (e.g. `bytes`, `windows_x86_64_msvc`), so it is not zero even on a
# fully consistent tree; don't use it as the pass/fail gate for this failure mode.
#
# THIRD OCCURRENCE (2026-08-18, dependabot#372, cratestack 0.7.16 -> 0.8.0): despite the grouping
# fix above and a `"cratestack*"` glob that does textually match `cratestack-pg`, Dependabot's PR
# again bumped only the five bare-`name = "x.y.z"` lines and left `cratestack` (`cratestack-pg`) at
# 0.7.16. crates.io confirms `cratestack-pg` 0.8.0 was published same-day as its five siblings, so
# this isn't a "not released yet" gap — bumped by hand here to close it before merging. Manifest-only
# theory, not confirmed against Dependabot's updater internals: `cratestack-pg`'s own `version =` is
# still the one line living inside a `{ package = "...", ... }` table rather than a bare
# `name = "x.y.z"` line, which may make it invisible to whatever the group-pattern matcher inspects
# even though the resulting *crate* name matches the glob. Third time this exact shape of line has
# been the one left behind — if this recurs on the next bump, that is strong enough signal to stop
# trusting Dependabot with this line at all and script a post-PR CI check that fails when it drifts
# from its five siblings, rather than relying on a human noticing during review.
# DO NOT run a bare `cargo update -p cratestack-<x>` (no `--precise`) on this family without first
# re-running `just it-tests` and specifically watching `batch_rpc_frames_enforce_permission_per_frame`
# / `batch_rpc_frames_succeed_and_fail_independently` / `budget_gated_op_ids_are_unreachable_on_authz_api_even_for_an_admin`
# in `crates/lightbridge-authz-rest/tests/rpc_it_tests.rs`. cratestack 0.8.4's `rpc_batch_dispatch`
# rewrite (its own CHANGELOG.md, "0.8.4 (2026-08-18)") makes `POST /rpc/batch` authenticate the real
# envelope exactly once (path `RPC_BATCH_PATH`) and thread that one `CratestackContext` through every
# frame via a new `CachedAuthProvider`, instead of calling `AuthProvider::authenticate` once per frame
# with that frame's own canonical `/rpc/<op_id>` path. `crates/lightbridge-authz-rest/src/
# auth_provider.rs`'s `CratestackAuthProvider::authenticate` — and the whole per-frame RBAC design
# `rpc_authorize.rs` documents — is built directly on the old per-frame-call contract: it derives
# `op_id` from `request.path` and looks it up in `required_permission`. Under 0.8.4, `request.path` is
# always the literal `/rpc/batch`, which isn't a mapped op-id, so `required_permission` returns `None`
# and the ENTIRE batch envelope is rejected `403 Forbidden` — not per-frame, every batch call,
# regardless of caller permissions. Confirmed by hand (2026-08-18): all three tests above pass at
# exactly 0.8.0 and fail this exact way the moment any part of the family floats to 0.8.4. This is why
# every line in this block is pinned in `Cargo.lock` to precisely 0.8.0 via repeated
# `cargo update -p <pkg> --precise 0.8.0` rather than left to `cargo update`'s normal
# newest-compatible-within-`^0.8.0` resolution — Cargo.toml's `"0.8.0"` requirement string alone would
# not have caught this, since 0.8.1-0.8.4 are semver-compatible and cargo prefers the newest match.
# Landing past 0.8.0 needs `CratestackAuthProvider`/`rpc_authorize.rs` reworked against the new
# once-per-envelope contract first (`CachedAuthProvider` or equivalent) — that is real, security-
# critical surgery, not a lockfile bump, and deliberately out of scope for the 0.7.16->0.8.0 dependency
# upgrade this pin block's history otherwise documents.
cratestack-core = "0.8.0"
cratestack-axum = "0.8.0"
cratestack-redis = "0.8.0"
# Server facade (schema codegen + sqlx/axum runtime). Renamed to `cratestack` because the
# `include_server_schema!` macro emits `::cratestack::*` paths (see cratestack-pg lib docs). The
# generated schema module lives in `lightbridge-authz-api`; `lightbridge-authz-rest` also depends on
# it to build the RPC router (ADR-0003).
cratestack = { package = "cratestack-pg", version = "0.8.0" }
cratestack-codec-cbor = "0.8.0"
cratestack-codec-json = "0.8.0"
# Direct dep (also pulled in transitively via cratestack-codec-cbor -> minicbor-serde) so
# `lightbridge-authz-rest::codec::LenientCborCodec` can walk/rewrite CBOR frames at the token
# level via `minicbor::data::Token`/`minicbor::decode::Tokenizer` (both gated behind the "half"
# feature). See that module for why.
minicbor = { version = "2.2", features = ["std", "half"] }
# lightbridge-authz#363: `tokio-rustls-comp` is a superset of the previous `tokio-comp` (it
# enables `tls-rustls` + `tokio-comp` together — see docs.rs/crate/redis/1.5.0/features), so
# `rediss://` URLs now build a rustls-backed TLS connection via `redis::Client::build_with_tls`
# (see `crates/lightbridge-authz-rest/src/redis_tls.rs`) while plain `redis://` (local Compose)
# is untouched. Deliberately NOT `tls-rustls-webpki-roots` (trusts public roots, wrong for the
# cluster's internal self-signed CA) and NOT `tls-rustls-insecure` (skips verification — the
# ticket explicitly forbids trading a working TLS tunnel for an unverified one).
redis = { version = "1", features = ["tokio-rustls-comp", "connection-manager"] }
# Dev-only: `redis_tls_tests.rs` spins up a raw rustls TLS TCP acceptor (no HTTP framing) to
# prove `redis_tls::build_redis_client` actually verifies the server certificate against the
# configured CA, not just plumbs the config through. `^0.26` matches what `tokio-rustls-comp`
# above already pulls in transitively, so this adds no new major version to the tree.
tokio-rustls = "0.26"

# Debug/test builds ship line tables instead of full DWARF.
#
# Why: `--all-targets` builds 24 integration-test binaries, and Rust links each one statically
# against the whole graph (~577 crates). With cargo's default `debug = true` each artifact lands at
# 250-300 MB, almost all of it debug sections, and the LINKER has to hold that in memory — peak RSS
# per link runs several times the output size. Multiply by cargo's default job count (one per core)
# and the tail of a build is a dozen concurrent multi-GB links; that is what has been OOM-killing
# developer machines and starving the self-hosted CI runner until it drops its connection to
# GitHub (which also loses the logs, since the agent dies before uploading them).
#
# `line-tables-only` keeps what debugging actually needs day to day — panic backtraces with file
# and line numbers — and drops variable/type DWARF. Set `debug = true` locally when stepping
# through a debugger.
# ─────────────────────────────────────────────────────────────────────────────
# Lints. Levels live here; the knobs individual lints read live in clippy.toml.
#
# ⚠️ CI runs `cargo clippy --all-targets --all-features -- -D warnings`, so
# there is NO advisory tier in this repo: `warn` and `deny` both fail the build.
# Every level below was MEASURED at zero on this workspace before being set.
#
# Measure before you add one, and `cargo clean -p <crate>` before believing the
# number: a cached clippy run reports clean without having looked. Verified
# here — a warm run reported 0 `unwrap_used` against a tree that has 55 of them.
#
# DELIBERATELY NOT ENABLED, with the measured reason:
#   clippy::pedantic  — 178 hits (doc_markdown 8, default_trait_access 7,
#                       too_many_lines 6, match_same_arms 6, cast_* 6, …).
#                       Under -D warnings this would break the build, not advise.
#   expect_used       — 3 hits, and they are the three that used to be `unwrap`
#                       (see below). Each is an impossibility proof carrying its
#                       invariant in the message, which is exactly the carve-out
#                       the guide allows — so this stays off deliberately rather
#                       than pending.
#   panic             — 3 hits outside this crate, same treatment pending.
#   map_unwrap_or     — 4 hits.
#   unnecessary_wraps — 2 hits.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

#   unsafe_code       — NOT enabled, and this one is worth wanting: this is the
#                       authentication boundary for every protected service on the
#                       platform. Measured 13+ `unsafe` blocks, ALL in test code and
#                       all the same cause — `std::env::set_var`/`remove_var` became
#                       unsafe in edition 2024 (not thread-safe). There is no
#                       `allow-unsafe-in-tests` knob, so enabling it workspace-wide
#                       needs `#[expect(unsafe_code, reason = ...)]` on every affected
#                       test, or a test helper that centralises the env mutation.
#                       Shipping code has ZERO unsafe — verify with:
#                         grep -rn "unsafe {" crates/*/src app/*/src

[workspace.lints.clippy]
# correctness + suspicious + style + complexity + perf. Already at zero, since
# CI has run `-D warnings` for a while — so this pins the status quo.
all = { level = "deny", priority = -1 }

# Apollo §2.3's table, each verified at zero on this workspace.
#
# `redundant_clone` is a *nursery* lint, so a `clippy::pedantic` measurement does
# NOT cover it — which is how it was initially mis-recorded as zero here. It had
# 4 real hits in app/lightbridge-authz/src/mcp.rs; all four were last-use clones
# (the value was dropped immediately after) and are now moves. Enabled.
redundant_clone = "deny"
needless_borrow = "deny"
manual_ok_or = "deny"
large_enum_variant = "deny"
clone_on_copy = "deny"
needless_collect = "deny"

# Apollo §4.2: no `unwrap` in shipping code. The three that existed — a
# LazyLock-wrapped compile-constant `Regex::new` and two `caps.get(0)` on an
# already-matched capture, all in config/mod.rs — are now `.expect()` carrying
# the invariant in the message, which is the form the guide asks for. Tests are
# exempted via `allow-unwrap-in-tests` in clippy.toml.
unwrap_used = "deny"

# Hygiene, all at zero.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
missing_safety_doc = "deny"

[profile.dev]
debug = "line-tables-only"

# Deliberately not the same as `[profile.release]` (cargo defaults: opt-level 3,
# codegen-units 16, no LTO) — that stays cheap for local/CI `--release` runs.
# `prod` is what `Dockerfile` actually builds (`cargo build --profile prod`), so it's
# the one place fat LTO + a single codegen unit is worth its cost: measured on
# cratestack-pg's own release pipeline (cratestack/cratestack#250), this combination
# runs ~1.5-2.3x the peak build RAM of `lto = "thin"` in exchange for a meaningfully
# smaller binary (66% smaller on a representative Postgres-backed service binary).
# Worth it once per deploy build in a properly provisioned CI job; would not be worth
# it as the blanket default profile — that's what caused prod build memory to climb
# to 12Gi across every cratestack-based service before this split existed.
[profile.prod]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
incremental = false
strip = true

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"
